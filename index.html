ery chip.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M60 55L60 125\"/><path class=\"s\" d=\"M80 55L80 125\"/><path class=\"s\" d=\"M20 90L60 90\"/><path class=\"s\" d=\"M80 90L120 90\"/><path class=\"s\" d=\"M150 150L305 150\"/><path class=\"s\" d=\"M150 150L150 30\"/><path class=\"dash\" d=\"M150 42L305 42\"/><path class=\"dash\" d=\"M190 150L190 82\"/><path class=\"a\" d=\"M150 150 C178 78 215 50 300 44\"/></g><text class=\"r\" x=\"46\" y=\"56\" text-anchor=\"middle\" style=\"font-size:22px\">+</text><text class=\"\" x=\"94\" y=\"56\" text-anchor=\"middle\" style=\"font-size:22px\">−</text><text class=\"\" x=\"190\" y=\"168\" text-anchor=\"middle\" style=\"font-size:15px\">1 RC</text><text class=\"r\" x=\"214\" y=\"92\" text-anchor=\"middle\" style=\"font-size:17px\">63%</text><text class=\"\" x=\"302\" y=\"168\" text-anchor=\"end\" style=\"font-size:15px\">time</text><text class=\"\" x=\"156\" y=\"26\" text-anchor=\"start\" style=\"font-size:15px\">voltage</text></svg>"}, {"type": "widget", "widget": "divider", "title": "Try it: the voltage divider", "formula": "Vout = Vin × R2 ÷ (R1 + R2)", "text": "Two resistors in series split a voltage in proportion to their values. It's the standard way to bring a 5 V or 12 V signal down to the 3.3 V an ESP32 pin can take."}], "quiz": [{"q": "A white LED (Vf 3 V) runs from 12 V at 10 mA. Which resistor?", "options": ["90 Ω", "300 Ω", "900 Ω", "1.2 kΩ"], "answer": 2, "explain": "R = (12 − 3) ÷ 0.010 = 900 Ω. You'd pick the next standard value up, 1 kΩ."}, {"q": "Bands brown, black, orange. What's the value?", "options": ["10 Ω", "1 kΩ", "10 kΩ", "103 Ω"], "answer": 2, "explain": "Brown 1, black 0, orange ×1000 → 10 × 1000 = 10 kΩ."}, {"q": "In a divider with R1 = R2 and Vin = 10 V, Vout is…", "options": ["10 V", "5 V", "2.5 V"], "answer": 1, "explain": "Equal resistors split the voltage in half."}]}, {"id": "tr-mcu", "title": "Signals & microcontrollers", "summary": "How a chip like the ESP32 reads and controls the real world.", "cards": [{"type": "concept", "title": "Digital vs. analog", "text": "A digital signal has two states: low (0) or high (1, often 3.3 V). An analog signal can be any value in a range, like a temperature sensor's output.\n\nMicrocontrollers are digital at heart. To deal with analog they use an ADC to read and PWM to fake an output.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"a\" d=\"M20 60 H60 V25 H100 V60 H140 V25 H180 V60 H220 V25 H260 V60 H300\"/><path class=\"r\" d=\"M20 130 L22 127.3 L24 124.6 L26 122 L28 119.4 L30 117 L32 114.7 L34 112.6 L36 110.7 L38 109 L40 107.5 L42 106.2 L44 105.3 L46 104.6 L48 104.1 L50 104 L52 104.1 L54 104.6 L56 105.3 L58 106.2 L60 107.5 L62 109 L64 110.7 L66 112.6 L68 114.7 L70 117 L72 119.4 L74 122 L76 124.6 L78 127.3 L80 130 L82 132.7 L84 135.4 L86 138 L88 140.6 L90 143 L92 145.3 L94 147.4 L96 149.3 L98 151 L100 152.5 L102 153.8 L104 154.7 L106 155.4 L108 155.9 L110 156 L112 155.9 L114 155.4 L116 154.7 L118 153.8 L120 152.5 L122 151 L124 149.3 L126 147.4 L128 145.3 L130 143 L132 140.6 L134 138 L136 135.4 L138 132.7 L140 130 L142 127.3 L144 124.6 L146 122 L148 119.4 L150 117 L152 114.7 L154 112.6 L156 110.7 L158 109 L160 107.5 L162 106.2 L164 105.3 L166 104.6 L168 104.1 L170 104 L172 104.1 L174 104.6 L176 105.3 L178 106.2 L180 107.5 L182 109 L184 110.7 L186 112.6 L188 114.7 L190 117 L192 119.4 L194 122 L196 124.6 L198 127.3 L200 130 L202 132.7 L204 135.4 L206 138 L208 140.6 L210 143 L212 145.3 L214 147.4 L216 149.3 L218 151 L220 152.5 L222 153.8 L224 154.7 L226 155.4 L228 155.9 L230 156 L232 155.9 L234 155.4 L236 154.7 L238 153.8 L240 152.5 L242 151 L244 149.3 L246 147.4 L248 145.3 L250 143 L252 140.6 L254 138 L256 135.4 L258 132.7 L260 130 L262 127.3 L264 124.6 L266 122 L268 119.4 L270 117 L272 114.7 L274 112.6 L276 110.7 L278 109 L280 107.5 L282 106.2 L284 105.3 L286 104.6 L288 104.1 L290 104 L292 104.1 L294 104.6 L296 105.3 L298 106.2 L300 107.5\"/></g><text class=\"a\" x=\"300\" y=\"18\" text-anchor=\"end\" style=\"font-size:17px\">digital: 0 or 1</text><text class=\"r\" x=\"300\" y=\"175\" text-anchor=\"end\" style=\"font-size:16px\">analog: any value</text></svg>"}, {"type": "concept", "title": "PWM: dimming by blinking", "text": "Pulse-width modulation switches a pin fully on and off very fast. The fraction of time it's on is the duty cycle. An LED or motor responds to the average: 25% duty on a 12 V supply behaves roughly like 3 V.\n\nIt's efficient because the switch is always fully on or fully off, so little energy is wasted as heat.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"a\" d=\"M20 60 V25 H37.5 V60 H90 M90 60 V25 H107.5 V60 H160 M160 60 V25 H177.5 V60 H230 M230 60 V25 H247.5 V60 H300\"/><path class=\"a\" d=\"M20 140 V105 H72.5 V140 H90 M90 140 V105 H142.5 V140 H160 M160 140 V105 H212.5 V140 H230 M230 140 V105 H282.5 V140 H300\"/><path class=\"dashr\" d=\"M20 51L300 51\"/><path class=\"dashr\" d=\"M20 114L300 114\"/></g><text class=\"\" x=\"20\" y=\"16\" text-anchor=\"start\" style=\"font-size:17px\">25% duty → dim</text><text class=\"\" x=\"20\" y=\"97\" text-anchor=\"start\" style=\"font-size:17px\">75% duty → bright</text><text class=\"r\" x=\"300\" y=\"172\" text-anchor=\"end\" style=\"font-size:15px\">dashed = average</text></svg>"}, {"type": "concept", "title": "Pull-up resistors", "text": "An input pin connected to nothing 'floats' and picks up noise, randomly reading 0 or 1. A pull-up resistor ties it gently to 3.3 V so it reads 1 by default. Press the button and the pin connects to ground, reading 0.\n\nMost microcontrollers have internal pull-ups you can switch on in code.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"r\" d=\"M60 25L200 25\"/><path class=\"s\" d=\"M130 25L130 35\"/><path class=\"s\" d=\"M130 35L123 38.3L137 45L123 51.7L137 58.3L123 65L137 71.7L130 75\"/><path class=\"s\" d=\"M130 75L130 95\"/><circle class=\"fi\" cx=\"130\" cy=\"95\" r=\"3\"/><path class=\"s\" d=\"M130 95L250 95\"/><path class=\"s\" d=\"M130 95L130 120\"/><circle class=\"fi\" cx=\"130\" cy=\"120\" r=\"3\"/><path class=\"s\" d=\"M130 120L152 134\"/><circle class=\"fi\" cx=\"130\" cy=\"146\" r=\"3\"/><path class=\"s\" d=\"M130 154L130 162\"/><path class=\"s\" d=\"M116 162L144 162\"/><path class=\"s\" d=\"M121 167L139 167\"/><path class=\"s\" d=\"M126 172L134 172\"/></g><text class=\"r\" x=\"62\" y=\"18\" text-anchor=\"start\" style=\"font-size:17px\">3.3 V</text><text class=\"\" x=\"148\" y=\"60\" text-anchor=\"start\" style=\"font-size:17px\">10 kΩ</text><text class=\"\" x=\"256\" y=\"100\" text-anchor=\"start\" style=\"font-size:17px\">GPIO</text><text class=\"\" x=\"116\" y=\"140\" text-anchor=\"end\" style=\"font-size:16px\">button</text><text class=\"a\" x=\"240\" y=\"130\" text-anchor=\"middle\" style=\"font-size:16px\">idle = 1</text><text class=\"a\" x=\"240\" y=\"150\" text-anchor=\"middle\" style=\"font-size:16px\">pressed = 0</text></svg>"}, {"type": "formula", "title": "ADC resolution", "formula": "step = Vref ÷ 2ⁿ", "text": "An analog-to-digital converter turns a voltage into a number. An n-bit ADC has 2ⁿ steps. The ESP32's 12-bit ADC gives 4096 steps over about 3.3 V.\n\nIts readings are less accurate near 0 V and near the top of the range, so keep signals in the middle where you can.", "example": ["12-bit ADC, 3.3 V reference", "3.3 ÷ 4096", "≈ 0.8 mV per step"], "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M30 150L300 150\"/><path class=\"s\" d=\"M30 150L30 20\"/><path class=\"r\" d=\"M30 150L290 30\"/><path class=\"a\" d=\"M30 150 V135 H62.5 V120 H95.0 V105 H127.5 V90 H160.0 V75 H192.5 V60 H225.0 V45 H257.5 V30 H290.0\"/></g><text class=\"\" x=\"298\" y=\"170\" text-anchor=\"end\" style=\"font-size:15px\">input voltage</text><text class=\"\" x=\"36\" y=\"16\" text-anchor=\"start\" style=\"font-size:15px\">reading</text><text class=\"a\" x=\"230\" y=\"130\" text-anchor=\"middle\" style=\"font-size:16px\">each step = 1 code</text></svg>"}], "quiz": [{"q": "A 12 V motor gets PWM at 50% duty. It behaves roughly as if it had…", "options": ["12 V", "6 V", "0.5 V", "24 V"], "answer": 1, "explain": "The average of 12 V on half the time is 6 V."}, {"q": "What does a 'floating' input do?", "options": ["Always reads 1", "Always reads 0", "Reads randomly because it picks up noise"], "answer": 2, "explain": "With nothing defining its level, the pin picks up stray charge. A pull-up or pull-down fixes that."}, {"q": "How many steps does a 10-bit ADC have?", "options": ["10", "100", "1024", "4096"], "answer": 2, "explain": "2¹⁰ = 1024."}]}]}, "mechanics": {"id": "mechanics", "topic": "mech", "title": "Engineering", "version": 1, "blurb": "Forces, machines and the shapes that keep structures standing.", "lessons": [{"id": "me-forces", "title": "Forces, levers & gears", "summary": "Why a long spanner works, and how machines trade force for distance.", "cards": [{"type": "formula", "title": "Force, mass and weight", "formula": "F = m × a", "text": "A force makes a mass accelerate. Weight is just the force of gravity on a mass: W = m × g, with g ≈ 9.81 m/s² on Earth. Mass is measured in kg; force and weight in newtons (N).", "example": ["A 10 kg box", "W = 10 × 9.81", "≈ 98 N"], "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M20 140L300 140\"/><path class=\"s\" d=\"M30 140L22 150\"/><path class=\"s\" d=\"M46 140L38 150\"/><path class=\"s\" d=\"M62 140L54 150\"/><path class=\"s\" d=\"M78 140L70 150\"/><path class=\"s\" d=\"M94 140L86 150\"/><path class=\"s\" d=\"M110 140L102 150\"/><path class=\"s\" d=\"M126 140L118 150\"/><path class=\"s\" d=\"M142 140L134 150\"/><path class=\"s\" d=\"M158 140L150 150\"/><path class=\"s\" d=\"M174 140L166 150\"/><path class=\"s\" d=\"M190 140L182 150\"/><path class=\"s\" d=\"M206 140L198 150\"/><path class=\"s\" d=\"M222 140L214 150\"/><path class=\"s\" d=\"M238 140L230 150\"/><path class=\"s\" d=\"M254 140L246 150\"/><path class=\"s\" d=\"M270 140L262 150\"/><path class=\"s\" d=\"M286 140L278 150\"/><rect class=\"s bgf\" x=\"120\" y=\"80\" width=\"80\" height=\"60\" rx=\"3\"/><path class=\"r\" d=\"M230 72L230 136\"/><path class=\"r\" d=\"M226.5 128.8L230 136L233.5 128.8\"/><path class=\"a\" d=\"M30 110L115 110\"/><path class=\"a\" d=\"M107.8 113.5L115 110L107.8 106.5\"/></g><text class=\"\" x=\"160\" y=\"116\" text-anchor=\"middle\" style=\"font-size:22px\">10 kg</text><text class=\"r\" x=\"268\" y=\"100\" text-anchor=\"middle\" style=\"font-size:18px\">W = m·g</text><text class=\"r\" x=\"268\" y=\"124\" text-anchor=\"middle\" style=\"font-size:18px\">≈ 98 N</text><text class=\"a\" x=\"70\" y=\"98\" text-anchor=\"middle\" style=\"font-size:18px\">F = m·a</text></svg>"}, {"type": "concept", "title": "Levers multiply force", "text": "Turning effect, or torque, is force × distance from the pivot. A small force far from the pivot balances a large force close to it.\n\nThat's why a long spanner loosens a stuck bolt, and why door handles sit far from the hinges.", "formula": "torque = F × d", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s bgf\" x=\"16\" y=\"146\" width=\"288\" height=\"5\" rx=\"2\"/><path class=\"s bgf\" d=\"M180 151 L165 175 H195 Z\"/><rect class=\"s bgf\" x=\"48\" y=\"122\" width=\"24\" height=\"24\" rx=\"3\"/><rect class=\"s bgf\" x=\"200\" y=\"102\" width=\"40\" height=\"44\" rx=\"3\"/><path class=\"a\" d=\"M60 162L166 162\"/><path class=\"a\" d=\"M194 162L220 162\"/><path class=\"a\" d=\"M60 157L60 167\"/><path class=\"a\" d=\"M220 157L220 167\"/></g><text class=\"\" x=\"60\" y=\"116\" text-anchor=\"middle\" style=\"font-size:17px\">2 kg</text><text class=\"\" x=\"220\" y=\"96\" text-anchor=\"middle\" style=\"font-size:17px\">6 kg</text><text class=\"a\" x=\"112\" y=\"176\" text-anchor=\"middle\" style=\"font-size:16px\">3 m</text><text class=\"a\" x=\"207\" y=\"176\" text-anchor=\"middle\" style=\"font-size:16px\">1 m</text><text class=\"r\" x=\"160\" y=\"34\" text-anchor=\"middle\" style=\"font-size:20px\">2 × 3 = 6 × 1 → balanced</text></svg>"}, {"type": "widget", "widget": "lever", "title": "Try it: balance the seesaw", "text": "The right side holds 6 kg at 1 m from the pivot. Change the mass and distance on the left until the beam levels out."}, {"type": "concept", "title": "Pulleys trade distance for force", "text": "With a moving pulley, the load hangs from two strands of rope, so each strand carries half the weight. You pull with half the force, but you have to pull twice as much rope.\n\nThe work you do, force × distance, stays the same. Machines never give energy for free; they let you choose how to spend it.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M20 20L300 20\"/><path class=\"s\" d=\"M40 20L32 12\"/><path class=\"s\" d=\"M58 20L50 12\"/><path class=\"s\" d=\"M76 20L68 12\"/><path class=\"s\" d=\"M94 20L86 12\"/><path class=\"s\" d=\"M112 20L104 12\"/><path class=\"s\" d=\"M130 20L122 12\"/><path class=\"s\" d=\"M148 20L140 12\"/><path class=\"s\" d=\"M166 20L158 12\"/><path class=\"s\" d=\"M184 20L176 12\"/><path class=\"s\" d=\"M202 20L194 12\"/><path class=\"s\" d=\"M220 20L212 12\"/><path class=\"s\" d=\"M238 20L230 12\"/><path class=\"s\" d=\"M256 20L248 12\"/><path class=\"s\" d=\"M274 20L266 12\"/><path class=\"s\" d=\"M292 20L284 12\"/><path class=\"s\" d=\"M144 20L144 32\"/><circle class=\"s\" cx=\"144\" cy=\"50\" r=\"18\"/><circle class=\"s\" cx=\"180\" cy=\"125\" r=\"18\"/><path class=\"a\" d=\"M198 20 V125 A18 18 0 0 1 162 125 V50 A18 18 0 0 0 126 50 V150\"/><path class=\"s\" d=\"M180 143L180 150\"/><rect class=\"s bgf\" x=\"160\" y=\"150\" width=\"40\" height=\"24\" rx=\"3\"/><path class=\"r\" d=\"M110 120L110 162\"/><path class=\"r\" d=\"M106.5 154.8L110 162L113.5 154.8\"/></g><text class=\"r\" x=\"102\" y=\"150\" text-anchor=\"end\" style=\"font-size:17px\">pull 1 m</text><text class=\"\" x=\"208\" y=\"168\" text-anchor=\"start\" style=\"font-size:16px\">load rises ½ m</text></svg>"}, {"type": "concept", "title": "Gears: speed or torque", "text": "When a small gear drives a big one, the big gear turns slower but with more torque. The ratio is the number of teeth: 10 teeth driving 20 gives half the speed and twice the torque.\n\nA bike's low gear, a drill's gearbox and a car's first gear all use this trade.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s bgf\" d=\"M255 95 L261.8 100.3 L261.2 105.5 L253.3 109 L252.1 113.5 L256.9 120.6 L254.7 125.4 L246.2 126.3 L243.5 130.3 L245.9 138.5 L242.4 142.4 L234 140.6 L230.3 143.5 L230 152.1 L225.4 154.7 L218 150.4 L213.5 152.1 L210.6 160.1 L205.5 161.2 L199.7 154.8 L195 155 L189.7 161.8 L184.5 161.2 L181 153.3 L176.5 152.1 L169.4 156.9 L164.6 154.7 L163.7 146.2 L159.7 143.5 L151.5 145.9 L147.6 142.4 L149.4 134 L146.5 130.3 L137.9 130 L135.3 125.4 L139.6 118 L137.9 113.5 L129.9 110.6 L128.8 105.5 L135.2 99.7 L135 95 L128.2 89.7 L128.8 84.5 L136.7 81 L137.9 76.5 L133.1 69.4 L135.3 64.6 L143.8 63.7 L146.5 59.7 L144.1 51.5 L147.6 47.6 L156 49.4 L159.7 46.5 L160 37.9 L164.6 35.3 L172 39.6 L176.5 37.9 L179.4 29.9 L184.5 28.8 L190.3 35.2 L195 35 L200.3 28.2 L205.5 28.8 L209 36.7 L213.5 37.9 L220.6 33.1 L225.4 35.3 L226.3 43.8 L230.3 46.5 L238.5 44.1 L242.4 47.6 L240.6 56 L243.5 59.7 L252.1 60 L254.7 64.6 L250.4 72 L252.1 76.5 L260.1 79.4 L261.2 84.5 L254.8 90.3 Z\"/><circle class=\"s\" cx=\"195\" cy=\"95\" r=\"5\"/><path class=\"s bgf\" d=\"M130 95 L136.5 100.8 L135.2 106.4 L126.7 108.6 L124.3 112.6 L126.2 121.2 L121.7 124.9 L113.6 121.7 L109.3 123.5 L105.8 131.5 L100 132 L95.3 124.6 L90.7 123.5 L83.2 128 L78.3 124.9 L78.8 116.2 L75.7 112.6 L67 111.8 L64.8 106.4 L70.4 99.7 L70 95 L63.5 89.2 L64.8 83.6 L73.3 81.4 L75.7 77.4 L73.8 68.8 L78.3 65.1 L86.4 68.3 L90.7 66.5 L94.2 58.5 L100 58 L104.7 65.4 L109.3 66.5 L116.8 62 L121.7 65.1 L121.2 73.8 L124.3 77.4 L133 78.2 L135.2 83.6 L129.6 90.3 Z\"/><circle class=\"s\" cx=\"100\" cy=\"95\" r=\"5\"/><path class=\"a\" d=\"M80 52 A45 45 0 0 1 128 56\"/><path class=\"r\" d=\"M238 148 A70 70 0 0 1 172 160\"/></g><text class=\"a\" x=\"20\" y=\"24\" text-anchor=\"start\" style=\"font-size:17px\">10 teeth (motor)</text><text class=\"r\" x=\"310\" y=\"176\" text-anchor=\"end\" style=\"font-size:15px\">20 teeth: ½ speed, 2× torque</text></svg>"}], "quiz": [{"q": "A 50 kg person stands on a scale. Their weight is about…", "options": ["50 N", "490 N", "5 N", "5000 N"], "answer": 1, "explain": "W = m × g = 50 × 9.81 ≈ 490 N."}, {"q": "4 kg sits 1.5 m from the pivot. How far from the pivot must 2 kg sit to balance?", "options": ["0.75 m", "1.5 m", "3 m", "6 m"], "answer": 2, "explain": "4 × 1.5 = 6, so 2 × d = 6 → d = 3 m."}, {"q": "A 12-tooth gear drives a 36-tooth gear. The output turns…", "options": ["3× faster", "at the same speed", "3× slower with 3× torque"], "answer": 2, "explain": "The ratio is 36 ÷ 12 = 3: one third of the speed, three times the torque."}]}, {"id": "me-structures", "title": "How structures stand up", "summary": "Tension, compression and the shapes engineers use to manage them.", "cards": [{"type": "concept", "title": "Tension and compression", "text": "Load a beam in the middle and it bends. The top gets squeezed (compression) and the bottom gets stretched (tension). Somewhere in between is a neutral line that feels neither.\n\nConcrete is strong in compression but weak in tension, which is why beams have steel bars near the bottom.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s bgf\" d=\"M30 95 Q160 125 290 95 L290 115 Q160 145 30 115 Z\"/><path class=\"s\" d=\"M40 112 L30 132 H50 Z\"/><path class=\"s\" d=\"M280 112 L270 132 H290 Z\"/><path class=\"r\" d=\"M160 40L160 100\"/><path class=\"r\" d=\"M156.5 92.8L160 100L163.5 92.8\"/><path class=\"a\" d=\"M70 82L118 92\"/><path class=\"a\" d=\"M111.2 93.7L118 92L112.5 87.7\"/><path class=\"a\" d=\"M250 82L202 92\"/><path class=\"a\" d=\"M207.5 87.7L202 92L208.8 93.7\"/><path class=\"r\" d=\"M130 156L84 144\"/><path class=\"r\" d=\"M90.9 142.6L84 144L89.3 148.5\"/><path class=\"r\" d=\"M190 156L236 144\"/><path class=\"r\" d=\"M230.7 148.5L236 144L229.1 142.6\"/></g><text class=\"r\" x=\"160\" y=\"30\" text-anchor=\"middle\" style=\"font-size:17px\">load</text><text class=\"a\" x=\"70\" y=\"70\" text-anchor=\"middle\" style=\"font-size:16px\">compression</text><text class=\"a\" x=\"250\" y=\"70\" text-anchor=\"middle\" style=\"font-size:16px\">compression</text><text class=\"r\" x=\"160\" y=\"174\" text-anchor=\"middle\" style=\"font-size:17px\">tension</text></svg>"}, {"type": "concept", "title": "Why engineers love triangles", "text": "Push the corner of a square frame and it folds into a parallelogram; the joints just rotate. A triangle can't change shape without changing the length of a side.\n\nThat's why cranes, roof trusses, pylons and bike frames are made of triangles.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"dash\" d=\"M50 50 H140 L120 140 H30 Z\"/><rect class=\"s\" x=\"30\" y=\"50\" width=\"90\" height=\"90\" rx=\"0\"/><path class=\"r\" d=\"M6 40L46 40\"/><path class=\"r\" d=\"M38.8 43.5L46 40L38.8 36.5\"/><path class=\"s\" d=\"M190 140 L250 50 L310 140 Z\"/><path class=\"r\" d=\"M205 40L245 40\"/><path class=\"r\" d=\"M237.8 43.5L245 40L237.8 36.5\"/><circle class=\"fi\" cx=\"30\" cy=\"50\" r=\"4\"/><circle class=\"fi\" cx=\"120\" cy=\"50\" r=\"4\"/><circle class=\"fi\" cx=\"120\" cy=\"140\" r=\"4\"/><circle class=\"fi\" cx=\"30\" cy=\"140\" r=\"4\"/><circle class=\"fi\" cx=\"190\" cy=\"140\" r=\"4\"/><circle class=\"fi\" cx=\"250\" cy=\"50\" r=\"4\"/><circle class=\"fi\" cx=\"310\" cy=\"140\" r=\"4\"/></g><text class=\"\" x=\"75\" y=\"168\" text-anchor=\"middle\" style=\"font-size:18px\">square folds</text><text class=\"a\" x=\"250\" y=\"168\" text-anchor=\"middle\" style=\"font-size:18px\">triangle holds</text></svg>"}, {"type": "concept", "title": "Arches push outward", "text": "An arch turns a downward load into compression that runs around its curve to the ground. Stone, which is strong in compression, is perfect for it.\n\nThe catch is that the feet push outward. Without solid abutments or a tie between the feet, the arch spreads and collapses.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s bgf\" x=\"20\" y=\"130\" width=\"50\" height=\"40\" rx=\"0\"/><rect class=\"s bgf\" x=\"250\" y=\"130\" width=\"50\" height=\"40\" rx=\"0\"/><path class=\"s\" d=\"M45 130 Q160 -10 275 130\"/><path class=\"s\" d=\"M70 130 Q160 30 250 130\"/><path class=\"r\" d=\"M160 12L160 54\"/><path class=\"r\" d=\"M156.5 46.8L160 54L163.5 46.8\"/><path class=\"a\" d=\"M62 124L26 146\"/><path class=\"a\" d=\"M30.3 139.3L26 146L34 145.2\"/><path class=\"a\" d=\"M258 124L294 146\"/><path class=\"a\" d=\"M286 145.2L294 146L289.7 139.3\"/></g><text class=\"r\" x=\"172\" y=\"22\" text-anchor=\"start\" style=\"font-size:17px\">load</text><text class=\"a\" x=\"160\" y=\"168\" text-anchor=\"middle\" style=\"font-size:17px\">feet push outward</text></svg>"}, {"type": "concept", "title": "The I-beam", "text": "When a beam bends, the most stress is at the top and bottom faces and very little in the middle. An I-beam puts most of its steel in the top and bottom flanges and joins them with a thin web.\n\nYou get almost the stiffness of a solid block with a fraction of the weight.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"y\" x=\"96\" y=\"28\" width=\"128\" height=\"28\" rx=\"4\" transform=\"rotate(-1.2 96 28)\"/><rect class=\"y\" x=\"96\" y=\"136\" width=\"128\" height=\"28\" rx=\"4\" transform=\"rotate(-1.2 96 136)\"/><rect class=\"s bgf\" x=\"100\" y=\"30\" width=\"120\" height=\"22\" rx=\"1\"/><rect class=\"s bgf\" x=\"150\" y=\"52\" width=\"20\" height=\"86\" rx=\"0\"/><rect class=\"s bgf\" x=\"100\" y=\"138\" width=\"120\" height=\"22\" rx=\"1\"/></g><text class=\"r\" x=\"50\" y=\"46\" text-anchor=\"middle\" style=\"font-size:16px\">high stress</text><text class=\"r\" x=\"50\" y=\"154\" text-anchor=\"middle\" style=\"font-size:16px\">high stress</text><text class=\"\" x=\"60\" y=\"100\" text-anchor=\"middle\" style=\"font-size:16px\">low stress</text><text class=\"a\" x=\"232\" y=\"46\" text-anchor=\"start\" style=\"font-size:17px\">flange</text><text class=\"a\" x=\"182\" y=\"100\" text-anchor=\"start\" style=\"font-size:17px\">web</text><text class=\"a\" x=\"232\" y=\"154\" text-anchor=\"start\" style=\"font-size:17px\">flange</text></svg>"}, {"type": "formula", "title": "Factor of safety", "formula": "FoS = failure load ÷ working load", "text": "Engineers never design right up to the breaking point. Materials vary, loads get underestimated and things wear out. The factor of safety is how much stronger something is than it needs to be.\n\nLifting gear often uses 4 or 5; aircraft structures use about 1.5, because extra weight costs fuel and every part is tested closely.", "example": ["Hook rated for 1 t, breaks at 4 t", "4 ÷ 1", "factor of safety = 4"], "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"fpen\" x=\"30\" y=\"56\" width=\"70\" height=\"26\" rx=\"3\"/><rect class=\"fred\" x=\"30\" y=\"104\" width=\"280\" height=\"26\" rx=\"3\"/></g><text class=\"a\" x=\"110\" y=\"75\" text-anchor=\"start\" style=\"font-size:17px\">rated 1 t</text><text class=\"tp\" x=\"40\" y=\"123\" text-anchor=\"start\" style=\"font-size:17px\">breaks at 4 t</text><text class=\"\" x=\"160\" y=\"165\" text-anchor=\"middle\" style=\"font-size:18px\">4 ÷ 1 = factor of safety 4</text></svg>"}], "quiz": [{"q": "A simply supported beam carries a load in the middle. Where is it in tension?", "options": ["Top face", "Bottom face", "Exactly along the middle"], "answer": 1, "explain": "It sags, so the bottom stretches (tension) and the top squeezes (compression)."}, {"q": "Why are trusses made of triangles?", "options": ["They use less steel than squares", "A triangle can't deform without a side changing length", "They look better"], "answer": 1, "explain": "Fixed side lengths lock a triangle's angles, so pinned joints alone keep it rigid."}, {"q": "Rope with a breaking load of 600 kg, used with a factor of safety of 5. Max working load?", "options": ["3000 kg", "120 kg", "595 kg"], "answer": 1, "explain": "Working load = failure load ÷ FoS = 600 ÷ 5 = 120 kg."}]}]}, "physics": {"id": "physics", "topic": "sci", "title": "Physics", "version": 1, "blurb": "Energy, heat and waves in everyday life.", "lessons": [{"id": "ph-energy", "title": "Energy & heat", "summary": "Where energy goes, how heat moves, and why heat pumps beat heaters.", "cards": [{"type": "concept", "title": "Energy changes form", "text": "Energy is never created or destroyed, only converted. A battery's chemical energy becomes electrical energy, which a bulb turns into light and heat.\n\nEfficiency is the useful share. An old filament bulb turned about 5% into light; an LED manages several times that, so it runs cooler for the same brightness.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s bgf\" x=\"20\" y=\"70\" width=\"50\" height=\"30\" rx=\"3\"/><rect class=\"s\" x=\"70\" y=\"78\" width=\"6\" height=\"14\" rx=\"3\"/><path class=\"a\" d=\"M84 85L118 85\"/><path class=\"a\" d=\"M110.8 88.5L118 85L110.8 81.5\"/><circle class=\"s bgf\" cx=\"150\" cy=\"75\" r=\"22\"/><rect class=\"s bgf\" x=\"140\" y=\"97\" width=\"20\" height=\"14\" rx=\"3\"/><path class=\"a\" d=\"M178 60L218 44\"/><path class=\"a\" d=\"M212.6 49.9L218 44L210 43.4\"/><path class=\"a\" d=\"M180 78L224 78\"/><path class=\"a\" d=\"M216.8 81.5L224 78L216.8 74.5\"/><path class=\"r\" d=\"M176 102 q8 -7 16 0 t16 0 t16 0\"/></g><text class=\"\" x=\"45\" y=\"125\" text-anchor=\"middle\" style=\"font-size:16px\">chemical</text><text class=\"\" x=\"150\" y=\"135\" text-anchor=\"middle\" style=\"font-size:16px\">electrical</text><text class=\"a\" x=\"250\" y=\"50\" text-anchor=\"start\" style=\"font-size:17px\">light</text><text class=\"r\" x=\"232\" y=\"108\" text-anchor=\"start\" style=\"font-size:17px\">heat</text><text class=\"\" x=\"160\" y=\"170\" text-anchor=\"middle\" style=\"font-size:18px\">total in = total out</text></svg>"}, {"type": "concept", "title": "Three ways heat moves", "text": "Conduction: heat passes through touching material, from the burner into the pan base.\nConvection: warm fluid rises and cool fluid sinks, setting up loops that stir the water.\nRadiation: infrared light travels across a gap with no material at all, like the warmth you feel beside a fire.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s bgf\" d=\"M90 70 V120 Q90 130 100 130 H200 Q210 130 210 120 V70\"/><path class=\"s\" d=\"M210 82L244 82\"/><path class=\"a\" d=\"M92 82L208 82\"/><rect class=\"s bgf\" x=\"85\" y=\"140\" width=\"130\" height=\"8\" rx=\"3\"/><path class=\"r\" d=\"M115 139 q-6 -6 0 -10 q6 4 0 10\"/><path class=\"r\" d=\"M140 139 q-6 -6 0 -10 q6 4 0 10\"/><path class=\"r\" d=\"M165 139 q-6 -6 0 -10 q6 4 0 10\"/><path class=\"r\" d=\"M190 139 q-6 -6 0 -10 q6 4 0 10\"/><path class=\"a\" d=\"M126 120 C108 102 116 88 138 94\"/><path class=\"a\" d=\"M174 94 C196 88 204 104 186 120\"/><path class=\"r\" d=\"M222 146 q6 -6 12 0 t12 0 t12 0\"/><path class=\"r\" d=\"M222 160 q6 -6 12 0 t12 0 t12 0\"/><path class=\"s\" d=\"M70 146L96 140\"/><path class=\"s\" d=\"M91.3 143.8L96 140L90.1 138.7\"/></g><text class=\"\" x=\"40\" y=\"152\" text-anchor=\"middle\" style=\"font-size:16px\">conduction</text><text class=\"a\" x=\"150\" y=\"58\" text-anchor=\"middle\" style=\"font-size:17px\">convection</text><text class=\"r\" x=\"262\" y=\"157\" text-anchor=\"start\" style=\"font-size:16px\">radiation</text></svg>"}, {"type": "concept", "title": "Heat pumps move heat", "text": "A heat pump doesn't make heat; it moves it. A refrigerant absorbs heat from outside air (even cold air has some), the compressor squeezes it so it gets hotter, and it releases that heat indoors.\n\nBecause most of the heat comes from outside, 1 kWh of electricity can deliver 3–4 kWh of heat. That ratio is the COP.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M60 40 H260 V140 H60 Z\"/><circle class=\"s bgf\" cx=\"160\" cy=\"40\" r=\"16\"/><path class=\"s bgf\" d=\"M150 132 L170 148 V132 L150 148 Z\"/><rect class=\"bgr\" x=\"50\" y=\"60\" width=\"20\" height=\"60\" rx=\"0\"/><rect class=\"bgr\" x=\"250\" y=\"60\" width=\"20\" height=\"60\" rx=\"0\"/><path class=\"a\" d=\"M60 62L53 66.7L67 76L53 85.3L67 94.7L53 104L67 113.3L60 118\"/><path class=\"r\" d=\"M260 62L253 66.7L267 76L253 85.3L267 94.7L253 104L267 113.3L260 118\"/><path class=\"a\" d=\"M20 90L44 90\"/><path class=\"a\" d=\"M36.8 93.5L44 90L36.8 86.5\"/><path class=\"r\" d=\"M276 90L300 90\"/><path class=\"r\" d=\"M292.8 93.5L300 90L292.8 86.5\"/></g><text class=\"\" x=\"160\" y=\"18\" text-anchor=\"middle\" style=\"font-size:16px\">compressor</text><text class=\"a\" x=\"60\" y=\"166\" text-anchor=\"middle\" style=\"font-size:16px\">outside: absorbs</text><text class=\"r\" x=\"260\" y=\"166\" text-anchor=\"middle\" style=\"font-size:16px\">inside: releases</text><text class=\"\" x=\"160\" y=\"84\" text-anchor=\"middle\" style=\"font-size:17px\">1 kWh in</text><text class=\"r\" x=\"160\" y=\"106\" text-anchor=\"middle\" style=\"font-size:17px\">3–4 kWh heat out</text></svg>"}, {"type": "formula", "title": "Specific heat", "formula": "Q = m × c × ΔT", "text": "The energy to heat something is mass × specific heat × temperature rise. Water's specific heat is high, about 4186 J per kg per °C, which is why it takes a while to boil and why it stores heat so well.", "example": ["1 L of water from 20 to 100 °C", "1 × 4186 × 80 = 335 kJ", "≈ 0.093 kWh, about 2 cents"], "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"w\" x=\"112\" y=\"82\" width=\"86\" height=\"66\" rx=\"0\"/><path class=\"s\" d=\"M110 50 V150 H200 V50\"/><path class=\"s\" d=\"M240 40L240 128\"/><circle class=\"s\" cx=\"240\" cy=\"140\" r=\"10\"/><circle class=\"fred\" cx=\"240\" cy=\"140\" r=\"6\"/><path class=\"r\" d=\"M240 132L240 70\"/></g><text class=\"\" x=\"155\" y=\"40\" text-anchor=\"middle\" style=\"font-size:17px\">1 L water</text><text class=\"r\" x=\"250\" y=\"30\" text-anchor=\"middle\" style=\"font-size:17px\">20 → 100 °C</text><text class=\"a\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:17px\">Q = 1 × 4186 × 80 ≈ 335 kJ</text></svg>"}], "quiz": [{"q": "Which way does heat mainly reach you from the Sun?", "options": ["Conduction", "Convection", "Radiation"], "answer": 2, "explain": "Space is nearly empty, so only radiation can cross it."}, {"q": "A heat pump with a COP of 3 uses 2 kWh of electricity. Heat delivered?", "options": ["0.67 kWh", "2 kWh", "6 kWh"], "answer": 2, "explain": "Heat out = COP × electricity in = 3 × 2 = 6 kWh."}, {"q": "Heating 2 kg of water by 10 °C needs about…", "options": ["84 kJ", "8.4 kJ", "840 kJ"], "answer": 0, "explain": "Q = 2 × 4186 × 10 ≈ 83.7 kJ."}]}, {"id": "ph-waves", "title": "Waves, sound & light", "summary": "One equation that covers guitar strings, Wi-Fi and thunderstorms.", "cards": [{"type": "concept", "title": "Anatomy of a wave", "text": "A wave carries energy without carrying stuff along. Its wavelength (λ) is the distance from one crest to the next. Its amplitude is how tall it is, which sets loudness or brightness. Its frequency is how many crests pass each second, in hertz (Hz).", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"dash\" d=\"M20 95L300 95\"/><path class=\"a\" d=\"M20 95 L22 90.8 L24 86.7 L26 82.6 L28 78.7 L30 75 L32 71.5 L34 68.2 L36 65.3 L38 62.6 L40 60.4 L42 58.5 L44 57 L46 55.9 L48 55.2 L50 55 L52 55.2 L54 55.9 L56 57 L58 58.5 L60 60.4 L62 62.6 L64 65.3 L66 68.2 L68 71.5 L70 75 L72 78.7 L74 82.6 L76 86.7 L78 90.8 L80 95 L82 99.2 L84 103.3 L86 107.4 L88 111.3 L90 115 L92 118.5 L94 121.8 L96 124.7 L98 127.4 L100 129.6 L102 131.5 L104 133 L106 134.1 L108 134.8 L110 135 L112 134.8 L114 134.1 L116 133 L118 131.5 L120 129.6 L122 127.4 L124 124.7 L126 121.8 L128 118.5 L130 115 L132 111.3 L134 107.4 L136 103.3 L138 99.2 L140 95 L142 90.8 L144 86.7 L146 82.6 L148 78.7 L150 75 L152 71.5 L154 68.2 L156 65.3 L158 62.6 L160 60.4 L162 58.5 L164 57 L166 55.9 L168 55.2 L170 55 L172 55.2 L174 55.9 L176 57 L178 58.5 L180 60.4 L182 62.6 L184 65.3 L186 68.2 L188 71.5 L190 75 L192 78.7 L194 82.6 L196 86.7 L198 90.8 L200 95 L202 99.2 L204 103.3 L206 107.4 L208 111.3 L210 115 L212 118.5 L214 121.8 L216 124.7 L218 127.4 L220 129.6 L222 131.5 L224 133 L226 134.1 L228 134.8 L230 135 L232 134.8 L234 134.1 L236 133 L238 131.5 L240 129.6 L242 127.4 L244 124.7 L246 121.8 L248 118.5 L250 115 L252 111.3 L254 107.4 L256 103.3 L258 99.2 L260 95 L262 90.8 L264 86.7 L266 82.6 L268 78.7 L270 75 L272 71.5 L274 68.2 L276 65.3 L278 62.6 L280 60.4 L282 58.5 L284 57 L286 55.9 L288 55.2 L290 55 L292 55.2 L294 55.9 L296 57 L298 58.5 L300 60.4\"/><path class=\"r\" d=\"M50 40L170 40\"/><path class=\"r\" d=\"M50 34L50 46\"/><path class=\"r\" d=\"M170 34L170 46\"/><path class=\"r\" d=\"M290 95L290 59\"/><path class=\"r\" d=\"M293 65.3L290 59L287 65.3\"/></g><text class=\"r\" x=\"110\" y=\"30\" text-anchor=\"middle\" style=\"font-size:17px\">wavelength λ</text><text class=\"r\" x=\"300\" y=\"30\" text-anchor=\"end\" style=\"font-size:17px\">amplitude ↕</text><text class=\"\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:16px\">frequency = waves per second (Hz)</text></svg>"}, {"type": "widget", "widget": "wave", "title": "Try it: how long is a sound?", "formula": "v = f × λ", "text": "Speed equals frequency times wavelength. Sound travels at about 343 m/s in air, so low notes have long waves and high notes have short ones."}, {"type": "fact", "title": "How far away is the storm?", "text": "Light from lightning reaches you almost instantly; it travels about 300 000 km every second. Sound crawls along at about 343 m/s, roughly 1 km every 3 seconds.\n\nCount the seconds between the flash and the thunder and divide by 3 to get the distance in kilometres.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s bgf\" d=\"M40 62 q-2 -26 24 -24 q10 -22 36 -10 q22 -12 36 8 q22 2 18 26 Z\"/><path class=\"r\" d=\"M96 64 L80 100 H95 L82 136\"/><path class=\"a\" d=\"M122 108 q10 12 0 24\"/><path class=\"a\" d=\"M138 100 q16 20 0 40\"/><path class=\"a\" d=\"M154 92 q22 28 0 56\"/><rect class=\"s bgf\" x=\"250\" y=\"112\" width=\"42\" height=\"38\" rx=\"0\"/><path class=\"s\" d=\"M244 112 L271 88 L298 112\"/></g><text class=\"r\" x=\"218\" y=\"60\" text-anchor=\"middle\" style=\"font-size:17px\">light ≈ instant</text><text class=\"a\" x=\"212\" y=\"80\" text-anchor=\"middle\" style=\"font-size:17px\">sound: 1 km / 3 s</text><text class=\"\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:18px\">seconds ÷ 3 = km away</text></svg>"}, {"type": "concept", "title": "The electromagnetic spectrum", "text": "Radio, microwaves, infrared, visible light, ultraviolet and X-rays are all the same thing: electromagnetic waves, all moving at the speed of light. Only the wavelength differs.\n\nShorter waves carry more energy per photon. That's why UV can burn skin and X-rays pass through it, while radio is harmless. Wi-Fi at 2.4 GHz has a wavelength of about 12.5 cm.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"rbw\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#d32\"/><stop offset=\".3\" stop-color=\"#f90\"/><stop offset=\".5\" stop-color=\"#ec2\"/><stop offset=\".7\" stop-color=\"#3a4\"/><stop offset=\"1\" stop-color=\"#63c\"/></linearGradient></defs><g class=\"d\"><rect class=\"s\" x=\"20\" y=\"70\" width=\"60\" height=\"30\" rx=\"0\"/><rect class=\"s\" x=\"80\" y=\"70\" width=\"45\" height=\"30\" rx=\"0\"/><rect class=\"s\" x=\"125\" y=\"70\" width=\"40\" height=\"30\" rx=\"0\"/><rect x=\"165\" y=\"70\" width=\"22\" height=\"30\" fill=\"url(#rbw)\"/><rect class=\"s\" x=\"165\" y=\"70\" width=\"22\" height=\"30\" rx=\"0\"/><rect class=\"s\" x=\"187\" y=\"70\" width=\"35\" height=\"30\" rx=\"0\"/><rect class=\"s\" x=\"222\" y=\"70\" width=\"40\" height=\"30\" rx=\"0\"/><rect class=\"s\" x=\"262\" y=\"70\" width=\"38\" height=\"30\" rx=\"0\"/><path class=\"s\" d=\"M102 46L102 68\"/><path class=\"a\" d=\"M150 140L30 140\"/><path class=\"a\" d=\"M37.2 136.5L30 140L37.2 143.5\"/><path class=\"r\" d=\"M170 140L300 140\"/><path class=\"r\" d=\"M292.8 143.5L300 140L292.8 136.5\"/></g><text class=\"\" x=\"50\" y=\"118\" text-anchor=\"middle\" style=\"font-size:14px\">radio</text><text class=\"\" x=\"102.5\" y=\"118\" text-anchor=\"middle\" style=\"font-size:14px\">micro</text><text class=\"\" x=\"145\" y=\"118\" text-anchor=\"middle\" style=\"font-size:14px\">IR</text><text class=\"\" x=\"176\" y=\"118\" text-anchor=\"middle\" style=\"font-size:14px\">light</text><text class=\"\" x=\"204.5\" y=\"118\" text-anchor=\"middle\" style=\"font-size:14px\">UV</text><text class=\"\" x=\"242\" y=\"118\" text-anchor=\"middle\" style=\"font-size:14px\">X-ray</text><text class=\"\" x=\"281\" y=\"118\" text-anchor=\"middle\" style=\"font-size:14px\">gamma</text><text class=\"\" x=\"102\" y=\"40\" text-anchor=\"middle\" style=\"font-size:15px\">Wi-Fi 2.4 GHz ≈ 12.5 cm</text><text class=\"a\" x=\"90\" y=\"162\" text-anchor=\"middle\" style=\"font-size:16px\">longer waves</text><text class=\"r\" x=\"235\" y=\"162\" text-anchor=\"middle\" style=\"font-size:16px\">more energy</text></svg>"}], "quiz": [{"q": "A 343 Hz tone in air (343 m/s) has a wavelength of…", "options": ["1 m", "343 m", "1 cm"], "answer": 0, "explain": "λ = v ÷ f = 343 ÷ 343 = 1 m."}, {"q": "Thunder arrives 9 seconds after the flash. How far is the strike?", "options": ["About 9 km", "About 3 km", "About 1 km"], "answer": 1, "explain": "Sound covers about 1 km every 3 s, so 9 s ≈ 3 km."}, {"q": "Which carries the most energy per photon?", "options": ["Radio", "Visible light", "X-rays"], "answer": 2, "explain": "Shorter wavelength means higher frequency and more energy per photon."}]}]}, "history": {"id": "history", "topic": "hist", "title": "History", "version": 1, "blurb": "The turning points of humanity, and Portugal's leap into the open ocean.", "lessons": [{"id": "hi-turns", "title": "Turning points of humanity", "summary": "Five changes that made the modern world, in the order they happened.", "cards": [{"type": "concept", "title": "Human history as one day", "text": "Squeeze the roughly 300,000 years of Homo sapiens into a single day. For almost all of it, everyone lived as hunter-gatherers.\n\nFarming only starts at about 23:02. Writing appears at 23:36. The printing press arrives less than three minutes before midnight, and everything since the steam engine fits in the last minute.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M20 52L300 52\"/><path class=\"s\" d=\"M20 46L20 58\"/><path class=\"s\" d=\"M90 46L90 58\"/><path class=\"s\" d=\"M160 46L160 58\"/><path class=\"s\" d=\"M230 46L230 58\"/><path class=\"s\" d=\"M300 46L300 58\"/><rect class=\"y\" x=\"282\" y=\"40\" width=\"20\" height=\"24\" rx=\"4\" transform=\"rotate(-1.2 282 40)\"/><path class=\"dash\" d=\"M286 62L40 128\"/><path class=\"dash\" d=\"M300 62L300 128\"/><path class=\"a\" d=\"M40 134L300 134\"/><path class=\"a\" d=\"M48.7 128L48.7 140\"/><path class=\"a\" d=\"M196 128L196 140\"/><path class=\"a\" d=\"M287.9 128L287.9 140\"/><circle class=\"fred\" cx=\"300\" cy=\"134\" r=\"4\"/></g><text class=\"mono\" x=\"20\" y=\"74\" text-anchor=\"middle\" style=\"font-size:11px\">00:00</text><text class=\"mono\" x=\"90\" y=\"74\" text-anchor=\"middle\" style=\"font-size:11px\">06:00</text><text class=\"mono\" x=\"160\" y=\"74\" text-anchor=\"middle\" style=\"font-size:11px\">12:00</text><text class=\"mono\" x=\"230\" y=\"74\" text-anchor=\"middle\" style=\"font-size:11px\">18:00</text><text class=\"mono\" x=\"300\" y=\"74\" text-anchor=\"middle\" style=\"font-size:11px\">24:00</text><text class=\"\" x=\"20\" y=\"34\" text-anchor=\"start\" style=\"font-size:15px\">first Homo sapiens</text><text class=\"r\" x=\"300\" y=\"34\" text-anchor=\"end\" style=\"font-size:15px\">today</text><text class=\"a\" x=\"48.7\" y=\"122\" text-anchor=\"middle\" style=\"font-size:15px\">farming</text><text class=\"a\" x=\"196\" y=\"122\" text-anchor=\"middle\" style=\"font-size:15px\">writing</text><text class=\"a\" x=\"287.9\" y=\"122\" text-anchor=\"end\" style=\"font-size:15px\">printing</text><text class=\"mono\" x=\"48.7\" y=\"154\" text-anchor=\"middle\" style=\"font-size:11px\">23:02</text><text class=\"mono\" x=\"196\" y=\"154\" text-anchor=\"middle\" style=\"font-size:11px\">23:36</text><text class=\"mono\" x=\"287.9\" y=\"154\" text-anchor=\"middle\" style=\"font-size:11px\">23:57</text><text class=\"\" x=\"160\" y=\"174\" text-anchor=\"middle\" style=\"font-size:15px\">zoom: the last hour of the day</text></svg>"}, {"type": "concept", "title": "Farming changed everything", "text": "Around 10,000 BCE, people in the Fertile Crescent (today's Iraq, Syria and Turkey) began planting wheat and barley and keeping animals.\n\nFarming made food surpluses possible. Surpluses could be stored, traded and taxed, and they fed people who didn't farm: potters, priests, soldiers and kings. Villages grew into the first cities.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M40 142L40 58\"/><ellipse class=\"s bgf\" cx=\"34\" cy=\"68\" rx=\"4\" ry=\"8\"/><ellipse class=\"s bgf\" cx=\"46\" cy=\"80\" rx=\"4\" ry=\"8\"/><ellipse class=\"s bgf\" cx=\"34\" cy=\"92\" rx=\"4\" ry=\"8\"/><ellipse class=\"s bgf\" cx=\"46\" cy=\"104\" rx=\"4\" ry=\"8\"/><ellipse class=\"s bgf\" cx=\"34\" cy=\"116\" rx=\"4\" ry=\"8\"/><path class=\"a\" d=\"M60 100L96 100\"/><path class=\"a\" d=\"M88.8 103.5L96 100L88.8 96.5\"/><path class=\"s bgf\" d=\"M110 142 V92 L135 70 L160 92 V142 Z\"/><path class=\"a\" d=\"M170 100L204 100\"/><path class=\"a\" d=\"M196.8 103.5L204 100L196.8 96.5\"/><rect class=\"s bgf\" x=\"214\" y=\"92\" width=\"92\" height=\"50\" rx=\"0\"/><path class=\"s\" d=\"M214 92 V84 H224 V92 H234 V84 H244 V92 H254 V84 H264 V92 H274 V84 H284 V92 H294 V84 H306 V92\"/></g><text class=\"r\" x=\"160\" y=\"30\" text-anchor=\"middle\" style=\"font-size:17px\">~10,000 BCE, Fertile Crescent</text><text class=\"\" x=\"40\" y=\"162\" text-anchor=\"middle\" style=\"font-size:16px\">grow</text><text class=\"\" x=\"135\" y=\"162\" text-anchor=\"middle\" style=\"font-size:16px\">store the surplus</text><text class=\"\" x=\"260\" y=\"162\" text-anchor=\"middle\" style=\"font-size:16px\">cities &amp; rulers</text></svg>"}, {"type": "concept", "title": "Writing started as bookkeeping", "text": "The oldest writing we know comes from Sumer, in today's Iraq, around 3200 BCE. It wasn't poetry. It was accounts: who delivered how much barley, how many sheep, how much beer was paid as wages.\n\nScribes pressed wedge-shaped marks into wet clay with a reed. We call the script cuneiform, from the Latin for 'wedge'.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s bgf\" x=\"90\" y=\"26\" width=\"140\" height=\"116\" rx=\"18\"/><path class=\"fi\" d=\"M108 47 L120 52 L108 57 Z\"/><path class=\"fi\" d=\"M126 47 L138 52 L126 57 Z\"/><path class=\"fi\" d=\"M144 47 L156 52 L144 57 Z\"/><path class=\"s\" d=\"M178 44L178 60\"/><path class=\"s\" d=\"M185 44L185 60\"/><path class=\"s\" d=\"M192 44L192 60\"/><path class=\"s\" d=\"M199 44L199 60\"/><path class=\"fi\" d=\"M108 73 L120 78 L108 83 Z\"/><path class=\"fi\" d=\"M126 73 L138 78 L126 83 Z\"/><path class=\"fi\" d=\"M144 73 L156 78 L144 83 Z\"/><path class=\"fi\" d=\"M162 73 L174 78 L162 83 Z\"/><path class=\"s\" d=\"M178 70L178 86\"/><path class=\"s\" d=\"M185 70L185 86\"/><path class=\"s\" d=\"M192 70L192 86\"/><path class=\"fi\" d=\"M108 99 L120 104 L108 109 Z\"/><path class=\"fi\" d=\"M126 99 L138 104 L126 109 Z\"/><path class=\"fi\" d=\"M144 99 L156 104 L144 109 Z\"/><path class=\"s\" d=\"M178 96L178 112\"/><path class=\"s\" d=\"M185 96L185 112\"/></g><text class=\"\" x=\"160\" y=\"166\" text-anchor=\"middle\" style=\"font-size:16px\">Uruk, ~3200 BCE: barley, sheep, beer</text><text class=\"a\" x=\"270\" y=\"60\" text-anchor=\"start\" style=\"font-size:15px\">wedges</text><text class=\"a\" x=\"270\" y=\"104\" text-anchor=\"start\" style=\"font-size:15px\">tallies</text></svg>"}, {"type": "concept", "title": "The printing press", "text": "Around 1450 in Mainz, Johannes Gutenberg combined movable metal type, oil-based ink and a press adapted from wine making. A book that took a scribe months could now be printed by the hundred.\n\nWithin 50 years millions of books were in circulation. Ideas spread faster than authorities could control them, feeding the Reformation and the scientific revolution.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M80 30L80 150\"/><path class=\"s\" d=\"M240 30L240 150\"/><path class=\"s\" d=\"M68 30L252 30\"/><path class=\"s\" d=\"M160 32L153 35.7L167 43L153 50.3L167 57.7L153 65L167 72.3L160 76\"/><path class=\"s\" d=\"M128 60L192 60\"/><rect class=\"s bgf\" x=\"110\" y=\"78\" width=\"100\" height=\"16\" rx=\"3\"/><rect class=\"w\" x=\"115\" y=\"110\" width=\"90\" height=\"10\" rx=\"0\"/><rect class=\"s bgf\" x=\"100\" y=\"120\" width=\"120\" height=\"14\" rx=\"3\"/><path class=\"s\" d=\"M56 150L264 150\"/></g><text class=\"a\" x=\"252\" y=\"58\" text-anchor=\"start\" style=\"font-size:15px\">screw</text><text class=\"a\" x=\"252\" y=\"120\" text-anchor=\"start\" style=\"font-size:15px\">type &amp;</text><text class=\"a\" x=\"252\" y=\"138\" text-anchor=\"start\" style=\"font-size:15px\">paper</text><text class=\"\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:16px\">Gutenberg, Mainz, ~1450</text></svg>"}, {"type": "concept", "title": "The Industrial Revolution", "text": "From about 1760 in Britain, machines powered by water and then coal-fired steam engines took over spinning, weaving and mining. Work moved from homes and fields into factories, and people moved into fast-growing cities.\n\nFor the first time in history, output per person kept rising decade after decade. It also brought child labour, pollution and the start of large-scale CO₂ emissions.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s bgf\" d=\"M30 150 V102 L70 80 V102 L110 80 V102 L150 80 V150 Z\"/><rect class=\"s bgf\" x=\"160\" y=\"44\" width=\"20\" height=\"106\" rx=\"0\"/><path class=\"dash\" d=\"M170 38 q-12 -8 2 -16 q14 -8 6 -18\"/><path class=\"s\" d=\"M18 150L302 150\"/><circle class=\"s\" cx=\"250\" cy=\"112\" r=\"32\"/><path class=\"s\" d=\"M250 80L250 144\"/><path class=\"s\" d=\"M218 112L282 112\"/><path class=\"s\" d=\"M227 89L273 135\"/><path class=\"s\" d=\"M273 89L227 135\"/><circle class=\"s bgf\" cx=\"250\" cy=\"112\" r=\"6\"/></g><text class=\"\" x=\"90\" y=\"70\" text-anchor=\"middle\" style=\"font-size:16px\">factories</text><text class=\"r\" x=\"250\" y=\"70\" text-anchor=\"middle\" style=\"font-size:16px\">steam power</text><text class=\"\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:16px\">Britain, from ~1760</text></svg>"}], "quiz": [{"q": "What was most early writing used for?", "options": ["Poetry and religious stories", "Keeping accounts of goods and payments", "Letters between kings"], "answer": 1, "explain": "The earliest Sumerian tablets are mostly records of grain, livestock and rations."}, {"q": "Why did farming lead to cities?", "options": ["Farmers liked living close together", "Food surpluses could feed people who didn't farm", "Cities were needed to store tools"], "answer": 1, "explain": "Surplus food supported specialists, rulers and traders, which made towns and cities possible."}, {"q": "Where and when did Gutenberg's press appear?", "options": ["China, ~1050", "Mainz, ~1450", "London, ~1600"], "answer": 1, "explain": "Gutenberg worked in Mainz around 1450. (Movable type existed earlier in China and Korea, but his press transformed Europe.)"}]}, {"id": "hi-discovery", "title": "Portugal and the Age of Discovery", "summary": "How a small kingdom at the edge of Europe opened the world's sea routes.", "cards": [{"type": "concept", "title": "Why Portugal turned to the sea", "text": "In the 1400s Portugal was small, poor and boxed in by Castile. The rich trade in spices and silk came overland from Asia and was controlled by Venice and Muslim middlemen.\n\nThe Atlantic was the one open door. Prince Henry 'the Navigator' sponsored expeditions down the African coast, step by step, hoping to reach gold, allies and eventually the spices of India by sea.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"a\" d=\"M60 34 C34 62 30 96 58 124 C92 156 140 162 178 142 C222 118 262 90 300 62\"/><circle class=\"fred\" cx=\"60\" cy=\"34\" r=\"6\"/><circle class=\"fred\" cx=\"40\" cy=\"80\" r=\"5\"/><circle class=\"fred\" cx=\"178\" cy=\"142\" r=\"5\"/><circle class=\"fred\" cx=\"300\" cy=\"62\" r=\"6\"/></g><text class=\"\" x=\"74\" y=\"34\" text-anchor=\"start\" style=\"font-size:17px\">Lisbon</text><text class=\"\" x=\"52\" y=\"84\" text-anchor=\"start\" style=\"font-size:15px\">Cape Bojador 1434</text><text class=\"\" x=\"178\" y=\"166\" text-anchor=\"middle\" style=\"font-size:15px\">Cape of Good Hope 1488</text><text class=\"r\" x=\"300\" y=\"44\" text-anchor=\"end\" style=\"font-size:17px\">India 1498</text><text class=\"a\" x=\"160\" y=\"96\" text-anchor=\"middle\" style=\"font-size:15px\">sea route (schematic)</text></svg>"}, {"type": "concept", "title": "The caravel", "text": "Square sails work beautifully with the wind behind you, but badly against it. The caravel's triangular 'lateen' sails let it sail much closer into the wind, and its shallow hull could explore coasts and rivers.\n\nThat mattered: coming home from West Africa meant fighting the prevailing winds. Explorers learned to swing far out into the Atlantic to catch better ones.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"a\" d=\"M20 140 L22 138.4 L24 137 L26 136.2 L28 136 L30 136.5 L32 137.6 L34 139.2 L36 140.8 L38 142.4 L40 143.5 L42 144 L44 143.8 L46 143 L48 141.6 L50 140 L52 138.4 L54 137 L56 136.2 L58 136 L60 136.5 L62 137.6 L64 139.2 L66 140.8 L68 142.4 L70 143.5 L72 144 L74 143.8 L76 143 L78 141.6 L80 140 L82 138.4 L84 137 L86 136.2 L88 136 L90 136.5 L92 137.6 L94 139.2 L96 140.8 L98 142.4 L100 143.5 L102 144 L104 143.8 L106 143 L108 141.6 L110 140 L112 138.4 L114 137 L116 136.2 L118 136 L120 136.5 L122 137.6 L124 139.2 L126 140.8 L128 142.4 L130 143.5 L132 144 L134 143.8 L136 143 L138 141.6 L140 140 L142 138.4 L144 137 L146 136.2 L148 136 L150 136.5 L152 137.6 L154 139.2 L156 140.8 L158 142.4 L160 143.5 L162 144 L164 143.8 L166 143 L168 141.6 L170 140 L172 138.4 L174 137 L176 136.2 L178 136 L180 136.5 L182 137.6 L184 139.2 L186 140.8 L188 142.4 L190 143.5 L192 144 L194 143.8 L196 143 L198 141.6 L200 140 L202 138.4 L204 137 L206 136.2 L208 136 L210 136.5 L212 137.6 L214 139.2 L216 140.8 L218 142.4 L220 143.5 L222 144 L224 143.8 L226 143 L228 141.6 L230 140 L232 138.4 L234 137 L236 136.2 L238 136 L240 136.5 L242 137.6 L244 139.2 L246 140.8 L248 142.4 L250 143.5 L252 144 L254 143.8 L256 143 L258 141.6 L260 140 L262 138.4 L264 137 L266 136.2 L268 136 L270 136.5 L272 137.6 L274 139.2 L276 140.8 L278 142.4 L280 143.5 L282 144 L284 143.8 L286 143 L288 141.6 L290 140 L292 138.4 L294 137 L296 136.2 L298 136 L300 136.5\"/><path class=\"s bgf\" d=\"M60 120 Q160 152 262 120 L250 104 H72 Z\"/><path class=\"s\" d=\"M120 104L120 34\"/><path class=\"s\" d=\"M196 104L196 44\"/><path class=\"s bgf\" d=\"M96 98 L152 26 L128 100 Z\"/><path class=\"s bgf\" d=\"M172 98 L226 36 L204 100 Z\"/><path class=\"a\" d=\"M300 40L248 40\"/><path class=\"a\" d=\"M255.2 36.5L248 40L255.2 43.5\"/></g><text class=\"a\" x=\"286\" y=\"30\" text-anchor=\"middle\" style=\"font-size:16px\">wind</text><text class=\"\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:15px\">triangular sails: closer to the wind</text></svg>"}, {"type": "concept", "title": "Finding latitude from the stars", "text": "On open water there are no landmarks. In the northern hemisphere, the height of the Pole Star above the horizon roughly equals your latitude. Sailors measured it with a quadrant or astrolabe.\n\nFurther south the Pole Star disappears, so Portuguese navigators measured the Sun at noon instead and used printed tables to correct for the season.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M20 140L300 140\"/><circle class=\"s bgf\" cx=\"84\" cy=\"114\" r=\"6\"/><path class=\"s\" d=\"M84 120L84 132\"/><path class=\"s\" d=\"M84 132L78 140\"/><path class=\"s\" d=\"M84 132L90 140\"/><path class=\"s\" d=\"M84 125L96 121\"/><path class=\"a\" d=\"M96 118L240 46\"/><path class=\"dash\" d=\"M96 118L220 118\"/><path class=\"r\" d=\"M156 118 A60 60 0 0 0 150 91\"/><path class=\"fred\" d=\"M246.0 31.0 L248.9 38.0 L256.5 38.6 L250.7 43.5 L252.5 50.9 L246.0 47.0 L239.5 50.9 L241.3 43.5 L235.5 38.6 L243.1 38.0 Z\"/></g><text class=\"r\" x=\"166\" y=\"108\" text-anchor=\"start\" style=\"font-size:16px\">angle ≈ latitude</text><text class=\"\" x=\"240\" y=\"22\" text-anchor=\"end\" style=\"font-size:16px\">Pole Star</text><text class=\"\" x=\"160\" y=\"166\" text-anchor=\"middle\" style=\"font-size:15px\">Lisbon: the Pole Star sits about 39° up</text></svg>"}, {"type": "concept", "title": "The great voyages", "text": "Bartolomeu Dias rounded the southern tip of Africa in 1488. Ten years later Vasco da Gama reached Calicut in India, opening the sea route to the spice trade and making Lisbon one of Europe's richest ports.\n\nIn 1500 Pedro Álvares Cabral, heading for India, swung so far west that he reached Brazil. And Fernão de Magalhães (Magellan), a Portuguese sailing for Spain, led the first voyage around the world, completed by Elcano in 1522.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"a\" d=\"M20 92L300 92\"/><circle class=\"fred\" cx=\"40\" cy=\"92\" r=\"6\"/><circle class=\"fred\" cx=\"100\" cy=\"92\" r=\"6\"/><circle class=\"fred\" cx=\"160\" cy=\"92\" r=\"6\"/><circle class=\"fred\" cx=\"220\" cy=\"92\" r=\"6\"/><circle class=\"fred\" cx=\"280\" cy=\"92\" r=\"6\"/></g><text class=\"r\" x=\"40\" y=\"76\" text-anchor=\"middle\" style=\"font-size:18px\">1419</text><text class=\"\" x=\"40\" y=\"116\" text-anchor=\"middle\" style=\"font-size:15px\">Madeira</text><text class=\"\" x=\"40\" y=\"134\" text-anchor=\"middle\" style=\"font-size:15px\"></text><text class=\"r\" x=\"100\" y=\"76\" text-anchor=\"middle\" style=\"font-size:18px\">1488</text><text class=\"\" x=\"100\" y=\"116\" text-anchor=\"middle\" style=\"font-size:15px\">Dias:</text><text class=\"\" x=\"100\" y=\"134\" text-anchor=\"middle\" style=\"font-size:15px\">Good Hope</text><text class=\"r\" x=\"160\" y=\"76\" text-anchor=\"middle\" style=\"font-size:18px\">1498</text><text class=\"\" x=\"160\" y=\"116\" text-anchor=\"middle\" style=\"font-size:15px\">da Gama:</text><text class=\"\" x=\"160\" y=\"134\" text-anchor=\"middle\" style=\"font-size:15px\">India</text><text class=\"r\" x=\"220\" y=\"76\" text-anchor=\"middle\" style=\"font-size:18px\">1500</text><text class=\"\" x=\"220\" y=\"116\" text-anchor=\"middle\" style=\"font-size:15px\">Cabral:</text><text class=\"\" x=\"220\" y=\"134\" text-anchor=\"middle\" style=\"font-size:15px\">Brazil</text><text class=\"r\" x=\"280\" y=\"76\" text-anchor=\"middle\" style=\"font-size:18px\">1522</text><text class=\"\" x=\"280\" y=\"116\" text-anchor=\"middle\" style=\"font-size:15px\">round the</text><text class=\"\" x=\"280\" y=\"134\" text-anchor=\"middle\" style=\"font-size:15px\">world</text><text class=\"\" x=\"160\" y=\"168\" text-anchor=\"middle\" style=\"font-size:14px\">not to scale</text></svg>"}, {"type": "concept", "title": "Splitting the world: Tordesillas", "text": "In 1494 Portugal and Castile signed the Treaty of Tordesillas, drawing a line from pole to pole 370 leagues west of the Cape Verde islands. New lands to the west would go to Castile, to the east to Portugal.\n\nThe tip of South America that bulged east of the line became Brazil, which is a big part of why around 210 million Brazilians speak Portuguese today.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><circle class=\"s bgf\" cx=\"160\" cy=\"98\" r=\"64\"/><ellipse class=\"dash\" cx=\"160\" cy=\"98\" rx=\"32\" ry=\"64\"/><path class=\"dash\" d=\"M96 98L224 98\"/><path class=\"r\" d=\"M136 26L136 172\"/></g><text class=\"\" x=\"62\" y=\"70\" text-anchor=\"middle\" style=\"font-size:17px\">Castile</text><text class=\"a\" x=\"262\" y=\"70\" text-anchor=\"middle\" style=\"font-size:17px\">Portugal</text><text class=\"a\" x=\"160\" y=\"136\" text-anchor=\"start\" style=\"font-size:15px\">Brazil</text><text class=\"r\" x=\"12\" y=\"22\" text-anchor=\"start\" style=\"font-size:20px\">1494</text><text class=\"r\" x=\"308\" y=\"22\" text-anchor=\"end\" style=\"font-size:13px\">370 leagues W of Cape Verde</text></svg>"}], "quiz": [{"q": "What could a caravel do better than a square-rigged ship?", "options": ["Carry more cargo", "Sail closer into the wind", "Sail faster with the wind behind"], "answer": 1, "explain": "Its lateen sails let it work into the wind, essential for exploring and getting home."}, {"q": "Who first reached India by sea from Europe?", "options": ["Bartolomeu Dias", "Vasco da Gama", "Pedro Álvares Cabral"], "answer": 1, "explain": "Vasco da Gama reached Calicut in 1498."}, {"q": "Why does Brazil speak Portuguese?", "options": ["Cabral claimed it and it lay on Portugal's side of the Tordesillas line", "It was bought from Spain", "Magellan settled it"], "answer": 0, "explain": "Cabral landed in 1500, and the land fell east of the 1494 treaty line."}]}]}, "world": {"id": "world", "topic": "world", "title": "World", "version": 1, "blurb": "The planet and its people: seasons, time zones, languages and cities.", "lessons": [{"id": "wo-planet", "title": "How the planet works", "summary": "Seasons, time zones, coordinates and the ocean's central heating.", "cards": [{"type": "concept", "title": "Why we have seasons", "text": "It isn't about distance: Earth is actually closest to the Sun in early January, in the middle of our winter.\n\nSeasons come from Earth's tilt of about 23.4°. In June the northern hemisphere leans toward the Sun, so sunlight hits it more directly and days are longer. In December it leans away.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><ellipse class=\"dash\" cx=\"160\" cy=\"90\" rx=\"112\" ry=\"34\"/><path class=\"r\" d=\"M190 90L200 90\"/><path class=\"r\" d=\"M181.2 111.2L188.3 118.3\"/><path class=\"r\" d=\"M160 120L160 130\"/><path class=\"r\" d=\"M138.8 111.2L131.7 118.3\"/><path class=\"r\" d=\"M130 90L120 90\"/><path class=\"r\" d=\"M138.8 68.8L131.7 61.7\"/><path class=\"r\" d=\"M160 60L160 50\"/><path class=\"r\" d=\"M181.2 68.8L188.3 61.7\"/><circle class=\"fred\" cx=\"160\" cy=\"90\" r=\"22\"/><circle class=\"s bgf\" cx=\"50\" cy=\"90\" r=\"15\"/><path class=\"s\" d=\"M42 112L58 68\"/><circle class=\"s bgf\" cx=\"270\" cy=\"90\" r=\"15\"/><path class=\"s\" d=\"M262 112L278 68\"/><path class=\"dash\" d=\"M35 90L65 90\"/><path class=\"dash\" d=\"M255 90L285 90\"/></g><text class=\"\" x=\"50\" y=\"138\" text-anchor=\"middle\" style=\"font-size:17px\">June</text><text class=\"r\" x=\"50\" y=\"156\" text-anchor=\"middle\" style=\"font-size:14px\">north: summer</text><text class=\"\" x=\"270\" y=\"138\" text-anchor=\"middle\" style=\"font-size:17px\">December</text><text class=\"a\" x=\"270\" y=\"156\" text-anchor=\"middle\" style=\"font-size:14px\">north: winter</text><text class=\"\" x=\"160\" y=\"176\" text-anchor=\"middle\" style=\"font-size:15px\">the 23.4° tilt makes the seasons</text></svg>"}, {"type": "widget", "widget": "clock", "title": "Try it: time zones", "formula": "360° ÷ 24 h = 15° per hour", "text": "Earth turns 360° a day, so each hour of time difference is about 15° of longitude. Countries round that off to suit their borders, and a few, like India, use half hours. Move Lisbon's clock (winter time) and watch the world follow."}, {"type": "concept", "title": "Latitude and longitude", "text": "Every place on Earth has two coordinates. Latitude says how far north or south of the equator you are, from 0° to 90°. Longitude says how far east or west of the Greenwich meridian in London, from 0° to 180°.\n\nViana do Castelo sits at about 41.7° N, 8.8° W.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><circle class=\"s bgf\" cx=\"120\" cy=\"92\" r=\"70\"/><ellipse class=\"s\" cx=\"120\" cy=\"92\" rx=\"70\" ry=\"13\"/><ellipse class=\"dash\" cx=\"120\" cy=\"45\" rx=\"52\" ry=\"9\"/><ellipse class=\"dash\" cx=\"120\" cy=\"92\" rx=\"35\" ry=\"70\"/><path class=\"dash\" d=\"M120 22L120 162\"/><circle class=\"fred\" cx=\"112\" cy=\"45\" r=\"4.5\"/><path class=\"r\" d=\"M116 43L200 36\"/></g><text class=\"r\" x=\"204\" y=\"34\" text-anchor=\"start\" style=\"font-size:15px\">Viana do Castelo</text><text class=\"r\" x=\"204\" y=\"52\" text-anchor=\"start\" style=\"font-size:15px\">41.7° N, 8.8° W</text><text class=\"a\" x=\"198\" y=\"96\" text-anchor=\"start\" style=\"font-size:15px\">equator 0°</text><text class=\"\" x=\"160\" y=\"176\" text-anchor=\"middle\" style=\"font-size:15px\">latitude: N–S · longitude: E–W</text></svg>"}, {"type": "concept", "title": "The ocean's central heating", "text": "Porto and New York sit at almost the same latitude, yet Porto's winters are far milder. Part of the reason is the Gulf Stream and its extension, which carry warm tropical water north-east across the Atlantic.\n\nWesterly winds blowing off that warm ocean bring the heat ashore. Cold water returns south, completing a vast loop.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"r\" d=\"M60 150 C78 84 160 44 252 52\"/><path class=\"r\" d=\"M236 50L262 54\"/><path class=\"r\" d=\"M254.4 56.3L262 54L255.4 49.5\"/><path class=\"a\" d=\"M266 76 C252 118 182 152 84 154\"/><path class=\"a\" d=\"M100 154L76 152\"/><path class=\"a\" d=\"M83.5 149.1L76 152L82.9 156.1\"/><circle class=\"fi\" cx=\"40\" cy=\"52\" r=\"4\"/><circle class=\"fi\" cx=\"290\" cy=\"104\" r=\"4\"/></g><text class=\"\" x=\"48\" y=\"40\" text-anchor=\"start\" style=\"font-size:15px\">New York</text><text class=\"\" x=\"300\" y=\"96\" text-anchor=\"end\" style=\"font-size:15px\">Porto</text><text class=\"r\" x=\"200\" y=\"40\" text-anchor=\"middle\" style=\"font-size:16px\">warm current</text><text class=\"a\" x=\"200\" y=\"170\" text-anchor=\"middle\" style=\"font-size:16px\">cold return</text><text class=\"\" x=\"160\" y=\"22\" text-anchor=\"middle\" style=\"font-size:15px\">North Atlantic (schematic)</text></svg>"}], "quiz": [{"q": "What causes the seasons?", "options": ["Earth's distance from the Sun", "The tilt of Earth's axis", "Changes in the Sun's brightness"], "answer": 1, "explain": "The 23.4° tilt changes how directly sunlight hits each hemisphere through the year."}, {"q": "Two places are 45° of longitude apart. Roughly how many hours apart are their clocks?", "options": ["3 hours", "4.5 hours", "45 hours"], "answer": 0, "explain": "15° per hour, so 45 ÷ 15 = 3 hours."}, {"q": "Latitude measures…", "options": ["East–west position", "North–south position", "Height above sea level"], "answer": 1, "explain": "Latitude runs from 0° at the equator to 90° at the poles."}]}, {"id": "wo-people", "title": "People and places", "summary": "Who lives where, what they speak, and why cities are where they are.", "cards": [{"type": "concept", "title": "If the world were 100 people", "text": "About 8 billion people live on Earth; the UN marked the milestone in November 2022. Shrink that to 100 people and roughly 59 live in Asia, 18 in Africa, 9 in Europe, 8 in Latin America, 5 in North America and 1 in Oceania.\n\nIndia and China alone hold more than a third of humanity. Africa is the fastest-growing region.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><circle cx=\"30\" cy=\"30\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"43\" cy=\"30\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"56\" cy=\"30\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"69\" cy=\"30\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"82\" cy=\"30\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"95\" cy=\"30\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"108\" cy=\"30\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"121\" cy=\"30\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"134\" cy=\"30\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"147\" cy=\"30\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"30\" cy=\"43\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"43\" cy=\"43\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"56\" cy=\"43\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"69\" cy=\"43\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"82\" cy=\"43\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"95\" cy=\"43\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"108\" cy=\"43\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"121\" cy=\"43\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"134\" cy=\"43\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"147\" cy=\"43\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"30\" cy=\"56\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"43\" cy=\"56\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"56\" cy=\"56\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"69\" cy=\"56\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"82\" cy=\"56\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"95\" cy=\"56\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"108\" cy=\"56\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"121\" cy=\"56\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"134\" cy=\"56\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"147\" cy=\"56\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"30\" cy=\"69\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"43\" cy=\"69\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"56\" cy=\"69\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"69\" cy=\"69\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"82\" cy=\"69\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"95\" cy=\"69\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"108\" cy=\"69\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"121\" cy=\"69\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"134\" cy=\"69\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"147\" cy=\"69\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"30\" cy=\"82\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"43\" cy=\"82\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"56\" cy=\"82\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"69\" cy=\"82\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"82\" cy=\"82\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\"95\" cy=\"82\" r=\"5\" fill=\"#3B6FD8\"/><circle cx=\" const TOPICS={ai:"AI",eng:"English",elec:"Electricity",tron:"Electronics",mech:"Engineering",sci:"Physics",hist:"History",world:"World"};
const TYPES={concept:"Concept",formula:"Formula",fact:"Fact",example:"Worked example",widget:"Try it",quiz:"Quiz"};

/* ---------- storage ---------- */
const KEY="spark-state-v1";
const dayStr=d=>d.toLocaleDateString("en-CA");
const today=()=>dayStr(new Date());
function defaults(){return{saved:[],favL:[],favT:{},seen:{},reads:{},log:[],quiz:{},review:{},done:{},goal:10,best:0}}
let S=defaults();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(defaults(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Couldn't save progress: storage is full or blocked.")}}
const DB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open("spark",1);r.onupgradeneeded=()=>r.result.createObjectStore("packs",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const tx=(m,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("packs",m);const r=fn(t.objectStore("packs"));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}));
  const LS="spark-packs-fallback",get=()=>{try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}},set=o=>{try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}};
  return{all:()=>tx("readonly",s=>s.getAll()).catch(()=>Object.values(get())),put:pk=>tx("readwrite",s=>s.put(pk)).catch(()=>{const o=get();o[pk.id]=pk;set(o)}),del:id=>tx("readwrite",s=>s.delete(id)).catch(()=>{const o=get();delete o[id];set(o)})};
})();

let PACKS={},LESSONS={},CARDS={},QUIZ={};
function indexPacks(){
  LESSONS={};CARDS={};QUIZ={};
  for(const pk of Object.values(PACKS))pk.lessons.forEach((l,li)=>{
    const L={...l,pack:pk.id,topic:pk.topic,n:li+1,cardIds:[],quizIds:[]};
    l.cards.forEach((c,k)=>{const id=`${l.id}-c${k}`;CARDS[id]={...c,id,lesson:l.id,topic:pk.topic};L.cardIds.push(id)});
    (l.quiz||[]).forEach((q,k)=>{const id=`${l.id}-q${k}`;QUIZ[id]={...q,id,lesson:l.id,topic:pk.topic};L.quizIds.push(id)});
    LESSONS[l.id]=L;
  });
}
async function loadPacks(){const list=await DB.all();PACKS={};(list||[]).forEach(p=>PACKS[p.id]=p);indexPacks()}
const validPack=p=>p&&typeof p.id==="string"&&TOPICS[p.topic]&&Array.isArray(p.lessons)&&p.lessons.every(l=>l.id&&Array.isArray(l.cards));
async function downloadPack(id){
  let pk=null;
  try{const r=await fetch(`packs/${id}.json`,{cache:"no-cache"});if(r.ok)pk=await r.json()}catch(e){}
  if(!validPack(pk))pk=BUNDLE[id];
  if(!validPack(pk))throw new Error("unavailable");
  pk.downloadedAt=new Date().toISOString();await DB.put(pk);PACKS[pk.id]=pk;indexPacks();
}
async function removePack(id){await DB.del(id);delete PACKS[id];indexPacks()}

/* ---------- progress ---------- */
function markRead(id,log=true){
  const d=today();S.reads[d]=S.reads[d]||[];
  if(!S.reads[d].includes(id))S.reads[d].push(id);
  if(log){S.log=S.log.filter(x=>x.id!==id||dayStr(new Date(x.t))!==d);S.log.push({id,t:Date.now()});if(S.log.length>3000)S.log=S.log.slice(-3000);S.seen[id]=1}
  S.best=Math.max(S.best,streak());save();
}
function streak(){let n=0,d=new Date();if(!(S.reads[dayStr(d)]||[]).length)d.setDate(d.getDate()-1);while((S.reads[dayStr(d)]||[]).length){n++;d.setDate(d.getDate()-1)}return n}
function lessonProgress(L){const seen=L.cardIds.filter(id=>S.seen[id]).length;return{seen,total:L.cardIds.length,done:!!S.done[L.id]}}
function nextLesson(){
  const all=Object.values(LESSONS);
  return all.find(L=>!S.done[L.id]&&L.cardIds.some(id=>S.seen[id]))||all.find(L=>!S.done[L.id])||null;
}
const isFav=id=>S.saved.includes(id)||S.favL.includes(id);
function toggleFav(id,kind){const k=kind==="l"?"favL":"saved";const on=S[k].includes(id);S[k]=on?S[k].filter(x=>x!==id):[...S[k],id];if(on)delete S.favT[id];else S.favT[id]=Date.now();save();toast(on?"Removed from favourites":"Added to favourites");return !on}
const byFavT=(a,b)=>(S.favT[b]||0)-(S.favT[a]||0);
const canSpeak="speechSynthesis" in window;
function speak(text){if(!canSpeak)return toast("Listening isn't available on this device");try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-GB";u.rate=.9;const vs=speechSynthesis.getVoices();const v=vs.find(v=>/^en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast("Listening isn't available on this device")}}
const dueReview=()=>Object.entries(S.review).filter(([id,t])=>t<=Date.now()&&QUIZ[id]).map(([id])=>id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=t=>esc(t).replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
function fmt(text){
  return String(text||"").split(/\n\n+/).map(par=>{const lines=par.split("\n");
    if(lines.some(l=>l.startsWith("• "))){const head=lines.filter(l=>!l.startsWith("• ")),items=lines.filter(l=>l.startsWith("• "));
      return (head.length?`<p>${md(head.join(" "))}</p>`:"")+`<ul>${items.map(l=>`<li>${md(l.slice(2))}</li>`).join("")}</ul>`}
    return lines.map(l=>`<p>${md(l)}</p>`).join("")}).join("");
}
function sketch(c,extra=""){return c&&c.sketch?`<div class="sk paper" ${extra}>${c.sketch}</div>`:""}
function thumb(c){if(c.sketch)return sketch(c);const w=WSK[c.widget];return w?`<div class="sk paper">${w}</div>`:`<div class="thumbph paper" data-t="${c.topic}">${esc(TYPES[c.type])}</div>`}

let view={tab:"home"};

function go(v){view=v;render();scrollTo(0,0)}

document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)go({tab:b.dataset.tab})});

function picker(){
  const sel=view.pick||CATALOG.map(c=>c.id);
  return `<div class="pack"><div class="band" style="background:var(--pen)"></div><div class="in"><h2>Pick topics to download</h2>

  <div class="row">${CATALOG.map(c=>`<button class="btn s ${sel.includes(c.id)?"":"ghost"}" data-pick="${c.id}" aria-pressed="${sel.includes(c.id)}">${sel.includes(c.id)?"✓ ":""}${esc(c.title)}</button>`).join("")}</div>
  <div class="row"><button class="btn" data-dlpicked ${sel.length?"":"disabled"}>Download ${sel.length} topic${sel.length===1?"":"s"}</button><span class="muted sm">${CATALOG.filter(c=>sel.includes(c.id)).reduce((a,c)=>a+c.lessons,0)} lessons</span></div></div></div>`;
}
function vHome(){
  const h=new Date().getHours(),greet=h<12?"Good morning":h<19?"Good afternoon":"Good evening";
  const head=`<div class="spread"><div><div class="eyebrow">${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div><h1>${greet}</h1></div>${netPill()}</div>`;
  if(!Object.keys(LESSONS).length)return head+`<div class="section">${picker()}</div>`;
  const n=(S.reads[today()]||[]).length,pct=Math.min(1,n/S.goal),C=2*Math.PI*40,st=streak();
  const days=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-(6-k));return d});
  const L=nextLesson(),due=dueReview();
  let cont="";
  if(L){const p=lessonProgress(L),first=CARDS[L.cardIds.find(id=>!S.seen[id])||L.cardIds[0]];
    cont=`<div class="section"><h2>${p.seen?"Continue":"Up next"}</h2><button class="cont" data-t="${L.topic}" data-lesson="${L.id}">${thumb(first)}<span class="body"><span class="tlabel"><span class="tdot"></span>${TOPICS[L.topic]} · Lesson ${L.n}</span><h3 style="font-size:19px">${esc(L.title)}</h3><span class="muted sm">${esc(L.summary)}</span><span class="row" style="flex-wrap:nowrap"><span class="bar" style="flex:1"><i style="width:${p.seen/p.total*100}%"></i></span><span class="eyebrow">${p.seen}/${p.total} cards</span></span></span></button></div>`;}
  else cont=`<div class="section"><div class="empty">You've finished every downloaded lesson. Download another topic in Learn, or review your saved cards.</div></div>`;
  const dc=Object.values(CARDS).filter(c=>c.sketch);const seed=[...today()].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);const spot=dc.length?dc[seed%dc.length]:null;
  return head+`<div class="hero" style="margin-top:18px">
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--pen)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg><div class="n"><span>${n}/${S.goal}<small>CARDS TODAY</small></span></div></div>
    <div><div class="flame">${I.home.replace("<svg",'<svg width="18" height="18"')} ${st}-day streak</div>

function vFav(){
