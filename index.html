/* Layout: engineer's notebook. Phone-width shell (max 560px), graph-paper sketch panels, fixed bottom tab bar, full-screen lesson reader. Dark mode is a blueprint. */
[hidden]{display:none!important}
:root{
  --bg:#EDF1F6; --paper:#FBFCFE; --grid:#E0E7F1; --ink:#1B2433; --muted:#5E6A7D; --line:#D3DBE6;
  --pen:#1F5FD1; --pen-ink:#FFFFFF; --red:#D64533; --hl:rgba(255,206,40,.55); --ok:#138A5E; --flame:#E08A00;
  --t-elec:#B57E00; --t-tron:#12805C; --t-mech:#C2410C; --t-sci:#6D3FC4; --t-ai:#C0267A; --t-hist:#8A5A2B; --t-world:#00838F; --t-eng:#3F3FB5;
  --f-display:"Archivo","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1424; --paper:#0F2139; --grid:#183052; --ink:#E4ECF7; --muted:#93A4BD; --line:#22395A;
  --pen:#7DB3FF; --pen-ink:#0A1424; --red:#FF8B78; --hl:rgba(255,206,40,.28); --ok:#4FD39A; --flame:#F5B53A;
  --t-elec:#F2C14E; --t-tron:#5CD6A6; --t-mech:#FB8B5B; --t-sci:#B79BFF; --t-ai:#F78DC2; --t-hist:#E0AE78; --t-world:#4DD0E1; --t-eng:#A9A9FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1424; --paper:#0F2139; --grid:#183052; --ink:#E4ECF7; --muted:#93A4BD; --line:#22395A;
  --pen:#7DB3FF; --pen-ink:#0A1424; --red:#FF8B78; --hl:rgba(255,206,40,.28); --ok:#4FD39A; --flame:#F5B53A;
  --t-elec:#F2C14E; --t-tron:#5CD6A6; --t-mech:#FB8B5B; --t-sci:#B79BFF; --t-ai:#F78DC2; --t-hist:#E0AE78; --t-world:#4DD0E1; --t-eng:#A9A9FF; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:800}
h3{font-size:17px;font-weight:800}
p{margin:0}
.hand{font-family:var(--f-hand);font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.sm{font-size:13.5px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--pen);color:var(--pen-ink);font-weight:650}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:6px 13px;font-size:13.5px}
.btn.danger{background:var(--red);color:#fff}
.link{background:none;border:0;color:var(--pen);font-weight:650;padding:4px 0}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:650;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:var(--ok)} .pill.off{color:var(--red);border-color:var(--red)}
[data-t]{--topic:var(--pen)}
[data-t="elec"]{--topic:var(--t-elec)}[data-t="tron"]{--topic:var(--t-tron)}[data-t="mech"]{--topic:var(--t-mech)}[data-t="sci"]{--topic:var(--t-sci)}[data-t="ai"]{--topic:var(--t-ai)}[data-t="hist"]{--topic:var(--t-hist)}[data-t="world"]{--topic:var(--t-world)}[data-t="eng"]{--topic:var(--t-eng)}
.tlabel{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--topic)}
.tdot{width:8px;height:8px;border-radius:2px;background:var(--topic);flex:none;transform:rotate(45deg)}
.bar{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--topic)}

/* graph paper + sketches */
.paper{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;background-position:-1px -1px}
.sk{border-radius:14px;border:1px solid var(--line);overflow:hidden}
.sk svg{display:block;width:100%;height:auto;overflow:visible}
.sk .d{filter:url(#rough)}
.sk .s,.sk .a,.sk .r,.sk .dash,.sk .dashr{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sk .s{stroke:var(--ink)} .sk .a{stroke:var(--pen)} .sk .r{stroke:var(--red)}
.sk .dash{stroke:var(--muted);stroke-dasharray:5 5;stroke-width:1.6} .sk .dashr{stroke:var(--red);stroke-dasharray:6 5;stroke-width:1.8}
.sk .bgf{fill:var(--paper)} .sk .bgr{fill:var(--paper);stroke:none}
.sk .w{fill:var(--pen);opacity:.2} .sk .y{fill:var(--hl)} .sk .rz{fill:var(--red);opacity:.2}
.sk .fi{fill:var(--ink)} .sk .fhl{fill:var(--hl)} .sk .fpen{fill:var(--pen)} .sk .fred{fill:var(--red)}
.sk text{font-family:var(--f-hand);font-weight:600;font-size:19px;fill:var(--ink)}
.sk text[class]{stroke:none} .sk text.a{fill:var(--pen)} .sk text.r{fill:var(--red)} .sk text.tp{fill:var(--paper)} .sk text.mono{font-family:var(--f-mono);font-weight:500}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}
.ring{width:88px;height:88px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.ring .n small{display:block;font-family:var(--f-mono);font-size:9px;font-weight:500;color:var(--muted);margin-top:4px}
.flame{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--flame)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,24px));gap:4px;margin-top:10px}
.week span{height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;background:var(--bg);color:var(--muted)}
.week span.on{background:var(--flame);color:#1b1300}
.week span.today{outline:1.5px solid var(--ink)}
.cont{display:flex;flex-direction:column;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;padding:0;width:100%;color:var(--ink)}
.cont .sk{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.cont .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.rev{display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--red) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));border-radius:16px;padding:14px;width:100%;text-align:left;color:var(--ink)}
.rev b{font-family:var(--f-display);font-size:26px;color:var(--red);min-width:32px;text-align:center}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--topic);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink)}

/* learn */

.cities{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;font-size:14.5px}

.cities .dn.sun{background:var(--hl);color:var(--ink)} .cities .dn.moon{background:var(--ink);color:var(--paper)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:650;font-size:14px;z-index:80;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){.card{transition:none}}

<script>
"use strict";
const CATALOG=[{"id": "ai", "topic": "ai", "title": "Artificial Intelligence", "blurb": "How machines learn and what's really inside a chatbot, explained without maths homework.", "version": 2, "lessons": 20, "cards": 200, "quiz": 62, "kb": 111}, {"id": "english", "topic": "eng", "title": "English", "blurb": "Gramática e vocabulário em inglês, explicados em português.", "version": 2, "lessons": 20, "cards": 200, "quiz": 69, "kb": 126}, {"id": "electricity", "topic": "elec", "title": "Electricity", "blurb": "From Ohm's law to the fuse board in your hallway.", "version": 2, "lessons": 20, "cards": 200, "quiz": 65, "kb": 105}, {"id": "electronics", "topic": "tron", "title": "Electronics", "blurb": "Components and signals for tinkering with microcontrollers.", "version": 2, "lessons": 20, "cards": 200, "quiz": 64, "kb": 97}, {"id": "mechanics", "topic": "mech", "title": "Engineering", "blurb": "Forces, machines and the shapes that keep structures standing.", "version": 2, "lessons": 20, "cards": 200, "quiz": 64, "kb": 102}, {"id": "physics", "topic": "sci", "title": "Physics", "blurb": "Energy, heat and waves in everyday life.", "version": 2, "lessons": 20, "cards": 200, "quiz": 64, "kb": 102}, {"id": "history", "topic": "hist", "title": "History", "blurb": "The turning points of humanity, and Portugal's leap into the open ocean.", "version": 2, "lessons": 20, "cards": 200, "quiz": 64, "kb": 108}, {"id": "world", "topic": "world", "title": "World", "blurb": "The planet and its people: seasons, time zones, languages and cities.", "version": 2, "lessons": 20, "cards": 200, "quiz": 64, "kb": 108}];
const BUNDLE={};
const TOPICS={ai:"AI",eng:"English",elec:"Electricity",tron:"Electronics",mech:"Engineering",sci:"Physics",hist:"History",world:"World"};
const TYPES={concept:"Concept",formula:"Formula",fact:"Fact",example:"Worked example",widget:"Try it",quiz:"Quiz"};

/* ---------- storage ---------- */
const KEY="spark-state-v1";
const dayStr=d=>d.toLocaleDateString("en-CA");
const today=()=>dayStr(new Date());
function defaults(){return{saved:[],favL:[],favT:{},seen:{},reads:{},log:[],quiz:{},review:{},done:{},goal:10,best:0}}
let S=defaults();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(defaults(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Couldn't save progress: storage is full or blocked.")}}
const DB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open("spark",1);r.onupgradeneeded=()=>r.result.createObjectStore("packs",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));

  const LS="spark-packs-fallback",get=()=>{try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}},set=o=>{try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}};
  return{all:()=>tx("readonly",s=>s.getAll()).catch(()=>Object.values(get())),put:pk=>tx("readwrite",s=>s.put(pk)).catch(()=>{const o=get();o[pk.id]=pk;set(o)}),del:id=>tx("readwrite",s=>s.delete(id)).catch(()=>{const o=get();delete o[id];set(o)})};
})();

let PACKS={},LESSONS={},CARDS={},QUIZ={};
function indexPacks(){
  LESSONS={};CARDS={};QUIZ={};
  for(const pk of Object.values(PACKS))pk.lessons.forEach((l,li)=>{
    const L={...l,pack:pk.id,topic:pk.topic,n:li+1,cardIds:[],quizIds:[]};
    l.cards.forEach((c,k)=>{const id=`${l.id}-c${k}`;CARDS[id]={...c,id,lesson:l.id,topic:pk.topic};L.cardIds.push(id)});
    (l.quiz||[]).forEach((q,k)=>{const id=`${l.id}-q${k}`;QUIZ[id]={...q,id,lesson:l.id,topic:pk.topic};L.quizIds.push(id)});
    LESSONS[l.id]=L;
  });
}
async function loadPacks(){const list=await DB.all();PACKS={};(list||[]).forEach(p=>PACKS[p.id]=p);indexPacks()}
const validPack=p=>p&&typeof p.id==="string"&&TOPICS[p.topic]&&Array.isArray(p.lessons)&&p.lessons.every(l=>l.id&&Array.isArray(l.cards));
async function downloadPack(id){
  let pk=null;
  try{const r=await fetch(`packs/${id}.json`,{cache:"no-cache"});if(r.ok)pk=await r.json()}catch(e){}
  if(!validPack(pk))pk=BUNDLE[id];
  if(!validPack(pk))throw new Error("unavailable");
  pk.downloadedAt=new Date().toISOString();await DB.put(pk);PACKS[pk.id]=pk;indexPacks();
}
async function removePack(id){await DB.del(id);delete PACKS[id];indexPacks()}

/* ---------- progress ---------- */
function markRead(id,log=true){
  const d=today();S.reads[d]=S.reads[d]||[];
  if(!S.reads[d].includes(id))S.reads[d].push(id);
  if(log){S.log=S.log.filter(x=>x.id!==id||dayStr(new Date(x.t))!==d);S.log.push({id,t:Date.now()});if(S.log.length>3000)S.log=S.log.slice(-3000);S.seen[id]=1}
  S.best=Math.max(S.best,streak());save();
}
function streak(){let n=0,d=new Date();if(!(S.reads[dayStr(d)]||[]).length)d.setDate(d.getDate()-1);while((S.reads[dayStr(d)]||[]).length){n++;d.setDate(d.getDate()-1)}return n}
function lessonProgress(L){const seen=L.cardIds.filter(id=>S.seen[id]).length;return{seen,total:L.cardIds.length,done:!!S.done[L.id]}}
function nextLesson(){
  const all=Object.values(LESSONS);
  return all.find(L=>!S.done[L.id]&&L.cardIds.some(id=>S.seen[id]))||all.find(L=>!S.done[L.id])||null;
}
const isFav=id=>S.saved.includes(id)||S.favL.includes(id);
function toggleFav(id,kind){const k=kind==="l"?"favL":"saved";const on=S[k].includes(id);S[k]=on?S[k].filter(x=>x!==id):[...S[k],id];if(on)delete S.favT[id];else S.favT[id]=Date.now();save();toast(on?"Removed from favourites":"Added to favourites");return !on}
const byFavT=(a,b)=>(S.favT[b]||0)-(S.favT[a]||0);
const canSpeak="speechSynthesis" in window;
function speak(text){if(!canSpeak)return toast("Listening isn't available on this device");try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-GB";u.rate=.9;const vs=speechSynthesis.getVoices();const v=vs.find(v=>/^en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast("Listening isn't available on this device")}}
const dueReview=()=>Object.entries(S.review).filter(([id,t])=>t<=Date.now()&&QUIZ[id]).map(([id])=>id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=t=>esc(t).replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
function fmt(text){
  return String(text||"").split(/\n\n+/).map(par=>{const lines=par.split("\n");
    if(lines.some(l=>l.startsWith("• "))){const head=lines.filter(l=>!l.startsWith("• ")),items=lines.filter(l=>l.startsWith("• "));
      return (head.length?`<p>${md(head.join(" "))}</p>`:"")+`<ul>${items.map(l=>`<li>${md(l.slice(2))}</li>`).join("")}</ul>`}
    return lines.map(l=>`<p>${md(l)}</p>`).join("")}).join("");
}
/* ---------- generated notebook diagrams (card.viz) ---------- */
const VZ=(()=>{
  const f=n=>Math.round(n*10)/10, CW=.44;
  const wrap=(s,max)=>{const out=[];let cur="";for(const w of String(s).split(/\s+/).filter(Boolean)){if(!cur)cur=w;else if((cur+" "+w).length<=max)cur+=" "+w;else{out.push(cur);cur=w}}if(cur)out.push(cur);return out.length?out:[""]};

  const dc=Object.values(CARDS).filter(c=>c.sketch);const seed=[...today()].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);const spot=dc.length?dc[seed%dc.length]:null;
  return head+`<div class="hero" style="margin-top:18px">
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="50" cy="50" r="40" fill="none" stroke="var(--pen)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg><div class="n"><span>${n}/${S.goal}<small>CARDS TODAY</small></span></div></div>

  ${due.length?`<div class="section"><button class="rev" data-review><b>${due.length}</b><span class="meta"><h3>Questions to review</h3><span class="muted sm">You missed these before. A quick retry makes them stick.</span></span></button></div>`:""}

async function doDownload(ids){
  let ok=0,fail=0;for(const id of ids){view.busy=id;render();try{await downloadPack(id);ok++}catch(e){fail++}}
  view.busy=null;render();toast(fail?`${ok} downloaded, ${fail} failed. Check the connection and try again.`:`${ok} topic${ok===1?"":"s"} ready offline`);
}
function startLesson(lid){
  const L=LESSONS[lid],p=lessonProgress(L);
  const items=[...L.cardIds.map(id=>({k:"c",id})),...L.quizIds.map(id=>({k:"q",id}))];
  let i=L.cardIds.findIndex(id=>!S.seen[id]);if(i<0)i=p.done?0:L.cardIds.length;
  openReader(items,i,{mode:"lesson",lesson:lid,title:`Lesson ${L.n} · ${L.title}`,topic:L.topic});
}
function openCard(id,list){const c=CARDS[id];if(!list){const L=LESSONS[c.lesson];return openReader([...L.cardIds.map(x=>({k:"c",id:x})),...L.quizIds.map(x=>({k:"q",id:x}))],L.cardIds.indexOf(id),{mode:"lesson",lesson:L.id,title:`Lesson ${L.n} · ${L.title}`,topic:L.topic})}
  openReader(list.map(x=>({k:"c",id:x})),list.indexOf(id),{mode:"list",title:"Saved",topic:c.topic})}
document.getElementById("app").addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.lesson)return startLesson(d.lesson);
  if(d.card)return openCard(d.card);
  if(d.open)return openCard(d.open,d.list.split(","));
  if(d.play){const ids=d.play.split(",");return openReader(ids.map(id=>({k:"c",id})),0,{mode:"list",title:"Saved",topic:CARDS[ids[0]].topic})}
  if("review" in d){const ids=dueReview();return openReader(ids.map(id=>({k:"q",id})),0,{mode:"review",title:"Review",topic:QUIZ[ids[0]].topic})}
  if(d.pack)return go({tab:"learn",pack:d.pack});
  if(d.tabGo)return go({tab:d.tabGo});
  if(d.pick){const sel=view.pick||CATALOG.map(c=>c.id);view.pick=sel.includes(d.pick)?sel.filter(x=>x!==d.pick):[...sel,d.pick];return render()}
  if("dlpicked" in d)return doDownload(view.pick||CATALOG.map(c=>c.id));
  if(d.dl)return doDownload([d.dl]);
  if("dlall" in d)return doDownload(CATALOG.filter(c=>!PACKS[c.id]).map(c=>c.id));
  if(d.askrm){view.confirmDel=d.askrm;return render()}
  if("cancelrm" in d){view.confirmDel=null;return render()}
  if(d.rm){await removePack(d.rm);toast("Topic removed. Your progress is kept.");return go({tab:"learn"})}
  if(d.export){const pk=PACKS[d.export];return saveFile(`spark-${pk.id}.html`,packHTML(pk),"text/html")}
  if("import" in d)return document.getElementById("filein").click();
  if("backup" in d)return saveFile(`spark-backup-${today()}.json`,JSON.stringify({kind:"spark-backup",state:S,packs:Object.values(PACKS)}),"application/json");
  if(d.unsave){toggleFav(d.unsave,"c");return render()}
  if(d.favl){toggleFav(d.favl,"l");return render()}
  if(d.ft){view.ft=d.ft;return render()}
  if(d.goal){S.goal=+d.goal;save();return render()}
  if("allhist" in d){view.allHist=1;return render()}
  if("install" in d&&deferredInstall){deferredInstall.prompt();deferredInstall=null}
});
document.getElementById("filein").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const data=JSON.parse(await f.text());
    if(data.kind==="spark-backup"){S=Object.assign(defaults(),data.state);save();for(const p of data.packs||[])if(validPack(p))await DB.put(p);await loadPacks();render();return toast("Backup restored")}
    const list=Array.isArray(data.packs)?data.packs:[data];let n=0;
    for(const p of list)if(validPack(p)){p.downloadedAt=new Date().toISOString();await DB.put(p);n++}
    if(!n)throw 0;await loadPacks();render();toast(`${n} topic${n===1?"":"s"} imported`);
  }catch(err){toast("That file isn't a Spark topic or backup.")}
});

    divider:R("w-vin","Vin",1,24,0.5,5)+R("w-r1","R1",1,100,1,10)+R("w-r2","R2",1,100,1,18)+`<div class="readout" data-out></div><span class="badge" data-badge></span>`,
    lever:R("w-m","Mass",1,10,1,2)+R("w-d","Distance",0.5,4,0.25,2)+`<div class="readout" data-out></div>`,
    neuron:`<div class="togs">${[["w-s","Sunny",1],["w-w","Weekend",0],["w-rn","Raining",0]].map(([id,l,on])=>`<label class="tog" for="${id}"><input type="checkbox" id="${id}" ${on?"checked":""}>${l}</label>`).join("")}</div><div class="readout" data-out></div>`,
    nextword:R("w-t","Temp.",1,20,1,10)+`<div class="row"><button class="btn s" data-gen>Generate</button><span class="muted sm" data-tl></span></div><div class="gen" data-gen-out>The cat sat on the …</div>`,
    clock:R("w-h","Lisbon",0,95,1,48)+`<div class="cities" data-cities></div><p class="muted sm">Winter offsets; daylight saving shifts some of these by an hour in summer.</p>`,
    wave:R("w-f","Pitch",0,100,1,47)+`<div class="readout" data-out></div><p class="muted sm">Humans hear roughly 20 Hz to 20 kHz.</p>`
  }[c.widget]||"";
  if(c.widget==="flip")return `<div class="wg" data-widget="flip"><button class="fc paper" data-fc></button><div class="fnav"><button class="btn s ghost" data-fp aria-label="Previous word">‹</button><span class="eyebrow" data-fn style="text-align:center"></span>${canSpeak?`<button class="btn s ghost" data-fs>${I.sound.replace("<svg",'<svg width="16" height="16" style="vertical-align:-3px"')} Ouvir</button>`:"<span></span>"}<button class="btn s" data-fx aria-label="Next word">›</button></div></div>`;
  return `<div class="wg" data-widget="${c.widget}"><div class="sk paper">${WSK[c.widget]}</div>${body}</div>`;
}
const fmtNum=(v,d=2)=>Number(v).toFixed(d).replace(/\.?0+$/,"");
function initWidget(root){
  const w=root.querySelector("[data-widget]");if(!w)return;const k=w.dataset.widget,$=s=>w.querySelector(s),v=id=>+$(`#${id}`).value;
  if(k==="flip"){const card=CARDS[R.items[R.i].id],it=card.items;let i=0,show=false;
    const draw=()=>{const [en,pt,note,ex]=it[i];$("[data-fc]").innerHTML=`<span class="eyebrow">${show?"significa":"English"}</span><span class="fw">${esc(en)}</span>`+(show?`<span class="fpt">${esc(pt)}</span>${note?`<span class="muted sm">${esc(note)}</span>`:""}${ex?`<span class="fex">${esc(ex)}</span>`:""}`:`<span class="muted sm">Toca para ver o significado</span>`);$("[data-fn]").textContent=`${i+1} / ${it.length}`};
    $("[data-fc]").addEventListener("click",()=>{show=!show;draw()});
    $("[data-fp]").addEventListener("click",()=>{i=(i-1+it.length)%it.length;show=false;draw()});
    $("[data-fx]").addEventListener("click",()=>{i=(i+1)%it.length;show=false;draw()});
    const fs=$("[data-fs]");if(fs)fs.addEventListener("click",()=>speak(it[i][0]+". "+(it[i][3]||"")));
    draw();return}
  const setOut=(id,txt)=>{$(`output[for="${id}"]`).textContent=txt};
  const upd={
    ohm(){const V=v("w-v"),R=v("w-r"),I=V/R,P=V*I;setOut("w-v",V+" V");setOut("w-r",R+" Ω");
      $("[data-vt]").textContent=V+" V";$("[data-rt]").textContent=R+" Ω";$("[data-it]").textContent=fmtNum(I)+" A →";
      const g=$("[data-glow]");g.setAttribute("r",18+Math.min(30,P/2.5));g.setAttribute("opacity",Math.min(1,0.15+P/60));
      $("[data-out]").innerHTML=`I = ${V} ÷ ${R} = <b>${fmtNum(I)} A</b><br>P = ${V} × ${fmtNum(I)} = <b>${fmtNum(P,1)} W</b>`},
    divider(){const Vi=v("w-vin"),R1=v("w-r1"),R2=v("w-r2"),Vo=Vi*R2/(R1+R2);setOut("w-vin",Vi+" V");setOut("w-r1",R1+" kΩ");setOut("w-r2",R2+" kΩ");
      $("[data-vin]").textContent=`Vin ${Vi} V`;$("[data-r1]").textContent=`R1 ${R1} kΩ`;$("[data-r2]").textContent=`R2 ${R2} kΩ`;$("[data-vo]").textContent=`Vout ${fmtNum(Vo)} V`;
      $("[data-out]").innerHTML=`Vout = ${Vi} × ${R2} ÷ (${R1} + ${R2}) = <b>${fmtNum(Vo)} V</b>`;
      const b=$("[data-badge]");const ok=Vo<=3.3001;b.className="badge "+(ok?"ok":"no");b.textContent=ok?"Safe for a 3.3 V input pin":"Too high for an ESP32 pin (max 3.3 V)"},
    lever(){const m=v("w-m"),d=v("w-d"),tl=m*d,tr=6,ang=Math.max(-14,Math.min(14,(tr-tl)*3));setOut("w-m",m+" kg");setOut("w-d",fmtNum(d)+" m");
      const s=Math.min(46,18+m*3),x=160-d*35-s/2,lb=$("[data-lb]");lb.setAttribute("x",x);lb.setAttribute("y",104-s);lb.setAttribute("width",s);lb.setAttribute("height",s);
      const lt=$("[data-lt]");lt.setAttribute("x",x+s/2);lt.setAttribute("y",98-s);lt.textContent=m+" kg";
      $("[data-beam]").setAttribute("transform",`rotate(${ang} 160 108)`);
      const bal=Math.abs(tl-tr)<0.01,st=$("[data-st]");st.textContent=bal?"balanced!":tl<tr?"right side wins":"left side wins";st.setAttribute("class",bal?"a":"r");
      $("[data-out]").innerHTML=`left ${m} × ${fmtNum(d)} = <b>${fmtNum(tl)}</b> · right 6 × 1 = <b>6</b>`},
    neuron(){const on=["w-s","w-w","w-rn"].map(id=>$(`#${id}`).checked?1:0),W=[3,2,-4],sum=on.reduce((a,x,i)=>a+x*W[i],0)-2,fire=sum>0;
      on.forEach((x,i)=>$(`[data-in${i}]`).setAttribute("class","s "+(x?"fpen":"bgf")));
      $("[data-node]").setAttribute("class","s "+(fire?"fred":"bgf"));$("[data-sum]").textContent=sum>0?"+"+sum:String(sum).replace("-","−");$("[data-sum]").setAttribute("class",fire?"tp":"");
      $("[data-go]").textContent=fire?"beach!":"stay";$("[data-go]").setAttribute("class",fire?"a":"r");$("[data-go]").setAttribute("text-anchor","start");
      $("[data-out]").innerHTML=`${on.map((x,i)=>`${x}×${W[i]}`.replace("-","−")).join(" + ")} − 2 = <b>${String(sum).replace("-","−")}</b> → ${fire?"fires: go to the beach":"stays quiet"}`},
    nextword(){const T=v("w-t")/10,P=[.62,.14,.09,.05,.03],W=["mat","sofa","floor","bed","roof"],q=P.map(p=>Math.pow(p,1/T)),z=q.reduce((a,b)=>a+b,0),pr=q.map(x=>x/z);
      setOut("w-t",T.toFixed(1));pr.forEach((p,k)=>{const w=Math.max(2,p*290);$(`[data-b${k}]`).setAttribute("width",w);const t=$(`[data-p${k}]`);t.setAttribute("x",86+w);t.textContent=Math.round(p*100)+"%"});
      $("[data-tl]").textContent=T<0.6?"cautious: nearly always “mat”":T>1.4?"adventurous: anything goes":"balanced";
      w._pick=()=>{let r=Math.random(),k=0;while(k<pr.length-1&&(r-=pr[k])>0)k++;return W[k]}},
    clock(){const m=v("w-h")*15,fmt=x=>{x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};setOut("w-h",fmt(m));
      const hh=$("[data-hh]"),mh=$("[data-mh]"),ha=((m/60)%12)/12*2*Math.PI,ma=(m%60)/60*2*Math.PI;
      hh.setAttribute("d",`M160 75 L${(160+30*Math.sin(ha)).toFixed(1)} ${(75-30*Math.cos(ha)).toFixed(1)}`);mh.setAttribute("d",`M160 75 L${(160+45*Math.sin(ma)).toFixed(1)} ${(75-45*Math.cos(ma)).toFixed(1)}`);
      const C=[["Lisbon",0],["New York",-5],["São Paulo",-3],["Luanda",1],["Maputo",2],["Moscow",3],["Dubai",4],["Mumbai",5.5],["Shanghai",8],["Tokyo",9]];
      $("[data-cities]").innerHTML=C.map(([n,o])=>{const t=m+o*60,dayN=Math.floor((((t)%1440)+1440)%1440/60),day=dayN>=7&&dayN<19,dd=Math.floor(t/1440);
        return `<span class="${o===0?"me":""}">${n} <span class="muted sm">UTC${o>=0?"+":"−"}${String(Math.abs(o)).replace(".5",":30")}</span></span><span class="t">${fmt(t)}${dd>0?" +1d":dd<0?" −1d":""}</span><span class="dn ${day?"sun":"moon"}">${day?"day":"night"}</span>`}).join("")},
    wave(){const x=v("w-f"),f=20*Math.pow(10,3*x/100),lam=343/f;setOut("w-f",f>=1000?fmtNum(f/1000,1)+" kHz":Math.round(f)+" Hz");
      const cyc=0.6+9*x/100,lpx=300/cyc;let dd="M10 70";for(let px=0;px<=300;px+=2)dd+=` L${10+px} ${(70-38*Math.sin(2*Math.PI*px/lpx)).toFixed(1)}`;$("[data-wp]").setAttribute("d",dd);
      const x1=10+lpx/4,x2=x1+lpx;$("[data-wl]").setAttribute("d",x2<=310?`M${x1} 20 H${x2} M${x1} 14 V26 M${x2} 14 V26`:"");$("[data-wt]").setAttribute("x",x2<=310?(x1+x2)/2:160);$("[data-wt]").setAttribute("y",x2<=310?14:132);
      const L=lam>=1?fmtNum(lam)+" m":lam>=0.01?fmtNum(lam*100,1)+" cm":fmtNum(lam*1000,1)+" mm";
      const cmp=lam>8?"longer than a bus":lam>1.6?"taller than a person":lam>0.3?"about the length of an arm":lam>0.05?"about the size of a hand":"smaller than a coin";
      $("[data-wt]").textContent="λ = "+L;
      $("[data-out]").innerHTML=`λ = 343 ÷ ${Math.round(f)} = <b>${L}</b><br>${cmp}`}
  }[k];
  if(!upd)return;w.querySelectorAll("input").forEach(i=>i.addEventListener(i.type==="checkbox"?"change":"input",upd));upd();
  const g=w.querySelector("[data-gen]");if(g)g.addEventListener("click",()=>{const o=w.querySelector("[data-gen-out]");o.innerHTML=`The cat sat on the <b>${w._pick()}</b>.`});
}

/* ---------- reader ---------- */
let R=null;const rEl=document.getElementById("reader");
function openReader(items,i,o){items=items.filter(x=>x.k==="c"?CARDS[x.id]:QUIZ[x.id]);if(!items.length)return;R={items,i:Math.max(0,Math.min(i,items.length)),ans:{},...o};rEl.hidden=false;document.body.style.overflow="hidden";drawReader()}
function closeReader(){rEl.hidden=true;document.body.style.overflow="";R=null;render()}
function drawReader(){
  const it=R.items[R.i],done=R.i>=R.items.length;
  rEl.dataset.t=done?R.topic:(it.k==="c"?CARDS[it.id]:QUIZ[it.id]).topic;
  const top=`<div class="rtop"><div class="spread"><button class="iconbtn" data-rclose aria-label="Close">${I.close}</button><span class="eyebrow" style="text-align:center;min-width:0">${esc(R.title)}</span><span class="eyebrow" style="width:44px;text-align:right">${done?"":`${R.i+1}/${R.items.length}`}</span></div><div class="prog">${R.items.map((x,k)=>`<i class="${x.k==="q"?"q":""} ${k<=R.i?"on":""}"></i>`).join("")}</div></div>`;
  if(done){
    const qs=R.items.filter(x=>x.k==="q"),right=qs.filter(x=>R.ans[x.id]===QUIZ[x.id].answer).length;
    if(R.mode==="lesson"&&qs.length){const prev=S.done[R.lesson];S.done[R.lesson]={t:Date.now(),score:right,best:Math.max(right,prev?.best||0),total:qs.length};save()}
    const L=R.mode==="lesson"?LESSONS[R.lesson]:null,pk=L&&PACKS[L.pack],idx=pk?pk.lessons.findIndex(l=>l.id===L.id):-1,nextL=pk&&pk.lessons[idx+1];
    rEl.innerHTML=top+`<div class="rstage"><div class="card finish">${qs.length?`<span class="big">${right}/${qs.length}</span><h2>${right===qs.length?"Perfect score":right>=qs.length/2?"Nicely done":"Keep going"}</h2><p class="muted">${right<qs.length?"Missed questions come back in Today → Review.":"Everything answered correctly."}</p>`:`<span class="big">✓</span><h2>All read</h2>`}
      <p class="muted sm">${(S.reads[today()]||[]).length} cards today · ${streak()}-day streak</p>
      <div class="row" style="justify-content:center">${L?`<button class="btn ghost" data-favl="${L.id}">${S.favL.includes(L.id)?"★ In favourites":"☆ Add lesson to favourites"}</button>`:""}</div><div class="row" style="justify-content:center">${nextL?`<button class="btn" data-nextlesson="${nextL.id}">Next lesson</button>`:""}<button class="btn ${nextL?"ghost":""}" data-rclose>Done</button></div></div></div>`;
    return;
  }
  let inner;
  if(it.k==="c"){
    const c=CARDS[it.id];markRead(c.id);
    inner=`<span class="ctype">${esc(c.tag||TYPES[c.type]||"Card")}</span><h2>${esc(c.title)}</h2>${c.type!=="widget"?sketch(c):""}${c.formula?`<div class="formula"${c.formula.length>16?' style="font-size:21px"':""}>${esc(c.formula)}</div>`:""}${c.type==="widget"?widgetHTML(c):""}<div class="text">${fmt(c.text)}</div>${c.example?`<div class="ex"><span class="eyebrow">Worked example</span>${c.example.map(l=>`<span>${esc(l)}</span>`).join("")}</div>`:""}`;
  }else{
    const q=QUIZ[it.id],a=R.ans[it.id],answered=a!==undefined;
    inner=`<span class="ctype">${R.mode==="review"?"Review":"Quiz"}</span><h2>${esc(q.q)}</h2><div class="opts">${q.options.map((o,k)=>`<button class="opt ${answered?(k===q.answer?"right":k===a?"wrong":""):""}" data-ans="${k}" ${answered?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${answered?`<div class="fb ${a===q.answer?"ok":"no"}"><b>${a===q.answer?"Correct":"Not quite"}</b>${esc(q.explain)}</div>`:""}`;
  }
  const isQ=it.k==="q",answered=isQ&&R.ans[it.id]!==undefined,saved=!isQ&&S.saved.includes(it.id);
  rEl.innerHTML=top+`<div class="rstage"><article class="card" id="card">${inner}</article></div>
  <div class="ractions"><button class="iconbtn" data-prev aria-label="Previous" ${R.i===0?'disabled style="opacity:.35"':""}>${I.left}</button>
  <div class="mid">${isQ?"":`<button class="iconbtn ${saved?"saved":""}" data-save aria-label="${saved?"Remove from favourites":"Add to favourites"}" aria-pressed="${saved}">${I.star}</button>`}${!isQ&&canSpeak&&CARDS[it.id].say?`<button class="iconbtn" data-say aria-label="Listen in English">${I.sound}</button>`:""}</div>
  <button class="btn nextbtn" data-next>${isQ&&!answered?"Skip":R.i===R.items.length-1?"Finish":"Next"}</button></div>`;
  initWidget(rEl);swipe(document.getElementById("card"));
}
function step(n){if(!R)return;R.i=Math.min(R.items.length,Math.max(0,R.i+n));drawReader();const c=document.getElementById("card");if(c)c.scrollTop=0}
rEl.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if("rclose" in d)return closeReader();
  if("next" in d)return step(1);
  if("prev" in d)return step(-1);
  if(d.nextlesson){closeReader();return startLesson(d.nextlesson)}
  if("save" in d){toggleFav(R.items[R.i].id,"c");const b=rEl.querySelector("[data-save]"),on=S.saved.includes(R.items[R.i].id);b.classList.toggle("saved",on);b.setAttribute("aria-pressed",on);b.setAttribute("aria-label",on?"Remove from favourites":"Add to favourites");return}
  if("say" in d)return speak(CARDS[R.items[R.i].id].say);
  if(d.favl){toggleFav(d.favl,"l");return drawReader()}
  if(d.ans!==undefined){const id=R.items[R.i].id,q=QUIZ[id],a=+d.ans,ok=a===q.answer;R.ans[id]=a;S.quiz[id]={ok,t:Date.now()};
    if(ok)delete S.review[id];else{const t=new Date();t.setHours(24,0,0,0);S.review[id]=R.mode==="review"?t.getTime():t.getTime()}
    markRead(id,false);drawReader()}
});
document.addEventListener("keydown",e=>{if(!R||rEl.hidden)return;if(e.target.matches("input"))return;
  if(e.key==="ArrowRight"){e.preventDefault();step(1)}else if(e.key==="ArrowLeft")step(-1);else if(e.key==="Escape")closeReader();
  else if(/^[1-4]$/.test(e.key)){const b=rEl.querySelector(`[data-ans="${+e.key-1}"]:not(:disabled)`);b&&b.click()}});
function swipe(card){
  if(!card)return;let x0=null,y0=0,dx=0,lock=false;
  card.addEventListener("pointerdown",e=>{if(e.target.closest("button,input,label"))return;x0=e.clientX;y0=e.clientY;dx=0;lock=false;card.classList.add("drag")});
  card.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;if(!lock&&Math.abs(e.clientY-y0)>Math.abs(dx)+4){x0=null;card.classList.remove("drag");card.style.transform="";return}if(Math.abs(dx)>8){lock=true;card.style.transform=`translateX(${dx}px) rotate(${dx/50}deg)`}});
  const end=()=>{if(x0===null)return;x0=null;card.classList.remove("drag");if(Math.abs(dx)>80&&!(dx>0&&R.i===0)){card.style.transform=`translateX(${dx>0?120:-120}%)`;card.style.opacity=0;setTimeout(()=>step(dx>0?-1:1),170)}else card.style.transform=""};
  card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
}

/* ---------- export a topic as a standalone page ---------- */
function packHTML(pk){
  const css=[...document.styleSheets[0].cssRules].map(r=>r.cssText).join("\n");
  const body=pk.lessons.map((l,li)=>`<section><p class="eyebrow">Lesson ${li+1}</p><h2 class="lt">${esc(l.title)}</h2><p class="muted">${esc(l.summary)}</p>
   ${l.cards.map(c=>`<article class="card xc" data-t="${pk.topic}"><span class="ctype">${esc(c.tag||TYPES[c.type])}</span><h2>${esc(c.title)}</h2>${(c.sketch||c.viz)?sketch(c):c.widget?`<div class="sk paper">${WSK[c.widget]}</div>`:""}${c.formula?`<div class="formula">${esc(c.formula)}</div>`:""}<div class="text">${fmt(c.text)}</div>${c.items?`<div class="text"><ul>${c.items.map(([en,pt,note,ex])=>`<li><b>${esc(en)}</b> = ${esc(pt)}${note?` <span class="muted">(${esc(note)})</span>`:""}${ex?`<br><em>${esc(ex)}</em>`:""}</li>`).join("")}</ul></div>`:""}${c.example?`<div class="ex"><span class="eyebrow">Worked example</span>${c.example.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}</article>`).join("")}
   ${(l.quiz||[]).length?`<article class="card xc" data-t="${pk.topic}"><span class="ctype">Quiz</span>${l.quiz.map((q,k)=>`<p><b>${k+1}. ${esc(q.q)}</b></p><ul>${q.options.map((o,j)=>`<li>${j===q.answer?"<b>✓ "+esc(o)+"</b>":esc(o)}</li>`).join("")}</ul><p class="muted sm">${esc(q.explain)}</p>`).join("")}</article>`:""}</section>`).join("");
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(pk.title)} · Spark</title><style>${css}
  body{padding:24px 16px} main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:28px} section{display:flex;flex-direction:column;gap:14px} .card.xc{height:auto;overflow:visible} .lt{font-size:26px}</style></head>
  <body>${document.querySelector('svg[aria-hidden]').outerHTML}<main><header data-t="${pk.topic}"><span class="tlabel"><span class="tdot"></span>${TOPICS[pk.topic]}</span><h1>${esc(pk.title)}</h1><p class="muted">${esc(pk.blurb)}</p></header>${body}</main></body></html>`;
}

/* ---------- utils ---------- */
let tt;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}
async function saveFile(name,text,type){
  const blob=new Blob([text],{type}),mobile=/iPhone|iPad|iPod|Android/.test(navigator.userAgent);
  try{const file=new File([blob],name,{type});if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(`Saved ${name}`);
}
let deferredInstall=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(view.tab==="you")render()});
addEventListener("online",()=>{if(!R)render()});addEventListener("offline",()=>{if(!R)render()});
(async()=>{
  try{await loadPacks()}catch(e){}
  if(navigator.onLine){const stale=CATALOG.filter(c=>PACKS[c.id]&&c.version>(PACKS[c.id].version||0)).map(c=>c.id);
    if(stale.length)(async()=>{for(const id of stale){try{await downloadPack(id)}catch(e){}}if(!R)render();toast(`${stale.length} topic${stale.length>1?"s":""} updated with new lessons`)})()}
  try{navigator.storage?.persist?.()}catch(e){}
  if("serviceWorker" in navigator&&(location.protocol==="https:"||["localhost","127.0.0.1"].includes(location.hostname)))navigator.serviceWorker.register("sw.js").catch(()=>{});
  render();
})();
