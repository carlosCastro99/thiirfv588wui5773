/* Layout: engineer's notebook. Phone-width shell (max 560px), graph-paper sketch panels, fixed bottom tab bar, full-screen lesson reader. Dark mode is a blueprint. */
[hidden]{display:none!important}
:root{
  --bg:#EDF1F6; --paper:#FBFCFE; --grid:#E0E7F1; --ink:#1B2433; --muted:#5E6A7D; --line:#D3DBE6;
  --pen:#1F5FD1; --pen-ink:#FFFFFF; --red:#D64533; --hl:rgba(255,206,40,.55); --ok:#138A5E; --flame:#E08A00;
  --t-elec:#B57E00; --t-tron:#12805C; --t-mech:#C2410C; --t-sci:#6D3FC4; --t-ai:#C0267A; --t-hist:#8A5A2B; --t-world:#00838F; --t-eng:#3F3FB5;
  --f-display:"Archivo","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1424; --paper:#0F2139; --grid:#183052; --ink:#E4ECF7; --muted:#93A4BD; --line:#22395A;
  --pen:#7DB3FF; --pen-ink:#0A1424; --red:#FF8B78; --hl:rgba(255,206,40,.28); --ok:#4FD39A; --flame:#F5B53A;
  --t-elec:#F2C14E; --t-tron:#5CD6A6; --t-mech:#FB8B5B; --t-sci:#B79BFF; --t-ai:#F78DC2; --t-hist:#E0AE78; --t-world:#4DD0E1; --t-eng:#A9A9FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1424; --paper:#0F2139; --grid:#183052; --ink:#E4ECF7; --muted:#93A4BD; --line:#22395A;
  --pen:#7DB3FF; --pen-ink:#0A1424; --red:#FF8B78; --hl:rgba(255,206,40,.28); --ok:#4FD39A; --flame:#F5B53A;
  --t-elec:#F2C14E; --t-tron:#5CD6A6; --t-mech:#FB8B5B; --t-sci:#B79BFF; --t-ai:#F78DC2; --t-hist:#E0AE78; --t-world:#4DD0E1; --t-eng:#A9A9FF; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:800}
h3{font-size:17px;font-weight:800}
p{margin:0}
.hand{font-family:var(--f-hand);font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.sm{font-size:13.5px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--pen);color:var(--pen-ink);font-weight:650}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:6px 13px;font-size:13.5px}
.btn.danger{background:var(--red);color:#fff}
.link{background:none;border:0;color:var(--pen);font-weight:650;padding:4px 0}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:650;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:var(--ok)} .pill.off{color:var(--red);border-color:var(--red)}
[data-t]{--topic:var(--pen)}
[data-t="elec"]{--topic:var(--t-elec)}[data-t="tron"]{--topic:var(--t-tron)}[data-t="mech"]{--topic:var(--t-mech)}[data-t="sci"]{--topic:var(--t-sci)}[data-t="ai"]{--topic:var(--t-ai)}[data-t="hist"]{--topic:var(--t-hist)}[data-t="world"]{--topic:var(--t-world)}[data-t="eng"]{--topic:var(--t-eng)}
.tlabel{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--topic)}
.tdot{width:8px;height:8px;border-radius:2px;background:var(--topic);flex:none;transform:rotate(45deg)}
.bar{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--topic)}

/* graph paper + sketches */
.paper{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;background-position:-1px -1px}
.sk{border-radius:14px;border:1px solid var(--line);overflow:hidden}
.sk svg{display:block;width:100%;height:auto;overflow:visible}
.sk .d{filter:url(#rough)}
.sk .s,.sk .a,.sk .r,.sk .dash,.sk .dashr{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sk .s{stroke:var(--ink)} .sk .a{stroke:var(--pen)} .sk .r{stroke:var(--red)}
.sk .dash{stroke:var(--muted);stroke-dasharray:5 5;stroke-width:1.6} .sk .dashr{stroke:var(--red);stroke-dasharray:6 5;stroke-width:1.8}
.sk .bgf{fill:var(--paper)} .sk .bgr{fill:var(--paper);stroke:none}
.sk .w{fill:var(--pen);opacity:.2} .sk .y{fill:var(--hl)} .sk .rz{fill:var(--red);opacity:.2}
.sk .fi{fill:var(--ink)} .sk .fpen{fill:var(--pen)} .sk .fred{fill:var(--red)}
.sk text{font-family:var(--f-hand);font-weight:600;font-size:19px;fill:var(--ink)}
.sk text[class]{stroke:none} .sk text.a{fill:var(--pen)} .sk text.r{fill:var(--red)} .sk text.tp{fill:var(--paper)} .sk text.mono{font-family:var(--f-mono);font-weight:500}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}
.ring{width:88px;height:88px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.ring .n small{display:block;font-family:var(--f-mono);font-size:9px;font-weight:500;color:var(--muted);margin-top:4px}
.flame{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--flame)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,24px));gap:4px;margin-top:10px}
.week span{height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;background:var(--bg);color:var(--muted)}
.week span.on{background:var(--flame);color:#1b1300}
.week span.today{outline:1.5px solid var(--ink)}
.cont{display:flex;flex-direction:column;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;padding:0;width:100%;color:var(--ink)}
.cont .sk{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.cont .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.rev{display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--red) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));border-radius:16px;padding:14px;width:100%;text-align:left;color:var(--ink)}
.rev b{font-family:var(--f-display);font-size:26px;color:var(--red);min-width:32px;text-align:center}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--topic);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink)}

/* learn */
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{border:0;background:transparent;flex:1;padding:12px 0;outline:none;min-width:0}
.pack{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pack .band{height:8px;background:var(--topic)}
.pack .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.facts{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--ok)}
.lesson{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%;color:var(--ink)}
.lesson .num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:26px;color:var(--topic);border:1.5px solid var(--topic)}
.lesson.done .num{background:var(--topic);color:var(--paper)}
.res{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;width:100%;color:var(--ink)}
.res .sk{border-radius:10px}
.res h3{font-size:15px}
.thumbph{aspect-ratio:16/9;border-radius:10px;display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:22px;color:var(--topic)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.scard .open{border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.scard .sk{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.scard .t{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px}
.scard h3{font-size:14px}
.scard .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:16px;line-height:1}

/* you */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.chart{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:90px;margin-top:12px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pen);border-radius:4px 4px 2px 2px;min-height:3px}
.bars i.zero{background:var(--line)}
.axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:650}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.hrow{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;color:var(--ink)}
.hrow .meta{flex:1;min-width:0}
.hrow h3{font-size:14.5px}
.note{background:color-mix(in srgb,var(--pen) 10%,var(--paper));border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--pen)}

/* reader */
.reader{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rtop{max-width:600px;width:100%;margin:0 auto;padding:10px 16px 8px;display:flex;flex-direction:column;gap:10px}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--topic)}
.prog i.q{background:color-mix(in srgb,var(--topic) 30%,var(--line))}
.prog i.q.on{background:var(--topic)}
.rstage{flex:1;display:flex;justify-content:center;padding:4px 16px;overflow:hidden;min-height:0}
.card{width:100%;max-width:560px;height:100%;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px 20px 24px;display:flex;flex-direction:column;gap:16px;touch-action:pan-y;transition:transform .25s ease,opacity .25s ease;overscroll-behavior:contain}
.card.drag{transition:none}
.card>*{flex-shrink:0}
.cont>*,.scard>*,.wg>*,.pack>*{flex-shrink:0}
.ctype{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:color-mix(in srgb,var(--topic) 14%,transparent);color:var(--topic);font-weight:600}
.card h2{font-size:25px;line-height:1.15}
.card .text{display:flex;flex-direction:column;gap:10px;font-size:16.5px;line-height:1.6}
.card .text ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.formula{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.01em;align-self:flex-start;padding:2px 10px;background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
.ex{border:1.5px dashed var(--topic);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ex .eyebrow{color:var(--topic);margin-bottom:4px}
.ex span{font-family:var(--f-hand);font-weight:600;font-size:22px;line-height:1.25}
.ex span:last-child{color:var(--red);font-size:26px}
.ractions{max-width:600px;width:100%;margin:0 auto;padding:12px 16px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ractions .mid{display:flex;gap:10px}
.saved{color:var(--flame);border-color:var(--flame)} .saved svg{fill:currentColor}
.card .text em{font-style:italic;font-weight:600;color:var(--topic)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7}
.lw{position:relative}
.lw .lesson{padding-right:56px}
.star{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--muted)}
.star svg{width:18px;height:18px}
.star.on{color:var(--flame);border-color:var(--flame)} .star.on svg{fill:currentColor}
.scard .x.on{color:var(--flame);border-color:var(--flame)}
.scard .x svg{width:15px;height:15px;fill:currentColor}
.fstrip{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scroll-snap-type:x mandatory}
.fstrip>*{flex:0 0 44%;scroll-snap-align:start}
.fstrip .scard .open{width:100%}
.ghead{display:flex;align-items:center;gap:8px;margin-top:6px}
.fc{width:100%;min-height:180px;border:1.5px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.fw{font-family:var(--f-hand);font-weight:700;font-size:40px;line-height:1;color:var(--topic)}
.fpt{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.25}
.fex{font-style:italic}
.fnav{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.nextbtn{min-width:120px;height:44px}
/* quiz */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;text-align:left;font-weight:600;color:var(--ink);width:100%}
.opt .k{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;flex:none}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--paper))}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:12px 14px;font-size:15px}
.fb.ok{background:color-mix(in srgb,var(--ok) 12%,var(--paper))} .fb.no{background:color-mix(in srgb,var(--red) 10%,var(--paper))}
.fb b{font-family:var(--f-hand);font-size:22px;display:block}
.finish{align-items:center;text-align:center;justify-content:center}
.finish .big{font-family:var(--f-hand);font-weight:700;font-size:84px;line-height:.9;color:var(--topic)}
/* widgets */
.wg{display:flex;flex-direction:column;gap:12px}
.ctl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.ctl label{font-weight:650;font-size:14px;min-width:24px}
.ctl output{font-family:var(--f-mono);font-size:13px;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:100%;accent-color:var(--pen)}
.readout{font-family:var(--f-hand);font-weight:600;font-size:24px;line-height:1.25}
.readout b{color:var(--red);font-weight:700}
.badge{align-self:flex-start;font-size:13px;font-weight:650;border-radius:999px;padding:4px 10px}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)} .badge.no{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.togs{display:flex;gap:8px;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:650;font-size:14px;cursor:pointer;background:var(--bg)}
.tog input{accent-color:var(--pen);width:16px;height:16px;margin:0}
.tog:has(input:checked){border-color:var(--pen);color:var(--pen)}
.gen{font-family:var(--f-hand);font-weight:600;font-size:23px;min-height:32px}
.gen b{color:var(--red)}
.cities{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;font-size:14.5px}
.cities .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cities .dn{font-size:12px;font-weight:650;border-radius:999px;padding:2px 9px}
.cities .dn.sun{background:var(--hl);color:var(--ink)} .cities .dn.moon{background:var(--ink);color:var(--paper)}
.cities .me{font-weight:700;color:var(--pen)}
/* sheet & toast */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:650;font-size:14px;z-index:80;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>

" height=\"40\" rx=\"6\"/></g><text class=\"\" x=\"75\" y=\"62\" text-anchor=\"middle\" style=\"font-size:15px\">if ears pointy…</text><text class=\"\" x=\"75\" y=\"84\" text-anchor=\"middle\" style=\"font-size:15px\">and whiskers…</text><text class=\"\" x=\"75\" y=\"106\" text-anchor=\"middle\" style=\"font-size:15px\">but not a fox…</text><text class=\"\" x=\"281\" y=\"86\" text-anchor=\"middle\" style=\"font-size:17px\">model</text><text class=\"a\" x=\"281\" y=\"128\" text-anchor=\"middle\" style=\"font-size:22px\">“cat!”</text><text class=\"r\" x=\"75\" y=\"158\" text-anchor=\"middle\" style=\"font-size:16px\">writing rules by hand</text><text class=\"a\" x=\"232\" y=\"158\" text-anchor=\"middle\" style=\"font-size:16px\">learning from examples</text></svg>"}, {"type": "concept", "title": "A neuron is a weighted vote", "text": "The building block of a neural network is tiny. It takes a few inputs, multiplies each by a weight (how much it matters), adds them up and says yes if the total is high enough.\n\nShould you go to the beach? Sunny counts +3, weekend +2, rain −4. Stack millions of these little votes in layers and you get a network that can recognise faces or write text.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M82 40L176 80\"/><path class=\"s\" d=\"M168 80.4L176 80L170.7 74\"/><path class=\"s\" d=\"M82 90L172 90\"/><path class=\"s\" d=\"M164.8 93.5L172 90L164.8 86.5\"/><path class=\"s\" d=\"M82 140L176 100\"/><path class=\"s\" d=\"M170.7 106L176 100L168 99.6\"/><circle class=\"s bgf\" cx=\"70\" cy=\"40\" r=\"10\"/><circle class=\"s bgf\" cx=\"70\" cy=\"90\" r=\"10\"/><circle class=\"s bgf\" cx=\"70\" cy=\"140\" r=\"10\"/><circle class=\"s bgf\" cx=\"200\" cy=\"90\" r=\"26\"/><path class=\"a\" d=\"M228 90L268 90\"/><path class=\"a\" d=\"M260.8 93.5L268 90L260.8 86.5\"/></g><text class=\"\" x=\"56\" y=\"46\" text-anchor=\"end\" style=\"font-size:16px\">sunny</text><text class=\"\" x=\"56\" y=\"96\" text-anchor=\"end\" style=\"font-size:16px\">weekend</text><text class=\"\" x=\"56\" y=\"146\" text-anchor=\"end\" style=\"font-size:16px\">rain</text><text class=\"a\" x=\"124\" y=\"52\" text-anchor=\"middle\" style=\"font-size:18px\">+3</text><text class=\"a\" x=\"124\" y=\"84\" text-anchor=\"middle\" style=\"font-size:18px\">+2</text><text class=\"r\" x=\"124\" y=\"138\" text-anchor=\"middle\" style=\"font-size:18px\">−4</text><text class=\"\" x=\"200\" y=\"99\" text-anchor=\"middle\" style=\"font-size:28px\">Σ</text><text class=\"a\" x=\"292\" y=\"96\" text-anchor=\"middle\" style=\"font-size:22px\">go?</text><text class=\"\" x=\"160\" y=\"174\" text-anchor=\"middle\" style=\"font-size:15px\">add up the votes: positive means yes</text></svg>"}, {"type": "widget", "widget": "neuron", "title": "Try it: be the neuron", "text": "Switch the inputs on and off. The neuron adds up input × weight, plus a small bias of −2 (it needs a reason to go), and fires when the total is above zero."}, {"type": "concept", "title": "Training means nudging", "text": "A new network starts with random weights and makes terrible guesses. Training repeats a simple loop: make a guess, measure how wrong it was, then nudge every weight a tiny bit in the direction that reduces the error.\n\nPicture a ball rolling downhill into the valley of lowest error. Large models repeat this billions of times.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M20 145L300 145\"/><path class=\"s\" d=\"M20 145L20 18\"/><path class=\"s\" d=\"M30 30 Q160 230 290 30\"/><circle class=\"fpen\" cx=\"56\" cy=\"57\" r=\"7\"/><circle class=\"fpen\" cx=\"95\" cy=\"96\" r=\"7\"/><path class=\"a\" d=\"M62 57L88 96\"/><path class=\"a\" d=\"M82.8 93L88 96L87.2 90.1\"/><circle class=\"fpen\" cx=\"134\" cy=\"117\" r=\"7\"/><path class=\"a\" d=\"M101 96L127 117\"/><path class=\"a\" d=\"M121.2 115.6L127 117L124.4 111.6\"/><circle class=\"fred\" cx=\"160\" cy=\"121\" r=\"7\"/><path class=\"a\" d=\"M140 117L153 121\"/><path class=\"a\" d=\"M147.1 121.9L153 121L148.6 116.9\"/></g><text class=\"r\" x=\"150\" y=\"40\" text-anchor=\"start\" style=\"font-size:16px\">first guess: very wrong</text><text class=\"a\" x=\"160\" y=\"166\" text-anchor=\"middle\" style=\"font-size:17px\">lowest error = best weights</text><text class=\"\" x=\"26\" y=\"16\" text-anchor=\"start\" style=\"font-size:15px\">error</text><text class=\"\" x=\"298\" y=\"162\" text-anchor=\"end\" style=\"font-size:15px\">weights</text></svg>"}, {"type": "fact", "title": "Memorising isn't learning", "text": "A model can fit its training examples perfectly and still be useless, like a student who memorised last year's exam answers. This is called overfitting.\n\nThe fix is to test on examples the model has never seen. If it does well there too, it has learned the real pattern rather than the noise.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"r\" d=\"M40 116 L70 128 L95 100 L125 116 L150 80 L180 100 L205 62 L235 86 L260 44 L285 62\"/><path class=\"a\" d=\"M30 136L292 44\"/><circle class=\"fi\" cx=\"40\" cy=\"128\" r=\"4\"/><circle class=\"fi\" cx=\"70\" cy=\"116\" r=\"4\"/><circle class=\"fi\" cx=\"95\" cy=\"112\" r=\"4\"/><circle class=\"fi\" cx=\"125\" cy=\"104\" r=\"4\"/><circle class=\"fi\" cx=\"150\" cy=\"92\" r=\"4\"/><circle class=\"fi\" cx=\"180\" cy=\"88\" r=\"4\"/><circle class=\"fi\" cx=\"205\" cy=\"74\" r=\"4\"/><circle class=\"fi\" cx=\"235\" cy=\"74\" r=\"4\"/><circle class=\"fi\" cx=\"260\" cy=\"56\" r=\"4\"/><circle class=\"fi\" cx=\"285\" cy=\"50\" r=\"4\"/></g><text class=\"r\" x=\"110\" y=\"58\" text-anchor=\"middle\" style=\"font-size:16px\">memorises every point</text><text class=\"a\" x=\"240\" y=\"118\" text-anchor=\"middle\" style=\"font-size:17px\">learns the trend</text><text class=\"\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:15px\">new data follows the blue line</text></svg>"}], "quiz": [{"q": "What does a machine-learning model learn from?", "options": ["Rules a programmer writes", "Lots of examples", "The internet's search results at runtime"], "answer": 1, "explain": "It finds patterns in example data. Nobody writes the rules by hand."}, {"q": "Sunny (+3) and raining (−4), not a weekend, bias −2. Does the beach neuron fire?", "options": ["Yes", "No"], "answer": 1, "explain": "3 − 4 − 2 = −3, which is below zero, so no."}, {"q": "A model scores 100% on its training data but badly on new data. That's…", "options": ["Overfitting", "Perfect training", "A small model"], "answer": 0, "explain": "It memorised the examples instead of the general pattern."}]}, {"id": "ai-chat", "title": "How chatbots work", "summary": "What's really going on inside ChatGPT, Claude and friends.", "cards": [{"type": "concept", "title": "Text becomes tokens", "text": "Language models don't read letters or whole words. Text is chopped into tokens: common words stay whole, rarer ones are split into pieces. Each token is just a number to the model.\n\nIn English a token averages about ¾ of a word, which is why AI services price and limit usage in tokens.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s bgf\" x=\"40\" y=\"64\" width=\"56\" height=\"34\" rx=\"4\"/><rect class=\"s bgf\" x=\"96\" y=\"64\" width=\"92\" height=\"34\" rx=\"4\"/><rect class=\"s bgf\" x=\"188\" y=\"64\" width=\"76\" height=\"34\" rx=\"4\"/><path class=\"a\" d=\"M68 102L68 124\"/><path class=\"a\" d=\"M65.4 118.6L68 124L70.6 118.6\"/><path class=\"a\" d=\"M142 102L142 124\"/><path class=\"a\" d=\"M139.4 118.6L142 124L144.6 118.6\"/><path class=\"a\" d=\"M226 102L226 124\"/><path class=\"a\" d=\"M223.4 118.6L226 124L228.6 118.6\"/></g><text class=\"\" x=\"160\" y=\"40\" text-anchor=\"middle\" style=\"font-size:30px\">unbelievable</text><text class=\"\" x=\"68\" y=\"87\" text-anchor=\"middle\" style=\"font-size:20px\">un</text><text class=\"\" x=\"142\" y=\"87\" text-anchor=\"middle\" style=\"font-size:20px\">believ</text><text class=\"\" x=\"226\" y=\"87\" text-anchor=\"middle\" style=\"font-size:20px\">able</text><text class=\"mono\" x=\"68\" y=\"146\" text-anchor=\"middle\" style=\"font-size:16px\">403</text><text class=\"mono\" x=\"142\" y=\"146\" text-anchor=\"middle\" style=\"font-size:16px\">11274</text><text class=\"mono\" x=\"226\" y=\"146\" text-anchor=\"middle\" style=\"font-size:16px\">481</text><text class=\"\" x=\"160\" y=\"174\" text-anchor=\"middle\" style=\"font-size:14px\">token numbers are made up for this example</text></svg>"}, {"type": "concept", "title": "It predicts the next word", "text": "At heart, a language model does one thing: given the text so far, it estimates how likely each possible next token is. It picks one, adds it to the text and repeats.\n\nTrained on a huge amount of writing, that simple trick ends up capturing grammar, facts, styles and a surprising amount of reasoning.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"fred\" x=\"80\" y=\"49\" width=\"179.8\" height=\"17\" rx=\"3\"/><rect class=\"fpen\" x=\"80\" y=\"75\" width=\"40.6\" height=\"17\" rx=\"3\"/><rect class=\"fpen\" x=\"80\" y=\"101\" width=\"26.1\" height=\"17\" rx=\"3\"/><rect class=\"fpen\" x=\"80\" y=\"127\" width=\"8.7\" height=\"17\" rx=\"3\"/></g><text class=\"\" x=\"20\" y=\"30\" text-anchor=\"start\" style=\"font-size:21px\">“The cat sat on the …”</text><text class=\"\" x=\"72\" y=\"62\" text-anchor=\"end\" style=\"font-size:17px\">mat</text><text class=\"\" x=\"265.8\" y=\"62\" text-anchor=\"start\" style=\"font-size:16px\">62%</text><text class=\"\" x=\"72\" y=\"88\" text-anchor=\"end\" style=\"font-size:17px\">sofa</text><text class=\"\" x=\"126.6\" y=\"88\" text-anchor=\"start\" style=\"font-size:16px\">14%</text><text class=\"\" x=\"72\" y=\"114\" text-anchor=\"end\" style=\"font-size:17px\">floor</text><text class=\"\" x=\"112.1\" y=\"114\" text-anchor=\"start\" style=\"font-size:16px\">9%</text><text class=\"\" x=\"72\" y=\"140\" text-anchor=\"end\" style=\"font-size:17px\">roof</text><text class=\"\" x=\"94.7\" y=\"140\" text-anchor=\"start\" style=\"font-size:16px\">3%</text><text class=\"\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:15px\">it picks from these odds, one word at a time</text></svg>"}, {"type": "widget", "widget": "nextword", "title": "Try it: turn up the temperature", "text": "Temperature controls how adventurous the model is. Low temperature almost always picks the top word; high temperature spreads the odds so rarer words get a chance. Press Generate a few times at each setting."}, {"type": "concept", "title": "Meaning as a map", "text": "Inside the model, every token becomes a list of numbers called an embedding, like coordinates on a map of meaning. Similar ideas sit close together: cat near dog, Lisbon near Porto.\n\nDirections carry meaning too. The step from 'man' to 'woman' is roughly the same as from 'king' to 'queen'.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"a\" d=\"M60 132L186 122\"/><path class=\"a\" d=\"M179.1 126L186 122L178.5 119.1\"/><path class=\"a\" d=\"M60 72L186 62\"/><path class=\"a\" d=\"M179.1 66L186 62L178.5 59.1\"/><path class=\"r\" d=\"M60 132L60 78\"/><path class=\"r\" d=\"M63.5 85.2L60 78L56.5 85.2\"/><path class=\"r\" d=\"M190 122L190 68\"/><path class=\"r\" d=\"M193.5 75.2L190 68L186.5 75.2\"/><circle class=\"fi\" cx=\"60\" cy=\"132\" r=\"4\"/><circle class=\"fi\" cx=\"60\" cy=\"72\" r=\"4\"/><circle class=\"fi\" cx=\"190\" cy=\"122\" r=\"4\"/><circle class=\"fi\" cx=\"190\" cy=\"62\" r=\"4\"/><circle class=\"fi\" cx=\"262\" cy=\"140\" r=\"4\"/><circle class=\"fi\" cx=\"290\" cy=\"128\" r=\"4\"/><circle class=\"fi\" cx=\"296\" cy=\"150\" r=\"4\"/></g><text class=\"\" x=\"52\" y=\"150\" text-anchor=\"middle\" style=\"font-size:16px\">man</text><text class=\"\" x=\"52\" y=\"62\" text-anchor=\"middle\" style=\"font-size:16px\">woman</text><text class=\"\" x=\"200\" y=\"140\" text-anchor=\"middle\" style=\"font-size:16px\">king</text><text class=\"\" x=\"206\" y=\"54\" text-anchor=\"middle\" style=\"font-size:16px\">queen</text><text class=\"\" x=\"260\" y=\"158\" text-anchor=\"middle\" style=\"font-size:15px\">cat</text><text class=\"\" x=\"292\" y=\"120\" text-anchor=\"middle\" style=\"font-size:15px\">dog</text><text class=\"\" x=\"300\" y=\"170\" text-anchor=\"end\" style=\"font-size:14px\">puppy</text><text class=\"a\" x=\"18\" y=\"24\" text-anchor=\"start\" style=\"font-size:18px\">king − man + woman ≈ queen</text></svg>"}, {"type": "fact", "title": "Fluent isn't the same as true", "text": "Because a model predicts plausible text, it can produce confident sentences that are simply wrong. People call this hallucination. It's most likely with exact numbers, dates, quotes and niche facts.\n\nUse AI for drafting, explaining and brainstorming, and check anything important against a reliable source. (The Eiffel Tower was finished in 1889.)", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s bgf\" x=\"24\" y=\"26\" width=\"210\" height=\"72\" rx=\"14\"/><path class=\"s bgf\" d=\"M70 98 L58 124 L102 98\"/><path class=\"bgf\" d=\"M71 98L101 98\"/><circle class=\"s bgf\" cx=\"264\" cy=\"112\" r=\"24\"/><path class=\"s\" d=\"M281 129L304 152\"/></g><text class=\"\" x=\"129\" y=\"56\" text-anchor=\"middle\" style=\"font-size:17px\">The Eiffel Tower was</text><text class=\"r\" x=\"129\" y=\"80\" text-anchor=\"middle\" style=\"font-size:17px\">finished in 1901.</text><text class=\"r\" x=\"264\" y=\"121\" text-anchor=\"middle\" style=\"font-size:30px\">?</text><text class=\"\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:15px\">sounds sure, still wrong: check key facts</text></svg>"}], "quiz": [{"q": "What does a language model actually do at each step?", "options": ["Looks the answer up in a database", "Predicts the most likely next token", "Copies a matching web page"], "answer": 1, "explain": "It estimates probabilities for the next token, picks one, and repeats."}, {"q": "Roughly how many English words fit in 1,000 tokens?", "options": ["About 250", "About 750", "About 4,000"], "answer": 1, "explain": "A token averages about ¾ of a word in English."}, {"q": "You want consistent, predictable answers. Which temperature?", "options": ["Low", "High"], "answer": 0, "explain": "Low temperature concentrates the odds on the most likely tokens."}]}]}, "english": {"id": "english", "topic": "eng", "title": "English", "version": 1, "blurb": "Gramática e vocabulário em inglês, explicados em português.", "lessons": [{"id": "en-tenses", "title": "Tempos verbais sem confusão", "summary": "Os quatro pares de tempos que mais baralham quem fala português.", "cards": [{"type": "concept", "tag": "Regra", "title": "Present simple ou present continuous?", "text": "Usa o *present simple* para hábitos, rotinas e verdades gerais: *I work in Porto.* (Trabalho no Porto.)\n\nUsa o *present continuous* (am/is/are + -ing) para o que está a acontecer agora ou é temporário: *I'm working from home this week.* (Esta semana estou a trabalhar em casa.)\n\nTruque: se em português dirias \"estou a…\", em inglês é quase sempre o continuous.", "say": "I work in Porto. I'm working from home this week.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><circle class=\"fpen\" cx=\"34\" cy=\"66\" r=\"4.5\"/><circle class=\"fpen\" cx=\"60\" cy=\"66\" r=\"4.5\"/><circle class=\"fpen\" cx=\"86\" cy=\"66\" r=\"4.5\"/><circle class=\"fpen\" cx=\"112\" cy=\"66\" r=\"4.5\"/><circle class=\"fpen\" cx=\"138\" cy=\"66\" r=\"4.5\"/><circle class=\"fpen\" cx=\"164\" cy=\"66\" r=\"4.5\"/><circle class=\"fpen\" cx=\"190\" cy=\"66\" r=\"4.5\"/><circle class=\"fpen\" cx=\"216\" cy=\"66\" r=\"4.5\"/><circle class=\"fpen\" cx=\"242\" cy=\"66\" r=\"4.5\"/><circle class=\"fpen\" cx=\"268\" cy=\"66\" r=\"4.5\"/><circle class=\"fpen\" cx=\"294\" cy=\"66\" r=\"4.5\"/><path class=\"a\" d=\"M20 110L304 110\"/><path class=\"a\" d=\"M296.8 113.5L304 110L296.8 106.5\"/><rect class=\"y\" x=\"166\" y=\"98\" width=\"76\" height=\"24\" rx=\"4\" transform=\"rotate(-1.2 166 98)\"/><path class=\"r\" d=\"M204 96L204 124\"/></g><text class=\"a\" x=\"20\" y=\"40\" text-anchor=\"start\" style=\"font-size:17px\">hábito: I work in Porto.</text><text class=\"r\" x=\"204\" y=\"144\" text-anchor=\"middle\" style=\"font-size:16px\">agora</text><text class=\"r\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:16px\">temporário: I'm working from home.</text></svg>"}, {"type": "concept", "tag": "Regra", "title": "Past simple ou present perfect?", "text": "O *past simple* fala de um momento terminado e definido: *I visited London in 2019.*\n\nO *present perfect* (have/has + particípio) liga o passado ao presente, sem dizer quando: *I have visited London twice.* (Já visitei Londres duas vezes.)\n\nErro típico: *I have seen him yesterday* ✗. Com yesterday, last week, in 2019 ou ago, usa sempre o past simple: *I saw him yesterday* ✓.", "say": "I visited London in 2019. I have visited London twice. I saw him yesterday.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"a\" d=\"M20 62L304 62\"/><path class=\"a\" d=\"M296.8 65.5L304 62L296.8 58.5\"/><circle class=\"fred\" cx=\"96\" cy=\"62\" r=\"6\"/><path class=\"r\" d=\"M96 50L96 74\"/><path class=\"a\" d=\"M20 140L304 140\"/><path class=\"a\" d=\"M296.8 143.5L304 140L296.8 136.5\"/><circle class=\"fpen\" cx=\"70\" cy=\"140\" r=\"5\"/><circle class=\"fpen\" cx=\"140\" cy=\"140\" r=\"5\"/><path class=\"r\" d=\"M276 128L276 152\"/><path class=\"a\" d=\"M140 136 Q208 92 272 132\"/><path class=\"a\" d=\"M258 120L272 132\"/><path class=\"a\" d=\"M265.2 130.2L272 132L269.2 125.6\"/></g><text class=\"r\" x=\"20\" y=\"30\" text-anchor=\"start\" style=\"font-size:16px\">past simple: in 2019 (terminado)</text><text class=\"r\" x=\"96\" y=\"92\" text-anchor=\"middle\" style=\"font-size:16px\">2019</text><text class=\"a\" x=\"20\" y=\"112\" text-anchor=\"start\" style=\"font-size:16px\">present perfect: até agora</text><text class=\"r\" x=\"276\" y=\"170\" text-anchor=\"middle\" style=\"font-size:15px\">agora</text><text class=\"\" x=\"105\" y=\"166\" text-anchor=\"middle\" style=\"font-size:14px\">quando? não importa</text></svg>"}, {"type": "formula", "tag": "Regra", "title": "For ou since?", "formula": "for + duração · since + início", "text": "Os dois traduzem o nosso \"há\" ou \"desde\" quando falamos de algo que ainda continua. Usa *for* com quanto tempo dura; usa *since* com o momento em que começou. Ambos pedem o present perfect.", "example": ["Moro aqui há 10 anos.", "I have lived here for 10 years.", "= I have lived here since 2016."], "say": "I have lived here for ten years. I have lived here since 2016.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"a\" d=\"M20 96L304 96\"/><path class=\"a\" d=\"M296.8 99.5L304 96L296.8 92.5\"/><path class=\"r\" d=\"M72 82L72 110\"/><path class=\"s\" d=\"M276 82L276 110\"/><path class=\"a\" d=\"M72 128L276 128\"/><path class=\"a\" d=\"M72 120L72 136\"/><path class=\"a\" d=\"M276 120L276 136\"/></g><text class=\"\" x=\"160\" y=\"30\" text-anchor=\"middle\" style=\"font-size:19px\">I have lived here…</text><text class=\"r\" x=\"72\" y=\"72\" text-anchor=\"middle\" style=\"font-size:17px\">since 2016</text><text class=\"\" x=\"276\" y=\"72\" text-anchor=\"middle\" style=\"font-size:16px\">agora</text><text class=\"a\" x=\"174\" y=\"156\" text-anchor=\"middle\" style=\"font-size:18px\">for 10 years</text></svg>"}, {"type": "concept", "tag": "Regra", "title": "Will ou going to?", "text": "*Going to* é para planos já decididos ou quando há um sinal à vista: *I'm going to fly to London on Friday.* *Look at those clouds, it's going to rain.*\n\n*Will* é para decisões tomadas no momento, promessas e previsões gerais: *The phone's ringing. I'll get it!* *I'll call you later.*", "say": "I'm going to fly to London on Friday. The phone's ringing. I'll get it!", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s bgf\" x=\"36\" y=\"46\" width=\"96\" height=\"82\" rx=\"6\"/><rect class=\"w\" x=\"36\" y=\"46\" width=\"96\" height=\"20\" rx=\"0\"/><path class=\"s\" d=\"M58 38L58 54\"/><path class=\"s\" d=\"M110 38L110 54\"/><path class=\"a\" d=\"M62 98 L78 112 L108 80\"/><circle class=\"s bgf\" cx=\"236\" cy=\"80\" r=\"28\"/><rect class=\"s bgf\" x=\"224\" y=\"108\" width=\"24\" height=\"16\" rx=\"3\"/><path class=\"r\" d=\"M226 92 L231 78 L236 92 L241 78 L246 92\"/><path class=\"r\" d=\"M236 36L236 44\"/><path class=\"r\" d=\"M270 56L278 50\"/><path class=\"r\" d=\"M202 56L194 50\"/></g><text class=\"a\" x=\"84\" y=\"150\" text-anchor=\"middle\" style=\"font-size:18px\">plano: going to</text><text class=\"r\" x=\"236\" y=\"150\" text-anchor=\"middle\" style=\"font-size:18px\">agora mesmo: will</text></svg>"}], "quiz": [{"q": "I ___ him yesterday.", "options": ["have seen", "saw", "see"], "answer": 1, "explain": "Com yesterday (momento terminado e definido) usa-se o past simple: I saw him yesterday."}, {"q": "She has worked here ___ 2020.", "options": ["for", "since", "during"], "answer": 1, "explain": "2020 é o ponto de partida, por isso since. Com uma duração seria for (for six years)."}, {"q": "Look at the sky! It ___ rain.", "options": ["will", "is going to", "rains"], "answer": 1, "explain": "Há um sinal visível agora (as nuvens), por isso going to."}, {"q": "Right now I ___ an email.", "options": ["write", "am writing", "wrote"], "answer": 1, "explain": "Está a acontecer neste momento: present continuous (am writing)."}]}, {"id": "en-false", "title": "Falsos amigos", "summary": "Palavras que parecem portuguesas mas querem dizer outra coisa.", "cards": [{"type": "concept", "tag": "Vocabulário", "title": "Parece, mas não é", "text": "Os falsos amigos são palavras inglesas parecidas com palavras portuguesas, mas com outro significado. São a fonte de muitos erros de quem fala bem inglês.\n\n*Actually* não é \"atualmente\" (isso é *currently*). *Pretend* não é \"pretender\" (isso é *intend*). E numa porta, *push* quer dizer empurrar, não puxar.", "say": "Actually, I currently live in Portugal. Push the door.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"dash\" d=\"M16 34L304 34\"/><path class=\"r\" d=\"M116 54.6L191.4 54.6\"/><path class=\"r\" d=\"M116 86.6L184.3 86.6\"/><path class=\"r\" d=\"M116 118.6L155.7 118.6\"/><path class=\"r\" d=\"M116 150.6L177.1 150.6\"/></g><text class=\"a\" x=\"16\" y=\"26\" text-anchor=\"start\" style=\"font-size:15px\">English</text><text class=\"r\" x=\"118\" y=\"26\" text-anchor=\"start\" style=\"font-size:15px\">parece…</text><text class=\"\" x=\"222\" y=\"26\" text-anchor=\"start\" style=\"font-size:15px\">significa</text><text class=\"a\" x=\"16\" y=\"60\" text-anchor=\"start\" style=\"font-size:19px\">actually</text><text class=\"\" x=\"118\" y=\"60\" text-anchor=\"start\" style=\"font-size:17px\">atualmente</text><text class=\"\" x=\"222\" y=\"60\" text-anchor=\"start\" style=\"font-size:19px\">na verdade</text><text class=\"a\" x=\"16\" y=\"92\" text-anchor=\"start\" style=\"font-size:19px\">pretend</text><text class=\"\" x=\"118\" y=\"92\" text-anchor=\"start\" style=\"font-size:17px\">pretender</text><text class=\"\" x=\"222\" y=\"92\" text-anchor=\"start\" style=\"font-size:19px\">fingir</text><text class=\"a\" x=\"16\" y=\"124\" text-anchor=\"start\" style=\"font-size:19px\">push</text><text class=\"\" x=\"118\" y=\"124\" text-anchor=\"start\" style=\"font-size:17px\">puxar</text><text class=\"\" x=\"222\" y=\"124\" text-anchor=\"start\" style=\"font-size:19px\">empurrar</text><text class=\"a\" x=\"16\" y=\"156\" text-anchor=\"start\" style=\"font-size:19px\">library</text><text class=\"\" x=\"118\" y=\"156\" text-anchor=\"start\" style=\"font-size:17px\">livraria</text><text class=\"\" x=\"222\" y=\"156\" text-anchor=\"start\" style=\"font-size:19px\">biblioteca</text></svg>"}, {"type": "concept", "tag": "Vocabulário", "title": "Mais quatro armadilhas", "text": "• *exquisite* = requintado (esquisito é *weird* ou *picky*)\n• *assist* = ajudar (assistir a uma reunião é *attend*; ver um jogo é *watch*)\n• *eventually* = por fim, finalmente (eventualmente é *possibly*)\n• *parents* = pai e mãe (os parentes são *relatives*)\n\nExemplo: *I'll attend the meeting* = vou assistir à reunião.", "say": "I'll attend the meeting. The flight eventually took off.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"dash\" d=\"M16 34L304 34\"/><path class=\"r\" d=\"M116 54.6L184.3 54.6\"/><path class=\"r\" d=\"M116 86.6L177.1 86.6\"/><path class=\"r\" d=\"M116 118.6L212.8 118.6\"/><path class=\"r\" d=\"M116 150.6L177.1 150.6\"/></g><text class=\"a\" x=\"16\" y=\"26\" text-anchor=\"start\" style=\"font-size:15px\">English</text><text class=\"r\" x=\"118\" y=\"26\" text-anchor=\"start\" style=\"font-size:15px\">parece…</text><text class=\"\" x=\"222\" y=\"26\" text-anchor=\"start\" style=\"font-size:15px\">significa</text><text class=\"a\" x=\"16\" y=\"60\" text-anchor=\"start\" style=\"font-size:19px\">exquisite</text><text class=\"\" x=\"118\" y=\"60\" text-anchor=\"start\" style=\"font-size:17px\">esquisito</text><text class=\"\" x=\"222\" y=\"60\" text-anchor=\"start\" style=\"font-size:19px\">requintado</text><text class=\"a\" x=\"16\" y=\"92\" text-anchor=\"start\" style=\"font-size:19px\">assist</text><text class=\"\" x=\"118\" y=\"92\" text-anchor=\"start\" style=\"font-size:17px\">assistir</text><text class=\"\" x=\"222\" y=\"92\" text-anchor=\"start\" style=\"font-size:19px\">ajudar</text><text class=\"a\" x=\"16\" y=\"124\" text-anchor=\"start\" style=\"font-size:19px\">eventually</text><text class=\"\" x=\"118\" y=\"124\" text-anchor=\"start\" style=\"font-size:17px\">eventualmente</text><text class=\"\" x=\"222\" y=\"124\" text-anchor=\"start\" style=\"font-size:19px\">por fim</text><text class=\"a\" x=\"16\" y=\"156\" text-anchor=\"start\" style=\"font-size:19px\">parents</text><text class=\"\" x=\"118\" y=\"156\" text-anchor=\"start\" style=\"font-size:17px\">parentes</text><text class=\"\" x=\"222\" y=\"156\" text-anchor=\"start\" style=\"font-size:19px\">pais</text></svg>"}, {"type": "widget", "widget": "flip", "tag": "Treina", "title": "Treina: 12 falsos amigos", "text": "Lê a palavra em inglês, tenta lembrar-te do significado e toca no cartão para confirmar. Usa Ouvir para treinar a pronúncia.", "items": [["actually", "na verdade, de facto", "atualmente = currently", "Actually, I've never been to Paris."], ["pretend", "fingir", "pretender = to intend", "He pretended to be asleep."], ["push", "empurrar", "puxar = pull", "Push the door to open it."], ["library", "biblioteca", "livraria = bookshop", "I borrowed this book from the library."], ["exquisite", "requintado, delicado", "esquisito = weird, picky", "What an exquisite dinner!"], ["assist", "ajudar", "assistir a = attend, watch", "Can I assist you with your bags?"], ["eventually", "finalmente, por fim", "eventualmente = possibly", "The flight eventually took off at ten."], ["parents", "pais (mãe e pai)", "parentes = relatives", "My parents live in Viana."], ["realize", "perceber, dar-se conta", "realizar = carry out, achieve", "I didn't realize it was so late."], ["constipated", "com prisão de ventre", "constipado = I have a cold", "I can't come, I have a cold."], ["sympathetic", "compreensivo, solidário", "simpático = nice, friendly", "She was very sympathetic when I was ill."], ["fabric", "tecido", "fábrica = factory", "This fabric is made of cotton."]], "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s bgf\" x=\"52\" y=\"30\" width=\"180\" height=\"108\" rx=\"12\"/><rect class=\"s bgf\" x=\"88\" y=\"48\" width=\"180\" height=\"108\" rx=\"12\"/></g><text class=\"a\" x=\"178\" y=\"98\" text-anchor=\"middle\" style=\"font-size:30px\">actually</text><text class=\"r\" x=\"178\" y=\"132\" text-anchor=\"middle\" style=\"font-size:19px\">→ na verdade</text></svg>"}, {"type": "concept", "tag": "Vocabulário", "title": "Sensible, sensitive, sympathetic", "text": "Três palavras que enganam quase toda a gente:\n• *sensible* = sensato, com bom senso: *a sensible decision*\n• *sensitive* = sensível: *sensitive skin*, *a sensitive topic*\n• *sympathetic* = compreensivo, solidário. Para \"simpático\" diz *nice* ou *friendly*.", "say": "That's a sensible decision. I have sensitive skin. Our neighbours are very friendly.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"dash\" d=\"M16 34L304 34\"/><path class=\"r\" d=\"M116 54.6L177.1 54.6\"/><path class=\"r\" d=\"M116 118.6L184.3 118.6\"/></g><text class=\"a\" x=\"16\" y=\"26\" text-anchor=\"start\" style=\"font-size:15px\">English</text><text class=\"r\" x=\"118\" y=\"26\" text-anchor=\"start\" style=\"font-size:15px\">parece…</text><text class=\"\" x=\"222\" y=\"26\" text-anchor=\"start\" style=\"font-size:15px\">significa</text><text class=\"a\" x=\"16\" y=\"60\" text-anchor=\"start\" style=\"font-size:19px\">sensible</text><text class=\"\" x=\"118\" y=\"60\" text-anchor=\"start\" style=\"font-size:17px\">sensível</text><text class=\"\" x=\"222\" y=\"60\" text-anchor=\"start\" style=\"font-size:19px\">sensato</text><text class=\"a\" x=\"16\" y=\"92\" text-anchor=\"start\" style=\"font-size:19px\">sensitive</text><text class=\"\" x=\"118\" y=\"92\" text-anchor=\"start\" style=\"font-size:17px\">—</text><text class=\"\" x=\"222\" y=\"92\" text-anchor=\"start\" style=\"font-size:19px\">sensível</text><text class=\"a\" x=\"16\" y=\"124\" text-anchor=\"start\" style=\"font-size:19px\">sympathetic</text><text class=\"\" x=\"118\" y=\"124\" text-anchor=\"start\" style=\"font-size:17px\">simpático</text><text class=\"\" x=\"222\" y=\"124\" text-anchor=\"start\" style=\"font-size:19px\">compreensivo</text><text class=\"a\" x=\"16\" y=\"156\" text-anchor=\"start\" style=\"font-size:19px\">nice, friendly</text><text class=\"\" x=\"118\" y=\"156\" text-anchor=\"start\" style=\"font-size:17px\">—</text><text class=\"\" x=\"222\" y=\"156\" text-anchor=\"start\" style=\"font-size:19px\">simpático</text></svg>"}], "quiz": [{"q": "\"Eventually\" significa…", "options": ["eventualmente", "por fim, finalmente", "frequentemente"], "answer": 1, "explain": "Eventually = por fim. Para \"eventualmente\" diz possibly ou perhaps."}, {"q": "Que palavra quer dizer \"atualmente\"?", "options": ["actually", "currently", "eventually"], "answer": 1, "explain": "Currently = atualmente. Actually = na verdade."}, {"q": "Uma porta diz PULL. Deves…", "options": ["empurrar", "puxar"], "answer": 1, "explain": "Pull = puxar. Push = empurrar."}, {"q": "\"My manager is very sympathetic\" quer dizer que é…", "options": ["muito simpático", "compreensivo, solidário", "muito sensível"], "answer": 1, "explain": "Sympathetic = compreensivo. Simpático diz-se nice ou friendly."}]}, {"id": "en-prep", "title": "Preposições e verbos do dia a dia", "summary": "in, on, at; make ou do; phrasal verbs e os erros mais comuns.", "cards": [{"type": "concept", "tag": "Regra", "title": "In, on, at no tempo", "text": "Pensa num funil, do mais largo para o mais preciso:\n• *in* para períodos longos: meses, anos, estações e partes do dia (*in May*, *in 2026*, *in the morning*)\n• *on* para dias e datas: *on Monday*, *on 25 April*\n• *at* para horas e momentos exatos: *at 9:00*, *at night*, *at the weekend* (inglês britânico)", "say": "In May. On Monday. At nine o'clock.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s bgf\" x=\"20\" y=\"22\" width=\"280\" height=\"42\" rx=\"6\"/><rect class=\"s bgf\" x=\"60\" y=\"72\" width=\"200\" height=\"42\" rx=\"6\"/><rect class=\"s bgf\" x=\"100\" y=\"122\" width=\"120\" height=\"42\" rx=\"6\"/></g><text class=\"r\" x=\"36\" y=\"50\" text-anchor=\"start\" style=\"font-size:24px\">in</text><text class=\"\" x=\"176\" y=\"49\" text-anchor=\"middle\" style=\"font-size:16px\">May · 2026 · the morning</text><text class=\"r\" x=\"74\" y=\"100\" text-anchor=\"start\" style=\"font-size:24px\">on</text><text class=\"\" x=\"176\" y=\"99\" text-anchor=\"middle\" style=\"font-size:16px\">Monday · 25 April</text><text class=\"r\" x=\"110\" y=\"150\" text-anchor=\"start\" style=\"font-size:24px\">at</text><text class=\"\" x=\"172\" y=\"149\" text-anchor=\"middle\" style=\"font-size:16px\">9:00 · night</text></svg>"}, {"type": "concept", "tag": "Regra", "title": "In, on, at no espaço", "text": "• *in* = dentro de um espaço fechado ou de uma área: *in the box*, *in the car*, *in Lisbon*\n• *on* = em cima de uma superfície: *on the table*, *on the wall*, *on the second floor*\n• *at* = num ponto ou local concreto: *at the door*, *at the airport*, *at work*", "say": "The keys are in the box. The cup is on the table. I'm at the airport.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M28 62 V132 H102 V62\"/><circle class=\"fpen\" cx=\"65\" cy=\"114\" r=\"14\"/><path class=\"s\" d=\"M124 112L196 112\"/><path class=\"s\" d=\"M134 112L134 140\"/><path class=\"s\" d=\"M186 112L186 140\"/><circle class=\"fpen\" cx=\"160\" cy=\"97\" r=\"14\"/><rect class=\"s bgf\" x=\"252\" y=\"54\" width=\"42\" height=\"86\" rx=\"2\"/><circle class=\"fi\" cx=\"284\" cy=\"100\" r=\"3\"/><circle class=\"fpen\" cx=\"232\" cy=\"126\" r=\"13\"/><path class=\"s\" d=\"M214 140L304 140\"/></g><text class=\"r\" x=\"65\" y=\"40\" text-anchor=\"middle\" style=\"font-size:26px\">in</text><text class=\"r\" x=\"160\" y=\"40\" text-anchor=\"middle\" style=\"font-size:26px\">on</text><text class=\"r\" x=\"262\" y=\"40\" text-anchor=\"middle\" style=\"font-size:26px\">at</text><text class=\"\" x=\"65\" y=\"166\" text-anchor=\"middle\" style=\"font-size:15px\">in the box</text><text class=\"\" x=\"160\" y=\"166\" text-anchor=\"middle\" style=\"font-size:15px\">on the table</text><text class=\"\" x=\"262\" y=\"166\" text-anchor=\"middle\" style=\"font-size:15px\">at the door</text></svg>"}, {"type": "concept", "tag": "Vocabulário", "title": "Make ou do?", "text": "Os dois traduzem \"fazer\".\n• *make* = criar ou produzir alguma coisa: *make a decision*, *make a mistake*, *make money*, *make a cake*\n• *do* = tarefas, atividades e trabalho: *do homework*, *do the dishes*, *do business*, *do your best*\n\nNão há uma regra perfeita: o melhor é aprender as combinações.", "say": "Make a decision. Make a mistake. Do your homework. Do your best.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"dash\" d=\"M160 24L160 172\"/></g><text class=\"r\" x=\"80\" y=\"40\" text-anchor=\"middle\" style=\"font-size:26px\">MAKE</text><text class=\"\" x=\"80\" y=\"60\" text-anchor=\"middle\" style=\"font-size:14px\">criar · produzir</text><text class=\"\" x=\"80\" y=\"88\" text-anchor=\"middle\" style=\"font-size:17px\">a decision</text><text class=\"\" x=\"80\" y=\"110\" text-anchor=\"middle\" style=\"font-size:17px\">a mistake</text><text class=\"\" x=\"80\" y=\"132\" text-anchor=\"middle\" style=\"font-size:17px\">money</text><text class=\"\" x=\"80\" y=\"154\" text-anchor=\"middle\" style=\"font-size:17px\">a cake</text><text class=\"a\" x=\"240\" y=\"40\" text-anchor=\"middle\" style=\"font-size:26px\">DO</text><text class=\"\" x=\"240\" y=\"60\" text-anchor=\"middle\" style=\"font-size:14px\">tarefas · atividades</text><text class=\"\" x=\"240\" y=\"88\" text-anchor=\"middle\" style=\"font-size:17px\">homework</text><text class=\"\" x=\"240\" y=\"110\" text-anchor=\"middle\" style=\"font-size:17px\">the dishes</text><text class=\"\" x=\"240\" y=\"132\" text-anchor=\"middle\" style=\"font-size:17px\">business</text><text class=\"\" x=\"240\" y=\"154\" text-anchor=\"middle\" style=\"font-size:17px\">your best</text></svg>"}, {"type": "widget", "widget": "flip", "tag": "Treina", "title": "Treina: 10 phrasal verbs", "text": "Phrasal verbs são verbos com uma partícula (up, out, after…) que muda o significado. São muito usados no dia a dia e nas reuniões. Toca no cartão para ver a tradução.", "items": [["look up", "procurar (num dicionário, na internet)", "", "Look it up online."], ["look after", "tomar conta de, cuidar de", "", "Can you look after the kids tonight?"], ["look forward to", "estar ansioso por (coisa boa)", "segue-se -ing", "I'm looking forward to seeing you."], ["give up", "desistir; deixar de", "", "Don't give up now!"], ["run out of", "ficar sem", "", "We've run out of coffee."], ["figure out", "perceber, descobrir como", "", "I can't figure out this app."], ["find out", "descobrir (uma informação)", "", "Let me find out when the train leaves."], ["carry on", "continuar", "", "Carry on, I'm listening."], ["turn down", "recusar; baixar (o volume)", "", "She turned down the job offer."], ["set up", "montar, configurar", "", "I set up a new server at home."]], "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s bgf\" x=\"52\" y=\"30\" width=\"180\" height=\"108\" rx=\"12\"/><rect class=\"s bgf\" x=\"88\" y=\"48\" width=\"180\" height=\"108\" rx=\"12\"/></g><text class=\"a\" x=\"178\" y=\"98\" text-anchor=\"middle\" style=\"font-size:30px\">give up</text><text class=\"r\" x=\"178\" y=\"132\" text-anchor=\"middle\" style=\"font-size:19px\">→ desistir</text></svg>"}, {"type": "fact", "tag": "Erros comuns", "title": "Cinco erros típicos de portugueses", "text": "Traduzir à letra do português leva a estes erros:\n• idade usa o verbo *be*: *I'm 40* (ou *I'm 40 years old*)\n• *people* é plural: *people are*\n• *explain* pede *to*: *explain to me*\n• *agree* é um verbo, sem *am*: *I agree*\n• *depend* usa *on*: *it depends on the weather*", "say": "I'm forty. People are friendly here. Can you explain it to me? I agree. It depends on the weather.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"r\" d=\"M16 24.2L133.4 24.2\"/><path class=\"s\" d=\"M158 24L184 24\"/><path class=\"s\" d=\"M178.6 26.6L184 24L178.6 21.4\"/><path class=\"r\" d=\"M16 56.2L88 56.2\"/><path class=\"s\" d=\"M158 56L184 56\"/><path class=\"s\" d=\"M178.6 58.6L184 56L178.6 53.4\"/><path class=\"r\" d=\"M16 88.2L95.6 88.2\"/><path class=\"s\" d=\"M158 88L184 88\"/><path class=\"s\" d=\"M178.6 90.6L184 88L178.6 85.4\"/><path class=\"r\" d=\"M16 120.2L88 120.2\"/><path class=\"s\" d=\"M158 120L184 120\"/><path class=\"s\" d=\"M178.6 122.6L184 120L178.6 117.4\"/><path class=\"r\" d=\"M16 152.2L95.6 152.2\"/><path class=\"s\" d=\"M158 152L184 152\"/><path class=\"s\" d=\"M178.6 154.6L184 152L178.6 149.4\"/></g><text class=\"\" x=\"18\" y=\"30\" text-anchor=\"start\" style=\"font-size:18px\">I have 40 years</text><text class=\"a\" x=\"192\" y=\"30\" text-anchor=\"start\" style=\"font-size:19px\">I'm 40</text><text class=\"\" x=\"18\" y=\"62\" text-anchor=\"start\" style=\"font-size:18px\">people is</text><text class=\"a\" x=\"192\" y=\"62\" text-anchor=\"start\" style=\"font-size:19px\">people are</text><text class=\"\" x=\"18\" y=\"94\" text-anchor=\"start\" style=\"font-size:18px\">explain me</text><text class=\"a\" x=\"192\" y=\"94\" text-anchor=\"start\" style=\"font-size:19px\">explain to me</text><text class=\"\" x=\"18\" y=\"126\" text-anchor=\"start\" style=\"font-size:18px\">I'm agree</text><text class=\"a\" x=\"192\" y=\"126\" text-anchor=\"start\" style=\"font-size:19px\">I agree</text><text class=\"\" x=\"18\" y=\"158\" text-anchor=\"start\" style=\"font-size:18px\">depends of</text><text class=\"a\" x=\"192\" y=\"158\" text-anchor=\"start\" style=\"font-size:19px\">depends on</text></svg>"}], "quiz": [{"q": "The meeting is ___ Monday ___ 10:00.", "options": ["in / at", "on / at", "at / on"], "answer": 1, "explain": "Dias levam on; horas levam at: on Monday at 10:00."}, {"q": "We need to ___ a decision today.", "options": ["do", "make"], "answer": 1, "explain": "Decisões \"fazem-se\" com make: make a decision."}, {"q": "We've run ___ coffee.", "options": ["out of", "off", "away"], "answer": 0, "explain": "Run out of = ficar sem."}, {"q": "Qual está correto?", "options": ["I have 40 years.", "I'm 40.", "I'm having 40 years."], "answer": 1, "explain": "Em inglês a idade usa o verbo be: I'm 40 ou I'm 40 years old."}]}]}, "electricity": {"id": "electricity", "topic": "elec", "title": "Electricity", "version": 1, "blurb": "From Ohm's law to the fuse board in your hallway.", "lessons": [{"id": "el-basics", "title": "Voltage, current & resistance", "summary": "The three quantities behind every circuit, and the one law that ties them together.", "cards": [{"type": "concept", "title": "Electricity is moving charge", "text": "A current is a flow of electric charge. In a metal wire it's electrons nudging each other along. Each electron drifts slowly, but the push travels through the wire almost instantly, like water already filling a hose.\n\nBy convention, current is drawn flowing from + to −, the opposite way to the electrons. Every circuit diagram uses this convention.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M20 70L300 70\"/><path class=\"s\" d=\"M20 110L300 110\"/><circle class=\"s bgf\" cx=\"55\" cy=\"90\" r=\"9\"/><circle class=\"s bgf\" cx=\"115\" cy=\"90\" r=\"9\"/><circle class=\"s bgf\" cx=\"175\" cy=\"90\" r=\"9\"/><circle class=\"s bgf\" cx=\"235\" cy=\"90\" r=\"9\"/><circle class=\"s bgf\" cx=\"285\" cy=\"90\" r=\"9\"/><path class=\"a\" d=\"M90 135L230 135\"/><path class=\"a\" d=\"M222.8 138.5L230 135L222.8 131.5\"/><path class=\"r\" d=\"M230 48L90 48\"/><path class=\"r\" d=\"M97.2 44.5L90 48L97.2 51.5\"/></g><text class=\"\" x=\"55\" y=\"96\" text-anchor=\"middle\" style=\"font-size:20px\">−</text><text class=\"\" x=\"115\" y=\"96\" text-anchor=\"middle\" style=\"font-size:20px\">−</text><text class=\"\" x=\"175\" y=\"96\" text-anchor=\"middle\" style=\"font-size:20px\">−</text><text class=\"\" x=\"235\" y=\"96\" text-anchor=\"middle\" style=\"font-size:20px\">−</text><text class=\"\" x=\"285\" y=\"96\" text-anchor=\"middle\" style=\"font-size:20px\">−</text><text class=\"a\" x=\"160\" y=\"157\" text-anchor=\"middle\">electrons drift this way</text><text class=\"r\" x=\"160\" y=\"36\" text-anchor=\"middle\">current, by convention</text><text class=\"\" x=\"10\" y=\"97\" text-anchor=\"middle\" style=\"font-size:26px\">−</text><text class=\"\" x=\"312\" y=\"97\" text-anchor=\"middle\" style=\"font-size:26px\">+</text></svg>"}, {"type": "concept", "title": "The water analogy", "text": "Picture a tank feeding a pipe.\n• Voltage is the pressure, set by how high the water stands.\n• Current is how much water flows per second.\n• Resistance is a narrow section of pipe that limits the flow.\n\nMore pressure pushes more flow; a narrower pipe allows less. That's the whole idea behind Ohm's law.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"w\" x=\"42\" y=\"55\" width=\"66\" height=\"83\" rx=\"0\"/><path class=\"s\" d=\"M40 25 V140 H110 V25\"/><path class=\"a\" d=\"M42 55L108 55\"/><rect class=\"w\" x=\"110\" y=\"119\" width=\"70\" height=\"12\" rx=\"0\"/><rect class=\"w\" x=\"180\" y=\"124\" width=\"55\" height=\"2\" rx=\"0\"/><rect class=\"w\" x=\"235\" y=\"119\" width=\"65\" height=\"12\" rx=\"0\"/><path class=\"s\" d=\"M110 118 H180 V123 H235 V118 H300\"/><path class=\"s\" d=\"M110 132 H180 V127 H235 V132 H300\"/><path class=\"r\" d=\"M24 135L24 60\"/><path class=\"r\" d=\"M27.5 67.2L24 60L20.5 67.2\"/><path class=\"r\" d=\"M24 60L24 135\"/><path class=\"r\" d=\"M20.5 127.8L24 135L27.5 127.8\"/><path class=\"a\" d=\"M250 108L295 108\"/><path class=\"a\" d=\"M287.8 111.5L295 108L287.8 104.5\"/><path class=\"a\" d=\"M130 108L170 108\"/><path class=\"a\" d=\"M162.8 111.5L170 108L162.8 104.5\"/></g><text class=\"r\" x=\"78\" y=\"168\" text-anchor=\"middle\">height ≈ voltage</text><text class=\"a\" x=\"220\" y=\"98\" text-anchor=\"middle\">flow ≈ current</text><text class=\"\" x=\"208\" y=\"152\" text-anchor=\"middle\">narrow ≈ resistance</text></svg>"}, {"type": "formula", "title": "Ohm's law", "formula": "V = I × R", "text": "Voltage (volts, V) equals current (amps, A) times resistance (ohms, Ω). Cover the quantity you want in the triangle and the other two tell you how to get it.", "example": ["12 V battery across a 4 Ω heater", "I = V ÷ R = 12 ÷ 4", "= 3 A"], "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M110 20 L20 160 H200 Z\"/><path class=\"s\" d=\"M62 95L158 95\"/><path class=\"s\" d=\"M110 95L110 160\"/></g><text class=\"\" x=\"110\" y=\"82\" text-anchor=\"middle\" style=\"font-size:34px\">V</text><text class=\"\" x=\"70\" y=\"146\" text-anchor=\"middle\" style=\"font-size:34px\">I</text><text class=\"\" x=\"150\" y=\"146\" text-anchor=\"middle\" style=\"font-size:34px\">R</text><text class=\"a\" x=\"268\" y=\"62\" text-anchor=\"middle\" style=\"font-size:22px\">V = I × R</text><text class=\"a\" x=\"268\" y=\"98\" text-anchor=\"middle\" style=\"font-size:22px\">I = V ÷ R</text><text class=\"a\" x=\"268\" y=\"134\" text-anchor=\"middle\" style=\"font-size:22px\">R = V ÷ I</text></svg>"}, {"type": "widget", "widget": "ohm", "title": "Try it: dim the bulb", "text": "Change the voltage and the resistance. Watch the current and the power the bulb turns into light and heat."}, {"type": "fact", "title": "It's the current that hurts", "text": "Your body is a resistor too. What matters for safety is how much current passes through it, and which way.\nAround 1 mA you feel a tingle. Near 10 mA muscles can lock and you may not be able to let go. From roughly 50–100 mA across the chest, the heart can go into fibrillation.\n\nThat's why home RCDs trip at 30 mA: well before the dangerous zone.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"rz\" x=\"215\" y=\"98\" width=\"85\" height=\"24\" rx=\"2\"/><path class=\"s\" d=\"M20 110L300 110\"/><path class=\"s\" d=\"M40 103L40 117\"/><path class=\"s\" d=\"M120 103L120 117\"/><path class=\"s\" d=\"M170 103L170 117\"/><path class=\"s\" d=\"M250 103L250 117\"/><path class=\"a\" d=\"M170 72L170 102\"/></g><text class=\"\" x=\"40\" y=\"92\" text-anchor=\"middle\">feel it</text><text class=\"\" x=\"115\" y=\"92\" text-anchor=\"middle\">can't let go</text><text class=\"a\" x=\"170\" y=\"64\" text-anchor=\"middle\">RCD trips</text><text class=\"r\" x=\"255\" y=\"92\" text-anchor=\"middle\">heart risk</text><text class=\"\" x=\"40\" y=\"140\" text-anchor=\"middle\" style=\"font-size:16px\">1 mA</text><text class=\"\" x=\"120\" y=\"140\" text-anchor=\"middle\" style=\"font-size:16px\">10 mA</text><text class=\"a\" x=\"170\" y=\"140\" text-anchor=\"middle\" style=\"font-size:16px\">30 mA</text><text class=\"r\" x=\"250\" y=\"140\" text-anchor=\"middle\" style=\"font-size:16px\">100 mA</text><text class=\"\" x=\"160\" y=\"172\" text-anchor=\"middle\" style=\"font-size:15px\">current through the body (log scale)</text></svg>"}], "quiz": [{"q": "A 9 V battery drives current through a 450 Ω resistor. What is the current?", "options": ["20 mA", "2 A", "4 mA", "50 mA"], "answer": 0, "explain": "I = V ÷ R = 9 ÷ 450 = 0.02 A, which is 20 mA."}, {"q": "In the water analogy, what plays the role of voltage?", "options": ["How fast the water flows", "The water pressure (tank height)", "The width of the pipe"], "answer": 1, "explain": "Voltage is the push, like pressure. Flow is current; pipe narrowness is resistance."}, {"q": "You double the resistance and keep the voltage the same. The current…", "options": ["doubles", "stays the same", "halves"], "answer": 2, "explain": "I = V ÷ R. Twice the R with the same V gives half the current."}]}, {"id": "el-home", "title": "Circuits at home", "summary": "Series vs parallel, power, and what the breakers in your board actually do.", "cards": [{"type": "concept", "title": "Series vs. parallel", "text": "In series, components share a single loop. The same current flows through each and the voltage is split between them. One break stops everything, like old Christmas lights.\n\nIn parallel, each component has its own path to the supply. Each gets the full voltage and can be switched on or off independently.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M20 95 V60 H140 V150 H20 V115\"/><path class=\"s\" d=\"M7 101L33 101\"/><path class=\"s\" d=\"M14 109L26 109\"/><circle class=\"s bgf\" cx=\"60\" cy=\"60\" r=\"11\"/><path class=\"s\" d=\"M53.2 53.2L66.8 66.8\"/><path class=\"s\" d=\"M66.8 53.2L53.2 66.8\"/><circle class=\"s bgf\" cx=\"100\" cy=\"60\" r=\"11\"/><path class=\"s\" d=\"M93.2 53.2L106.8 66.8\"/><path class=\"s\" d=\"M106.8 53.2L93.2 66.8\"/><path class=\"s\" d=\"M180 95 V60 H300 V150 H180 V115\"/><path class=\"s\" d=\"M240 60L240 150\"/><path class=\"s\" d=\"M167 101L193 101\"/><path class=\"s\" d=\"M174 109L186 109\"/><circle class=\"s bgf\" cx=\"240\" cy=\"105\" r=\"11\"/><path class=\"s\" d=\"M233.2 98.2L246.8 111.8\"/><path class=\"s\" d=\"M246.8 98.2L233.2 111.8\"/><circle class=\"s bgf\" cx=\"300\" cy=\"105\" r=\"11\"/><path class=\"s\" d=\"M293.2 98.2L306.8 111.8\"/><path class=\"s\" d=\"M306.8 98.2L293.2 111.8\"/></g><text class=\"a\" x=\"80\" y=\"34\" text-anchor=\"middle\" style=\"font-size:22px\">series</text><text class=\"\" x=\"80\" y=\"172\" text-anchor=\"middle\" style=\"font-size:16px\">one shared path</text><text class=\"a\" x=\"240\" y=\"34\" text-anchor=\"middle\" style=\"font-size:22px\">parallel</text><text class=\"\" x=\"240\" y=\"172\" text-anchor=\"middle\" style=\"font-size:16px\">a path each</text></svg>"}, {"type": "concept", "title": "Your house is wired in parallel", "text": "Every socket and light hangs between the live (L) and neutral (N) conductors. That's why each appliance gets the full 230 V, and why switching off the kettle doesn't turn off the fridge.\n\nThe more you plug in, the more total current flows in the live wire. That total is what breakers watch.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"r\" d=\"M20 45L300 45\"/><path class=\"s\" d=\"M20 150L300 150\"/><path class=\"s\" d=\"M80 45L80 80\"/><rect class=\"s bgf\" x=\"65\" y=\"80\" width=\"30\" height=\"40\" rx=\"3\"/><path class=\"s\" d=\"M80 120L80 150\"/><path class=\"s\" d=\"M160 45L160 86\"/><circle class=\"s bgf\" cx=\"160\" cy=\"97\" r=\"11\"/><path class=\"s\" d=\"M153.2 90.2L166.8 103.8\"/><path class=\"s\" d=\"M166.8 90.2L153.2 103.8\"/><path class=\"s\" d=\"M160 108L160 150\"/><path class=\"s\" d=\"M240 45L240 72\"/><rect class=\"s bgf\" x=\"225\" y=\"72\" width=\"30\" height=\"56\" rx=\"3\"/><path class=\"s\" d=\"M225 95L255 95\"/><path class=\"s\" d=\"M240 128L240 150\"/></g><text class=\"r\" x=\"22\" y=\"33\" text-anchor=\"start\">L  230 V</text><text class=\"\" x=\"22\" y=\"172\" text-anchor=\"start\">N</text><text class=\"\" x=\"100\" y=\"104\" text-anchor=\"start\" style=\"font-size:16px\">kettle</text><text class=\"\" x=\"176\" y=\"104\" text-anchor=\"start\" style=\"font-size:16px\">lamp</text><text class=\"\" x=\"260\" y=\"104\" text-anchor=\"start\" style=\"font-size:16px\">fridge</text></svg>"}, {"type": "formula", "title": "Power", "formula": "P = V × I", "text": "Power (watts) is how fast energy is used. Multiply the voltage by the current. Rearranged, I = P ÷ V tells you how much current an appliance draws.", "example": ["2300 W kettle on 230 V", "I = 2300 ÷ 230", "= 10 A"], "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s bgf\" d=\"M110 150 L120 70 H190 L200 150 Z\"/><path class=\"s\" d=\"M130 62L180 62\"/><path class=\"s\" d=\"M190 82 C232 82 232 140 197 140\"/><path class=\"s\" d=\"M120 92 L96 76 L101 70\"/><rect class=\"s\" x=\"100\" y=\"150\" width=\"110\" height=\"9\" rx=\"3\"/><path class=\"a\" d=\"M145 52 c-6 -8 6 -14 0 -22\"/><path class=\"a\" d=\"M165 52 c-6 -8 6 -14 0 -22\"/></g><text class=\"r\" x=\"275\" y=\"82\" text-anchor=\"middle\" style=\"font-size:22px\">2300 W</text><text class=\"\" x=\"275\" y=\"110\" text-anchor=\"middle\" style=\"font-size:20px\">÷ 230 V</text><text class=\"a\" x=\"275\" y=\"140\" text-anchor=\"middle\" style=\"font-size:24px\">= 10 A</text></svg>"}, {"type": "concept", "title": "Breakers vs. RCDs", "text": "A breaker (MCB) protects the cable. If too much current flows, the wire would overheat, so it trips. A 16 A breaker on a socket circuit is typical.\n\nAn RCD protects people. It compares the current going out on live with the current coming back on neutral. If about 30 mA is missing, it has leaked somewhere, maybe through a person, and it trips in a fraction of a second.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"r\" d=\"M20 70L270 70\"/><path class=\"s\" d=\"M20 110L270 110\"/><ellipse class=\"s\" cx=\"150\" cy=\"90\" rx=\"16\" ry=\"42\"/><rect class=\"s bgf\" x=\"270\" y=\"58\" width=\"36\" height=\"64\" rx=\"3\"/><path class=\"r\" d=\"M40 56L100 56\"/><path class=\"r\" d=\"M92.8 59.5L100 56L92.8 52.5\"/><path class=\"a\" d=\"M110 124L40 124\"/><path class=\"a\" d=\"M47.2 120.5L40 124L47.2 127.5\"/></g><text class=\"r\" x=\"70\" y=\"46\" text-anchor=\"middle\" style=\"font-size:16px\">10.00 A out</text><text class=\"\" x=\"75\" y=\"142\" text-anchor=\"middle\" style=\"font-size:16px\">9.97 A back</text><text class=\"\" x=\"288\" y=\"95\" text-anchor=\"middle\" style=\"font-size:15px\">load</text><text class=\"r\" x=\"200\" y=\"170\" text-anchor=\"middle\" style=\"font-size:18px\">30 mA missing → trip!</text></svg>"}, {"type": "example", "title": "Reading your bill: kWh", "text": "You pay for energy, not power. Energy = power × time, measured in kilowatt-hours (kWh). One kWh is 1 kW running for one hour.", "example": ["2 kW heater for 3 hours", "2 kW × 3 h = 6 kWh", "at €0.20 per kWh → €1.20"], "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><rect class=\"s\" x=\"60\" y=\"38\" width=\"200\" height=\"104\" rx=\"8\"/><rect class=\"s bgf\" x=\"80\" y=\"62\" width=\"160\" height=\"38\" rx=\"3\"/><circle class=\"a\" cx=\"160\" cy=\"122\" r=\"6\"/></g><text class=\"mono\" x=\"160\" y=\"89\" text-anchor=\"middle\" style=\"font-size:20px\">0 1 2 4 6.8</text><text class=\"a\" x=\"230\" y=\"128\" text-anchor=\"middle\" style=\"font-size:18px\">kWh</text><text class=\"\" x=\"160\" y=\"170\" text-anchor=\"middle\" style=\"font-size:17px\">energy = power × time</text></svg>"}], "quiz": [{"q": "Why does each socket in a house get the full 230 V?", "options": ["They're wired in series", "They're wired in parallel", "Each socket has its own transformer"], "answer": 1, "explain": "In parallel, every load sits directly between live and neutral, so each sees the full supply voltage."}, {"q": "A 1150 W heater runs on 230 V. How much current does it draw?", "options": ["0.2 A", "5 A", "50 A", "23 A"], "answer": 1, "explain": "I = P ÷ V = 1150 ÷ 230 = 5 A."}, {"q": "What makes an RCD trip?", "options": ["Total current above its rating", "Current going out on live doesn't all return on neutral", "Voltage drops below 200 V"], "answer": 1, "explain": "An RCD measures the imbalance between live and neutral. Overcurrent is the breaker's job."}, {"q": "A 1.5 kW oven runs for 4 hours. How much energy is that?", "options": ["6 kWh", "1.5 kWh", "375 Wh"], "answer": 0, "explain": "1.5 kW × 4 h = 6 kWh."}]}]}, "electronics": {"id": "electronics", "topic": "tron", "title": "Electronics", "version": 1, "blurb": "Components and signals for tinkering with microcontrollers.", "lessons": [{"id": "tr-parts", "title": "Components you meet first", "summary": "Resistors, LEDs, capacitors and the voltage divider: the parts in every maker kit.", "cards": [{"type": "concept", "title": "Reading a resistor", "text": "Resistors are labelled with coloured bands. The first two are digits, the third is a multiplier, and a gold or silver band at the end gives the tolerance.\n\nBlack 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8, white 9.", "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M20 90L100 90\"/><path class=\"s\" d=\"M220 90L300 90\"/><rect class=\"s bgf\" x=\"100\" y=\"72\" width=\"120\" height=\"36\" rx=\"16\"/><rect x=\"122\" y=\"73\" width=\"10\" height=\"34\" fill=\"#8B4513\" stroke=\"var(--ink)\" stroke-width=\"1\"/><rect x=\"142\" y=\"73\" width=\"10\" height=\"34\" fill=\"#1a1a1a\" stroke=\"var(--ink)\" stroke-width=\"1\"/><rect x=\"162\" y=\"73\" width=\"10\" height=\"34\" fill=\"#D23B2B\" stroke=\"var(--ink)\" stroke-width=\"1\"/><rect x=\"196\" y=\"73\" width=\"10\" height=\"34\" fill=\"#C9A227\" stroke=\"var(--ink)\" stroke-width=\"1\"/></g><text class=\"\" x=\"127\" y=\"132\" text-anchor=\"middle\" style=\"font-size:18px\">1</text><text class=\"\" x=\"147\" y=\"132\" text-anchor=\"middle\" style=\"font-size:18px\">0</text><text class=\"\" x=\"170\" y=\"132\" text-anchor=\"middle\" style=\"font-size:15px\">×100</text><text class=\"\" x=\"201\" y=\"62\" text-anchor=\"middle\" style=\"font-size:16px\">±5%</text><text class=\"a\" x=\"160\" y=\"165\" text-anchor=\"middle\" style=\"font-size:22px\">= 1 000 Ω = 1 kΩ</text></svg>"}, {"type": "formula", "title": "Every LED needs a resistor", "formula": "R = (Vs − Vf) ÷ I", "text": "An LED drops a fixed forward voltage (Vf, about 2 V for red, 3 V for white or blue) and will draw as much current as it can get, then burn out. A series resistor takes up the leftover voltage and sets the current.", "example": ["5 V supply, red LED (2 V), 20 mA", "R = (5 − 2) ÷ 0.020", "= 150 Ω"], "sketch": "<svg viewBox=\"0 0 320 180\" xmlns=\"http://www.w3.org/2000/svg\"><g class=\"d\"><path class=\"s\" d=\"M40 95 V40 H110\"/><path class=\"s\" d=\"M110 40L115 33L125 47L135 33L145 47L155 33L165 47L170 40\"/><path class=\"s\" d=\"M170 40 H280 V82\"/><path class=\"s bgf\" d=\"M268 82 H292 L280 102 Z\"/><path class=\"s\" d=\"M268 104L292 104\"/><path class=\"s\" d=\"M280 104 V150 H40 V115\"/><path class=\"s\" d=\"M27 101L53 101\"/><path class=\"s\" d=\"M34 109L46 109\"/><path class=\"a\" d=\"M296 88L312 76\"/><path class=\"a\" d=\"M309.2 81.3L312 76L306.1 77.2\"/><path class=\"a\" d=\"M298 100L314 88\"/><path class=\"a\" d=\"M311.2 93.3L314 88L308.1 89.2\"/><path class=\"a\" d=\"M200 162L120 162\"/><path class=\"a\" d=\"M127.2 158.5L120 162L127.2 165.5\"/></g><text class=\"\" x=\"140\" y=\"24\" text-anchor=\"middle\" style=\"font-size:18px\">150 Ω</text><text class=\"\" x=\"62\" y=\"110\" text-anchor=\"start\" style=\"font-size:18px\">5 V</text><text class=\"\" x=\"262\" y=\"96\" text-anchor=\"end\" style=\"font-size:16px\">LED 2 V</text><text class=\"a\" x=\"160\" y=\"176\" text-anchor=\"middle\" style=\"font-size:14px\">20 mA</text></svg>"}, {"type": "concept", "title": "Capacitors store charge", "text": "A capacitor is two plates separated by an insulator. Connect it to a voltage and charge piles up on the plates until it matches the supply. It charges quickly at first, then slows down.\n\nIn practice they smooth out ripples on a power rail and supply short bursts of current, which is why you see one next to almost ev
