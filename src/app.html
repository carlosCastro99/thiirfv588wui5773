<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5FD1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Spark Notebook</title>
<style>
@font-face{font-family:'Caveat';font-weight:600;font-display:swap;src:url(data:font/woff2;base64,/*FONT:caveat-600*/) format('woff2')}@font-face{font-family:'Caveat';font-weight:700;font-display:swap;src:url(data:font/woff2;base64,/*FONT:caveat-700*/) format('woff2')}@font-face{font-family:'Archivo';font-weight:800;font-display:swap;src:url(data:font/woff2;base64,/*FONT:archivo-800*/) format('woff2')}
/* Layout: engineer's notebook. Phone-width shell (max 560px), graph-paper sketch panels, fixed bottom tab bar, full-screen lesson reader. Dark mode is a blueprint. */
[hidden]{display:none!important}
:root{
  --bg:#EDF1F6; --paper:#FBFCFE; --grid:#E0E7F1; --ink:#1B2433; --muted:#5E6A7D; --line:#D3DBE6;
  --pen:#1F5FD1; --pen-ink:#FFFFFF; --red:#D64533; --hl:rgba(255,206,40,.55); --ok:#138A5E; --flame:#E08A00;
  --t-elec:#B57E00; --t-tron:#12805C; --t-mech:#C2410C; --t-sci:#6D3FC4; --t-ai:#C0267A; --t-hist:#8A5A2B; --t-world:#00838F; --t-eng:#3F3FB5; --t-gen:#4D7C0F; --t-corp:#475569; --t-psy:#9333EA; --t-space:#1E3A8A; --t-body:#B91C1C; --t-nature:#15803D; --t-money:#0F766E; --t-phil:#57534E; --t-art:#BE185D; --t-math:#0369A1;
  --f-display:"Archivo","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print","Comic Sans MS","PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",cursive;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1424; --paper:#0F2139; --grid:#183052; --ink:#E4ECF7; --muted:#93A4BD; --line:#22395A;
  --pen:#7DB3FF; --pen-ink:#0A1424; --red:#FF8B78; --hl:rgba(255,206,40,.28); --ok:#4FD39A; --flame:#F5B53A;
  --t-elec:#F2C14E; --t-tron:#5CD6A6; --t-mech:#FB8B5B; --t-sci:#B79BFF; --t-ai:#F78DC2; --t-hist:#E0AE78; --t-world:#4DD0E1; --t-eng:#A9A9FF; --t-gen:#A3D95B; --t-corp:#A9B8CC; --t-psy:#D8B4FE; --t-space:#93B4FF; --t-body:#FCA5A5; --t-nature:#86EFAC; --t-money:#5EEAD4; --t-phil:#D6D3D1; --t-art:#F9A8D4; --t-math:#7DD3FC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1424; --paper:#0F2139; --grid:#183052; --ink:#E4ECF7; --muted:#93A4BD; --line:#22395A;
  --pen:#7DB3FF; --pen-ink:#0A1424; --red:#FF8B78; --hl:rgba(255,206,40,.28); --ok:#4FD39A; --flame:#F5B53A;
  --t-elec:#F2C14E; --t-tron:#5CD6A6; --t-mech:#FB8B5B; --t-sci:#B79BFF; --t-ai:#F78DC2; --t-hist:#E0AE78; --t-world:#4DD0E1; --t-eng:#A9A9FF; --t-gen:#A3D95B; --t-corp:#A9B8CC; --t-psy:#D8B4FE; --t-space:#93B4FF; --t-body:#FCA5A5; --t-nature:#86EFAC; --t-money:#5EEAD4; --t-phil:#D6D3D1; --t-art:#F9A8D4; --t-math:#7DD3FC; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px calc(104px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:800}
h3{font-size:17px;font-weight:800}
p{margin:0}
.hand{font-family:var(--f-hand);font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.sm{font-size:13.5px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--pen);color:var(--pen-ink);font-weight:650}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:6px 13px;font-size:13.5px}
.btn.danger{background:var(--red);color:#fff}
.link{background:none;border:0;color:var(--pen);font-weight:650;padding:4px 0}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:650;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:var(--ok)} .pill.off{color:var(--red);border-color:var(--red)}
[data-t]{--topic:var(--pen)}
[data-t="elec"]{--topic:var(--t-elec)}[data-t="tron"]{--topic:var(--t-tron)}[data-t="mech"]{--topic:var(--t-mech)}[data-t="sci"]{--topic:var(--t-sci)}[data-t="ai"]{--topic:var(--t-ai)}[data-t="hist"]{--topic:var(--t-hist)}[data-t="world"]{--topic:var(--t-world)}[data-t="eng"]{--topic:var(--t-eng)}[data-t="gen"]{--topic:var(--t-gen)}[data-t="corp"]{--topic:var(--t-corp)}[data-t="psy"]{--topic:var(--t-psy)}[data-t="space"]{--topic:var(--t-space)}[data-t="body"]{--topic:var(--t-body)}[data-t="nature"]{--topic:var(--t-nature)}[data-t="money"]{--topic:var(--t-money)}[data-t="phil"]{--topic:var(--t-phil)}[data-t="art"]{--topic:var(--t-art)}[data-t="math"]{--topic:var(--t-math)}
[data-t^="c-"]{--topic:#B4530F}@media (prefers-color-scheme:dark){[data-t^="c-"]{--topic:#F59E0B}}
.tlabel{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--topic)}
.tdot{width:8px;height:8px;border-radius:2px;background:var(--topic);flex:none;transform:rotate(45deg)}
.bar{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--topic)}

/* graph paper + sketches */
.paper{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;background-position:-1px -1px}
.sk{border-radius:14px;border:1px solid var(--line);overflow:hidden}
.sk svg{display:block;width:100%;height:auto;overflow:visible}
.sk .d{filter:url(#rough)}
.sk .s,.sk .a,.sk .r,.sk .dash,.sk .dashr{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sk .s{stroke:var(--ink)} .sk .a{stroke:var(--pen)} .sk .r{stroke:var(--red)}
.sk .dash{stroke:var(--muted);stroke-dasharray:5 5;stroke-width:1.6} .sk .dashr{stroke:var(--red);stroke-dasharray:6 5;stroke-width:1.8}
.sk .bgf{fill:var(--paper)} .sk .bgr{fill:var(--paper);stroke:none}
.sk .w{fill:var(--pen);opacity:.2} .sk .y{fill:var(--hl)} .sk .rz{fill:var(--red);opacity:.2}
.sk .fi{fill:var(--ink)} .sk .fhl{fill:var(--hl)} .sk .fpen{fill:var(--pen)} .sk .fred{fill:var(--red)}
.sk text{font-family:var(--f-hand);font-weight:600;font-size:19px;fill:var(--ink)}
.sk text[class]{stroke:none} .sk text.a{fill:var(--pen)} .sk text.r{fill:var(--red)} .sk text.tp{fill:var(--paper)} .sk text.mono{font-family:var(--f-mono);font-weight:500}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px}
.ring{width:88px;height:88px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.ring .n small{display:block;font-family:var(--f-mono);font-size:9px;font-weight:500;color:var(--muted);margin-top:4px}
.flame{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--flame)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,24px));gap:4px;margin-top:10px}
.week span{height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;background:var(--bg);color:var(--muted)}
.week span.on{background:var(--flame);color:#1b1300}
.week span.today{outline:1.5px solid var(--ink)}
.cont{display:flex;flex-direction:column;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;padding:0;width:100%;color:var(--ink)}
.cont .sk{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.cont .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.rev{display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--red) 10%,var(--paper));border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));border-radius:16px;padding:14px;width:100%;text-align:left;color:var(--ink)}
.rev b{font-family:var(--f-display);font-size:26px;color:var(--red);min-width:32px;text-align:center}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--topic);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink)}

/* learn */
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search input{border:0;background:transparent;flex:1;padding:12px 0;outline:none;min-width:0}
.pack{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pack .band{height:8px;background:var(--topic)}
.pack .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.facts{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--ok)}
.lesson{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%;color:var(--ink)}
.lesson .num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:26px;color:var(--topic);border:1.5px solid var(--topic)}
.lesson.done .num{background:var(--topic);color:var(--paper)}
.res{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;width:100%;color:var(--ink)}
.res .sk{border-radius:10px}
.res h3{font-size:15px}
.thumbph{aspect-ratio:16/9;border-radius:10px;display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:22px;color:var(--topic)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.scard .open{border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.scard .sk{border:0;border-radius:0;border-bottom:1px solid var(--line)}
.scard .t{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px}
.scard h3{font-size:14px}
.scard .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:16px;line-height:1}

/* you */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.chart{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;align-items:end;height:90px;margin-top:12px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pen);border-radius:4px 4px 2px 2px;min-height:3px}
.bars i.zero{background:var(--line)}
.axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:650}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.hrow{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%;color:var(--ink)}
.hrow .meta{flex:1;min-width:0}
.hrow h3{font-size:14.5px}
.note{background:color-mix(in srgb,var(--pen) 10%,var(--paper));border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--pen)}


/* deep dive sheet */
.deep{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:dIn .22s ease}
@keyframes dIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.dtop{max-width:640px;width:100%;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 28px}
.dcard{max-width:600px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--topic);border-radius:22px;padding:20px 20px 24px;display:flex;flex-direction:column;gap:14px}
.dcard>*{flex-shrink:0}
.dcard h2{font-size:26px;line-height:1.15}
.dcard h3{font-family:var(--f-display);font-size:18px;margin-top:6px;color:var(--topic)}
.dcard p,.dcard li{font-size:16.5px;line-height:1.62}
.dcard ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.dlead{background:color-mix(in srgb,var(--topic) 8%,transparent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dlead .eyebrow,.dsec{color:var(--topic)}
.dsec{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px;margin-top:4px}
.dsec::after{content:"";flex:1;height:1px;background:var(--line)}
.dkey{border-left:4px solid var(--topic);padding:8px 12px;background:color-mix(in srgb,var(--topic) 7%,transparent);border-radius:0 12px 12px 0;font-size:16.5px;line-height:1.55}
.dkey b,.dfact b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;color:var(--topic)}
.dmyth{display:grid;gap:6px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.dmyth div{display:flex;gap:8px;align-items:baseline;font-size:16px;line-height:1.5}
.dmyth i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:5px;flex:none}
.dmyth .m i{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)} .dmyth .m span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--red) 60%,transparent);color:var(--muted)}
.dmyth .t i{background:color-mix(in srgb,var(--pen) 16%,transparent);color:var(--pen)}
.dfact{border:1.5px dashed var(--topic);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.55}
.dfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.deepbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--topic);color:var(--topic);background:color-mix(in srgb,var(--topic) 8%,transparent);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px}
.deepbtn svg{width:18px;height:18px}
.fbtn.deepf svg{border-color:var(--topic);color:var(--topic);background:color-mix(in srgb,var(--topic) 10%,var(--paper))}
.fbtn.deepf span{color:var(--topic)}
/* reader */
.reader{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rtop{max-width:600px;width:100%;margin:0 auto;padding:10px 16px 8px;display:flex;flex-direction:column;gap:10px}
.prog{display:flex;gap:3px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--topic)}
.prog i.q{background:color-mix(in srgb,var(--topic) 30%,var(--line))}
.prog i.q.on{background:var(--topic)}
.rstage{flex:1;display:flex;justify-content:center;padding:4px 16px;overflow:hidden;min-height:0}
.card{width:100%;max-width:560px;height:100%;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px 20px 24px;display:flex;flex-direction:column;gap:16px;touch-action:pan-y;transition:transform .25s ease,opacity .25s ease;overscroll-behavior:contain}
.card.drag{transition:none}
.card>*{flex-shrink:0}
.cont>*,.scard>*,.wg>*,.pack>*{flex-shrink:0}
.ctype{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:color-mix(in srgb,var(--topic) 14%,transparent);color:var(--topic);font-weight:600}
.card h2{font-size:25px;line-height:1.15}
.card .text{display:flex;flex-direction:column;gap:10px;font-size:16.5px;line-height:1.6}
.card .text ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.formula{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.01em;align-self:flex-start;padding:2px 10px;background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
.ex{border:1.5px dashed var(--topic);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ex .eyebrow{color:var(--topic);margin-bottom:4px}
.ex span{font-family:var(--f-hand);font-weight:600;font-size:22px;line-height:1.25}
.ex span:last-child{color:var(--red);font-size:26px}

<script>
"use strict";
const CATALOG=/*CATALOG*/;
const BUNDLE={};
/*INCLUDE:i18n.js*/
let TOPICS={...STR.en.topics},TYPES={...STR.en.types};

/* ---------- storage ---------- */
const KEY="spark-state-v1";
const dayStr=d=>d.toLocaleDateString("en-CA");
const today=()=>dayStr(new Date());
function defaults(){return{feed:{topic:{},seen:{}},saved:[],favL:[],favT:{},seen:{},reads:{},log:[],quiz:{},review:{},done:{},goal:10,best:0,lang:null,region:null,ent:{plus:false,packs:[]}}}
let S=defaults();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(defaults(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast(t("storageFull"))}}
function applyLang(){LANG=LANGS[S.lang]?S.lang:"en";TOPICS={...STR.en.topics,...(STR[LANG].topics||{})};TYPES={...STR.en.types,...(STR[LANG].types||{})};document.documentElement.lang=LANGS[LANG].locale}
if(!S.lang)S.lang=detectLang();if(S.region===null)S.region=detectRegion();applyLang();

/* ---------- catalog: language, audience, country ---------- */
const catOf=id=>CATALOG.find(c=>c.id===id);
const audienceOK=c=>!c.only||c.only.includes(LANG);
const visibleCat=()=>CATALOG.filter(audienceOK);
const isCountry=c=>!!(c&&c.country);
/* which language a pack should be shown in: the UI language when translated, otherwise its base */
function packLang(c){if(!c)return "en";const langs=c.langs||[c.base||"en"];if(langs.includes(LANG))return LANG;if(LANG==="pt-BR"&&langs.includes("pt-PT"))return "pt-PT";if(LANG==="pt-PT"&&langs.includes("pt-BR"))return "pt-BR";return c.base||"en"}
const packURL=(id,lang)=>{const c=catOf(id);return lang===(c&&c.base||"en")?`packs/${id}.json`:`packs/${lang}/${id}.json`};
const catTitle=c=>(c.i18n&&c.i18n[LANG]&&c.i18n[LANG].title)||c.title;
const catBlurb=c=>(c.i18n&&c.i18n[LANG]&&c.i18n[LANG].blurb)||c.blurb;
const catVersion=(c,lang)=>(c.vers&&c.vers[lang])||c.version;
const catFree=c=>c.free||1;

/* ---------- entitlements (StoreKit in the iOS app; simulated in web preview) ---------- */
const NATIVE=window.SparkStore||null;
const GATING=!!NATIVE||(()=>{try{const q=new URLSearchParams(location.search);if(q.has("store"))sessionStorage.setItem("spark-store",q.get("store")||"1");return !!sessionStorage.getItem("spark-store")}catch(e){return false}})();
const PRICES={plus_y:"€29,99",plus_m:"€4,99",pack:"€4,99"};
function ownsPack(id){return !GATING||S.ent.plus||S.ent.packs.includes(id)}
function lessonFree(L){if(!L)return true;const c=catOf(L.pack);return L.n<=catFree(c||{})}
function lessonOpen(L){return !L||lessonFree(L)||ownsPack(L.pack)}
const cardOpen=id=>{const c=CARDS[id];return !c||lessonOpen(LESSONS[c.lesson])};
const DB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open("spark",1);r.onupgradeneeded=()=>r.result.createObjectStore("packs",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const tx=(m,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("packs",m);const r=fn(t.objectStore("packs"));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}));
  const LS="spark-packs-fallback",get=()=>{try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}},set=o=>{try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}};
  return{all:()=>tx("readonly",s=>s.getAll()).catch(()=>Object.values(get())),put:pk=>tx("readwrite",s=>s.put(pk)).catch(()=>{const o=get();o[pk.id]=pk;set(o)}),del:id=>tx("readwrite",s=>s.delete(id)).catch(()=>{const o=get();delete o[id];set(o)})};
})();

let PACKS={},LESSONS={},CARDS={},QUIZ={};
function indexPacks(){
  LESSONS={};CARDS={};QUIZ={};
  for(const pk of Object.values(PACKS)){const c=catOf(pk.id);if(c&&!audienceOK(c))continue;pk.lessons.forEach((l,li)=>{
    const L={...l,pack:pk.id,topic:pk.topic,n:li+1,cardIds:[],quizIds:[]};
    l.cards.forEach((c,k)=>{const id=`${l.id}-c${k}`;CARDS[id]={...c,id,lesson:l.id,topic:pk.topic};L.cardIds.push(id)});
    (l.quiz||[]).forEach((q,k)=>{const id=`${l.id}-q${k}`;QUIZ[id]={...q,id,lesson:l.id,topic:pk.topic};L.quizIds.push(id)});
    LESSONS[l.id]=L;
  })}
  try{FEED.refresh()}catch(e){}
}
async function loadPacks(){const list=await DB.all();PACKS={};(list||[]).forEach(p=>PACKS[p.id]=p);indexPacks()}
const validPack=p=>p&&typeof p.id==="string"&&TOPICS[p.topic]&&Array.isArray(p.lessons)&&p.lessons.every(l=>l.id&&Array.isArray(l.cards));
async function downloadPack(id){
  const c=catOf(id),base=(c&&c.base)||"en",lang=packLang(c);let pk=null,got=lang;
  try{const r=await fetch(packURL(id,lang),{cache:"no-cache"});if(r.ok)pk=await r.json()}catch(e){}
  if(!validPack(pk)&&lang!==base){got=base;try{const r=await fetch(packURL(id,base),{cache:"no-cache"});if(r.ok)pk=await r.json()}catch(e){}}
  if(!validPack(pk))pk=BUNDLE[id];
  if(!validPack(pk))throw new Error("unavailable");
  pk.lang=pk.lang||got;pk.downloadedAt=new Date().toISOString();await DB.put(pk);PACKS[pk.id]=pk;indexPacks();
}
/* packs whose catalog version or language differ from what is on the device */
const stalePacks=()=>CATALOG.filter(c=>PACKS[c.id]&&audienceOK(c)&&(packLang(c)!==(PACKS[c.id].lang||c.base||"en")||catVersion(c,packLang(c))>(PACKS[c.id].version||0))).map(c=>c.id);
async function removePack(id){await DB.del(id);delete PACKS[id];indexPacks()}

/* ---------- progress ---------- */
function markRead(id,log=true){
  const d=today();S.reads[d]=S.reads[d]||[];
  if(!S.reads[d].includes(id))S.reads[d].push(id);
  if(log){S.log=S.log.filter(x=>x.id!==id||dayStr(new Date(x.t))!==d);S.log.push({id,t:Date.now()});if(S.log.length>3000)S.log=S.log.slice(-3000);S.seen[id]=1}
  S.best=Math.max(S.best,streak());save();
}
function streak(){let n=0,d=new Date();if(!(S.reads[dayStr(d)]||[]).length)d.setDate(d.getDate()-1);while((S.reads[dayStr(d)]||[]).length){n++;d.setDate(d.getDate()-1)}return n}
function lessonProgress(L){const seen=L.cardIds.filter(id=>S.seen[id]).length;return{seen,total:L.cardIds.length,done:!!S.done[L.id]}}
function nextLesson(){
  const all=Object.values(LESSONS);
  return all.find(L=>!S.done[L.id]&&L.cardIds.some(id=>S.seen[id]))||all.find(L=>!S.done[L.id])||null;
}
const isFav=id=>S.saved.includes(id)||S.favL.includes(id);
function toggleFav(id,kind){const k=kind==="l"?"favL":"saved";const on=S[k].includes(id);S[k]=on?S[k].filter(x=>x!==id):[...S[k],id];if(on)delete S.favT[id];else S.favT[id]=Date.now();save();toast(on?t("favRemoved"):t("favAdded"));return !on}
const byFavT=(a,b)=>(S.favT[b]||0)-(S.favT[a]||0);
const canSpeak="speechSynthesis" in window;
function speak(text){if(!canSpeak)return toast(t("noSpeech"));try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-GB";u.rate=.9;const vs=speechSynthesis.getVoices();const v=vs.find(v=>/^en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast(t("noSpeech"))}}
const dueReview=()=>Object.entries(S.review).filter(([id,t])=>t<=Date.now()&&QUIZ[id]).map(([id])=>id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=t=>esc(t).replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
function fmt(text){
  return String(text||"").split(/\n\n+/).map(par=>{const lines=par.split("\n");
    if(lines.some(l=>l.startsWith("• "))){const head=lines.filter(l=>!l.startsWith("• ")),items=lines.filter(l=>l.startsWith("• "));
      return (head.length?`<p>${md(head.join(" "))}</p>`:"")+`<ul>${items.map(l=>`<li>${md(l.slice(2))}</li>`).join("")}</ul>`}
    return lines.map(l=>`<p>${md(l)}</p>`).join("")}).join("");
}
/* ---------- generated notebook diagrams (card.viz) ---------- */
const VZ=(()=>{
  const f=n=>Math.round(n*10)/10, CW=.44;
  const CJK=/[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F]/;
  const ln=s=>{let n=0;for(const ch of String(s))n+=CJK.test(ch)?2.25:1;return n};

  if(!card)return;let x0=null,y0=0,dx=0,lock=false;
  card.addEventListener("pointerdown",e=>{if(e.target.closest("button,input,label"))return;x0=e.clientX;y0=e.clientY;dx=0;lock=false;card.classList.add("drag")});
  card.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;if(!lock&&Math.abs(e.clientY-y0)>Math.abs(dx)+4){x0=null;card.classList.remove("drag");card.style.transform="";return}if(Math.abs(dx)>8){lock=true;card.style.transform=`translateX(${dx}px) rotate(${dx/50}deg)`}});
  const end=()=>{if(x0===null)return;x0=null;card.classList.remove("drag");if(Math.abs(dx)>80&&!(dx>0&&R.i===0)){card.style.transform=`translateX(${dx>0?120:-120}%)`;card.style.opacity=0;setTimeout(()=>step(dx>0?-1:1),170)}else card.style.transform=""};
  card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
}

/* ---------- export a topic as a standalone page ---------- */
function packHTML(pk){
  const css=[...document.styleSheets[0].cssRules].map(r=>r.cssText).join("\n");
  const body=pk.lessons.map((l,li)=>`<section><p class="eyebrow">${t("lessonN",{n:li+1})}</p><h2 class="lt">${esc(l.title)}</h2><p class="muted">${esc(l.summary)}</p>
   ${l.cards.map(c=>`<article class="card xc" data-t="${pk.topic}"><span class="ctype">${esc(c.tag||TYPES[c.type])}</span><h2>${esc(c.title)}</h2>${(c.sketch||c.viz)?sketch(c):c.widget?`<div class="sk paper">${WSK()[c.widget]}</div>`:""}${c.formula?`<div class="formula">${esc(c.formula)}</div>`:""}<div class="text">${fmt(c.text)}</div>${c.items?`<div class="text"><ul>${c.items.map(([en,pt,note,ex])=>`<li><b>${esc(en)}</b> = ${esc(pt)}${note?` <span class="muted">(${esc(note)})</span>`:""}${ex?`<br><em>${esc(ex)}</em>`:""}</li>`).join("")}</ul></div>`:""}${c.example?`<div class="ex"><span class="eyebrow">${TYPES.example}</span>${c.example.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}</article>`).join("")}
   ${(l.quiz||[]).length?`<article class="card xc" data-t="${pk.topic}"><span class="ctype">${t("quiz")}</span>${l.quiz.map((q,k)=>`<p><b>${k+1}. ${esc(q.q)}</b></p><ul>${q.options.map((o,j)=>`<li>${j===q.answer?"<b>✓ "+esc(o)+"</b>":esc(o)}</li>`).join("")}</ul><p class="muted sm">${esc(q.explain)}</p>`).join("")}</article>`:""}</section>`).join("");
  return `<!doctype html><html lang="${loc()}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(pk.title)} · Spark</title><style>${css}
  body{padding:24px 16px} main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:28px} section{display:flex;flex-direction:column;gap:14px} .card.xc{height:auto;overflow:visible} .lt{font-size:26px}</style></head>
  <body>${document.querySelector('svg[aria-hidden]').outerHTML}<main><header data-t="${pk.topic}"><span class="tlabel"><span class="tdot"></span>${TOPICS[pk.topic]}</span><h1>${esc(pk.title)}</h1><p class="muted">${esc(pk.blurb)}</p></header>${body}</main></body></html>`;
}

/* ---------- utils ---------- */
let tt;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600)}
async function saveFile(name,text,type){
  const blob=new Blob([text],{type}),mobile=/iPhone|iPad|iPod|Android/.test(navigator.userAgent);
  try{const file=new File([blob],name,{type});if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(t("savedFile",{name}));
}
let deferredInstall=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(view.tab==="you")render()});
addEventListener("online",()=>{if(!R)render()});addEventListener("offline",()=>{if(!R)render()});
(async()=>{
  try{await loadPacks()}catch(e){}
  if(NATIVE&&NATIVE.entitlements){try{const ent=await NATIVE.entitlements();if(ent){S.ent={plus:!!ent.plus,packs:ent.packs||[]};save();indexPacks()}}catch(e){}}
  if(navigator.onLine){const stale=stalePacks();
    if(stale.length)(async()=>{for(const id of stale){try{await downloadPack(id)}catch(e){}}if(!R)render();toast(t("updated",{n:stale.length}))})()}
  try{navigator.storage?.persist?.()}catch(e){}
  if("serviceWorker" in navigator&&(location.protocol==="https:"||["localhost","127.0.0.1"].includes(location.hostname)))navigator.serviceWorker.register("sw.js").catch(()=>{});
  render();
})();
